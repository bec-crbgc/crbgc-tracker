<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRBGC Activity Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --hdr:#1C3C6B;--hdr2:#2C5F9E;--tp:#1a1a1a;--ts:#555;--tm:#888;
  --o1:#E1F5EE;--o1t:#085041;--o2:#E6F1FB;--o2t:#0C447C;--o3:#FAEEDA;--o3t:#633806;
  --green:#C6EFCE;--greent:#375623;--amber:#FFEB9C;--ambert:#7D6608;
  --red:#FFC7CE;--redt:#9C0006;--redbg:#FFF5F5;
  --s1:#F8F9FA;--s2:#F0F2F5;--bd:#E0E0E0;--bds:#CCCCCC;
  --r:8px;--r2:12px;--accent:#1a73e8;
  font-family:Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f2f5;min-height:100vh;font-size:14px;color:var(--tp);overscroll-behavior-y:contain;}
#app{max-width:520px;margin:0 auto;padding:0 0 80px;}
/* Header */
.hdr{background:var(--hdr);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;}
.hdr-title{font-size:15px;font-weight:700;}
.hdr-sub{font-size:11px;opacity:.75;margin-top:2px;}
.hdr-btns{display:flex;gap:8px;}
/* 2026-08-06 (backlog item 13 — "Mobile Optimisation"): icon-only buttons
   were 34x34px — under the ~40-44px touch-target guideline for reliable
   tapping on a phone. Bumped to 40x40, still compact enough for the
   header bar. */
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.icon-btn:hover{background:rgba(255,255,255,.25);}
/* Status bar */
.sb{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--bd);font-size:12px;}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* Tab bar */
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid var(--bd);gap:0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tb{flex-shrink:0;padding:10px 14px;font-size:12px;font-weight:500;color:var(--tm);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tb.on{color:var(--hdr);border-bottom-color:var(--hdr);font-weight:700;}
/* Cards */
.card{background:#fff;border-radius:var(--r2);margin:12px 12px 0;padding:14px;border:.5px solid var(--bd);}
.card-title{font-size:13px;font-weight:600;color:var(--tp);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
/* Form elements */
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:13px;color:var(--tp);background:#fff;font-family:Arial,sans-serif;transition:border .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;}
input.err,select.err,textarea.err{border-color:var(--redt);background:#FFF5F5;}
textarea{resize:vertical;min-height:72px;}
label{font-size:12px;font-weight:500;color:var(--ts);display:block;margin-bottom:4px;}
label .req{color:var(--redt);margin-left:2px;}
.field{margin-bottom:12px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.hint{font-size:11px;color:var(--tm);margin-top:3px;}
.err-msg{font-size:11px;color:var(--redt);margin-top:3px;display:flex;align-items:center;gap:3px;}
/* Buttons */
/* 2026-08-06 (backlog item 13 — "Mobile Optimisation"): min-height:38px
   added so every plain <button> (Done/Snooze/Edit/Delete inline actions
   included) has a reliably tappable target on a phone, even where the
   label text is short and padding alone wouldn't reach it. */
button{padding:8px 16px;min-height:38px;border-radius:var(--r);border:1.5px solid var(--bds);cursor:pointer;font-size:13px;font-weight:500;font-family:Arial,sans-serif;transition:.15s;}
.btn-primary{background:var(--accent);color:#fff;border-color:#1558b0;}
.btn-primary:hover{background:#1558b0;}
.btn-success{background:#085041;color:#fff;border-color:#085041;}
.btn-danger{background:var(--redt);color:#fff;border-color:#800000;}
.btn-ghost{background:none;color:var(--ts);border-color:var(--bd);}
.btn-sm{padding:5px 11px;font-size:12px;min-height:32px;}
/* Activity pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
/* Activity type tags */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
/* KR summary rows */
.kr-row{display:flex;align-items:center;padding:8px 0;border-bottom:.5px solid var(--bd);gap:8px;}
.kr-row:last-child{border-bottom:none;}
.kr-label{flex:1;font-size:12px;color:var(--ts);}
.kr-val{font-size:14px;font-weight:700;color:var(--tp);min-width:28px;text-align:right;}
.kr-tgt{font-size:11px;color:var(--tm);min-width:40px;text-align:right;}
.progress-bar{height:4px;background:var(--bd);border-radius:2px;margin-top:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width .3s;}
/* Activity log items */
.ep-dropdown{position:absolute;top:100%;left:0;right:0;z-index:50;background:#fff;border:1px solid var(--bd);border-radius:var(--r);max-height:220px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:2px;}
.ep-dropdown.hidden{display:none;}
.ep-dropdown-item{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:.5px solid var(--bd);}
.ep-dropdown-item:last-child{border-bottom:none;}
.ep-dropdown-item:hover, .ep-dropdown-item:active{background:var(--s2);}
.ep-dropdown-item .muted{color:var(--tm);font-size:11px;}
.ep-dropdown-empty{padding:10px 12px;font-size:12px;color:var(--tm);font-style:italic;}
.act-item{background:var(--s1);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;border:.5px solid var(--bd);position:relative;}
.act-item-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.act-btns{position:absolute;top:8px;right:8px;display:flex;gap:2px;}
.act-del{background:none;border:none;color:var(--tm);cursor:pointer;font-size:14px;padding:2px 4px;}
.act-del:hover{color:var(--redt);}
.act-edit{background:none;border:none;color:var(--tm);cursor:pointer;font-size:14px;padding:2px 4px;}
.act-edit:hover{color:var(--hdr);}
/* Day status badges */
.day-status{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.ds-productive{background:var(--green);color:var(--greent);}
.ds-partial{background:var(--amber);color:var(--ambert);}
.ds-none{background:var(--red);color:var(--redt);}
/* Overdue indicator */
.overdue{color:var(--redt);font-weight:600;}
.overdue-badge{background:var(--red);color:var(--redt);padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;}
/* Weekly day grid */
.wk-day{background:#fff;border-radius:var(--r);border:.5px solid var(--bd);margin-bottom:8px;overflow:hidden;}
.wk-day-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--s2);cursor:pointer;}
.wk-day-body{padding:10px 12px;border-top:.5px solid var(--bd);}
/* Manager dashboard */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dash-card{background:#fff;border-radius:var(--r2);padding:14px;border:.5px solid var(--bd);}
.dash-num{font-size:28px;font-weight:700;color:var(--hdr);}
.dash-lbl{font-size:12px;color:var(--tm);}
/* Conversion funnel */
.funnel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;}
.funnel-step{background:var(--s1);border:.5px solid var(--bd);border-radius:var(--r);padding:6px 10px;text-align:center;}
.funnel-step .num{font-size:18px;font-weight:700;color:var(--hdr);}
.funnel-arrow{color:var(--tm);}
/* Section headers */
.sect-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tm);padding:10px 12px 4px;margin-top:4px;}
/* Focus badge */
.focus-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--o2);color:var(--o2t);}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;overscroll-behavior:contain;}
.modal{background:#fff;border-radius:var(--r2) var(--r2) 0 0;width:100%;max-width:520px;margin:0 auto;padding:20px 16px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
/* User setup */
.user-setup{background:#fff;border-radius:var(--r2);margin:20px 12px;padding:24px;}
/* Floating push btn */
.push-fab{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;z-index:50;}
.push-fab:disabled{opacity:.6;}
/* Utility */
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;}
.flex{display:flex;} .flex-center{display:flex;align-items:center;} .gap8{gap:8px;} .gap12{gap:12px;}
.bold{font-weight:600;} .small{font-size:12px;} .muted{color:var(--tm);}
.hidden{display:none;}
.divider{border:none;border-top:.5px solid var(--bd);margin:12px 0;}
.w100{width:100%;}
.text-red{color:var(--redt);} .text-green{color:var(--greent);} .text-amber{color:var(--ambert);}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwhsxmi0drQCntbqjjveKG4RwK9UrVveSRAH6iZQ0J4RFFE5y1QW2aUlyI1AIbpNty-5w/exec";
const SRC_ID = "13D91QS2g-DZCbNxqlXcQhAZHTamALw3eAOfEj1LdL0k";
const WIP_ID = "1tFinzQotgIErtpCq2LKNybvInw5b3LtTQ2hkC0QKHxY";
const PFX = "baa2_";

const COORDS = ["Wayne Mallia","James Fox","Johnson Morgan"];
const STATES = {"Wayne Mallia":"VIC","James Fox":"NSW","Johnson Morgan":"QLD"};
const MANAGER_CODE = "manager2026";

const PRIMARY_FOCUS = [
  "Employer call campaign","Employer site visits","Pipeline conversion",
  "New employer acquisition","Existing employer engagement","ACAP engagement",
  "Employer meetings","Events","Sign-ups and registrations",
  "Administration and follow-up","Other"
];

const TRADE_OPTIONS = ["Carpentry","Concreting","Civil","Other"];

const CALL_OUTCOMES = [
  "Connected – meaningful conversation","Connected – no current opportunity",
  "No answer","Voicemail left","Follow-up message sent",
  "Callback requested","Incorrect details","Not interested",
  "Do not contact — removed from list","New Contact Added","Other"
];

// 2026-08-05 per Bec: "Add 'future opportunity' to the outcome selection
// within the 'log Employer call' activity" — scoped to the Employer Call
// form's primary "Outcome" dropdown (ec_outcome/callOutcome) specifically,
// NOT the shared CALL_OUTCOMES list above (which is also used by Student
// Lead and Pipeline's own Outcome dropdowns — widening CALL_OUTCOMES
// itself would have silently added this option to those two unrelated
// forms as well).
const EMPLOYER_CALL_OUTCOMES = CALL_OUTCOMES.concat(["Future opportunity"]);

const ENROLMENT_CONTACT_OUTCOMES = [
  "Enrolled","Connected – meaningful conversation","Connected – no current opportunity",
  "No answer","Voicemail left","Follow-up message sent",
  "Callback requested","Incorrect details","Not interested",
  "Do not contact — removed from list","New Contact Added","Other"
];

const REGISTRATION_CONTACT_OUTCOMES = [
  "Registered","Connected – meaningful conversation","Connected – no current opportunity",
  "No answer","Voicemail left","Follow-up message sent",
  "Callback requested","Incorrect details","Not interested",
  "Do not contact — removed from list","New Contact Added","Other"
];

const ACTIVITY_OUTCOMES = [
  "No opportunity identified","Follow-up required","Apprentice vacancy identified",
  "Student lead identified","Employer meeting booked","Candidate referred to employer",
  "Sign-up booked","Sign-up completed","Registration submitted",
  "Registration completed","Future opportunity","Not suitable/closed","Other"
];

// Site Visit tiles (Existing + New Employer) use a pruned outcome list —
// pipeline-stage-style outcomes (Sign-up/Registration) are tracked via the
// Registration/Enrolment Pipeline tiles instead, not from a site visit log.
const SITE_VISIT_OUTCOMES = ACTIVITY_OUTCOMES.filter(function(o){
  return !["Sign-up booked","Sign-up completed","Registration submitted","Registration completed"].includes(o);
});

// 2026-08-05 per Bec: powers the new "New Opportunity" Manager Dashboard
// tile — "logs any opportunities logged against all contact types -
// including events and site visits". Reuses the SAME outcome values the
// existing "Opportunities generated" badge already checks (Apprentice
// vacancy identified / Student lead identified / Employer meeting booked
// / Sign-up booked), now including "Future opportunity". These are all
// values of the shared `activityOutcome` field, which every relevant
// activity type (Employer Call's Activity Outcome, Site Visit, Event, Add
// Employer/New Employer Met) already reads from the SAME ACTIVITY_OUTCOMES/
// SITE_VISIT_OUTCOMES lists — so no type-gating is needed for this half of
// the match, exactly like the existing badge.
const OPPORTUNITY_OUTCOMES = [
  "Apprentice vacancy identified","Student lead identified",
  "Employer meeting booked","Sign-up booked","Future opportunity",
];

// ACAP contacts use a completely separate outcome vocabulary (see
// ACAP_OUTCOMES inside the activity modal) with no literal overlap with
// ACTIVITY_OUTCOMES — these 4 are the ones that represent a genuine
// opportunity in that context. Confirmed with Bec (2026-08-05) to include
// ACAP in the "all contact types" scope of the new tile. Matched WITH a
// type check (a.type is acap_contact/acap_f2f) in the tile computation
// below, unlike OPPORTUNITY_OUTCOMES above — "Meeting booked" here would
// otherwise collide with the unrelated generic "Meeting booked" outcome
// option on the close-followup modal (MEANINGFUL_OUTCOMES), which has
// nothing to do with an ACAP partnership meeting.
const ACAP_OPPORTUNITY_OUTCOMES = [
  "Connected — discussed partnership opportunity","Connected — new referral pathway agreed",
  "Meeting booked","Event collaboration agreed",
];

// 2026-08-06: Risk section on the Daily Summary (renderDailyNotes) —
// "Responsible Department" options per Bec's spec. "Client Relations"
// covers the coordinator's own actions; "Other" lets them name a
// department not on this list without blocking submission.
const RISK_DEPARTMENTS = [
  "Training","Student Engagement","Resources","Client Relations","Other",
];

const REL_TYPES = [
  "Existing active employer","Existing inactive employer","Previous employer",
  "New prospect","New employer acquired"
];

// New-list item 5 follow-up: "Site Visit - New Employer"'s Business Name
// auto-detect dropdown is scoped to exactly these two relationship stages —
// employers who are still a prospect or were only just acquired, i.e. the
// ones this tile is actually for re-visiting.
const NEW_EMPLOYER_STAGE_RELS = ["New prospect","New employer acquired"];

const PIPELINE_STAGES = [
  "New lead","Initial contact attempted","Contact established",
  "Eligibility being confirmed","Employer required","Employer identified",
  "Awaiting documents","Sign-up booked","Sign-up completed",
  "Enrolment processing","Registration submitted","Registered","Enrolled","On hold","Closed/lost"
];

// Used by Registration Pipeline and Student Lead — these represent an
// earlier stage of the funnel than Enrolment Pipeline, so later-funnel
// stages (Sign-up completed, Enrolment processing, Registration submitted,
// Enrolled) are excluded as not relevant at this point.
const EARLY_PIPELINE_STAGES = PIPELINE_STAGES.filter(s =>
  !["Sign-up completed","Enrolment processing","Registration submitted","Enrolled"].includes(s)
);

const ACT_OUTCOME_NEEDS_FOLLOWUP = [
  "Follow-up required","Apprentice vacancy identified","Student lead identified",
  "Employer meeting booked","Candidate referred to employer","Sign-up booked","Future opportunity"
];

// Productive day thresholds per primary focus.
// OVERHAULED per Bec, 2026-08: the original model (a flat "log at least N
// of these activity types TODAY") was scrapped for the focuses below in
// favour of a pace-based model — see FOCUS_PACE_METRICS and
// computeFocusThresholdMet(). Bec's own words, in order: first asked for
// flat-but-bigger numbers (30 employer calls, 4 site visits, 50% of open
// pipeline progressed, 30 ACAP contacts/F2F, 6 sign-up/enrolment/
// registration records, 1 event) — then, when told a single day could
// never realistically reach 30 employer calls (2× the WEEKLY target),
// said: "lets forget the current logic and make it adaptable to the
// combined total of daily targets not achieved, if the primary focus
// equals the minimum for all, or above, it will be accepted, if not an
// explanation is required as to why" — then, asked to confirm a design
// built around her flat numbers as the target, said: "scrap my new flat
// numbers/metrics entirely." Net result: for the focuses with a matching
// WEEKLY_TARGETS metric, "met" now means the coordinator's WEEK-TO-DATE
// total for that metric is at/above the week-to-date pace target (weekly
// target × elapsed working days ÷ 5 — the exact math computeDailyPaceDetails
// already uses for the Daily Pace card/EOD off-pace gate), not a fixed
// per-day count. Pipeline conversion became its own %-based check (see
// computePipelineConversionMet). This const now only holds the 3 focuses
// Bec's threshold overhaul didn't mention (New employer acquisition/
// Existing employer engagement/Employer meetings) — left exactly as they
// were on the old flat "N of these types, today" model — plus
// Administration/Other, which Bec explicitly kept at "1 activity of any
// type" (day-only, handled as a special case directly in
// computeFocusThresholdMet rather than needing a types:[] entry here).
const PRODUCTIVITY_THRESHOLDS = {
  "New employer acquisition":       {minActivities:3, types:["employer_call","site_visit","new_employer"]},
  "Existing employer engagement":   {minActivities:3, types:["employer_call","site_visit"]},
  "Employer meetings":              {minActivities:2, types:["site_visit","new_employer"]},
};

// The 7 metrics the Daily Pace card itself tracks (see
// computeDailyPaceDetails' paceMetrics array) — field-name-driven off
// weeklyPaceActuals() instead of weeklyTotals() so this can be reused
// inside computeFocusThresholdMet without the weeklyTotals→dayStatus→
// computeFocusThresholdMet recursion (see weeklyPaceActuals' own note).
const STANDARD_PACE_METRICS = [
  {label:"Commencements",     actualField:"commencement",           targetKey:"commencement"},
  {label:"Registrations",     actualField:"registration",           targetKey:"registration"},
  {label:"ACAP contacts",     actualField:"acap_contact_attempted", targetKey:"acap_contact"},
  {label:"Employer calls",    actualField:"call_attempted",         targetKey:"employer_call"},
  {label:"Site visits",       actualField:"site_employers",         targetKey:"site_visit"},
  {label:"New employers met", actualField:"new_employer_met",       targetKey:"new_employer_met"},
  {label:"Student leads",     actualField:"lead",                   targetKey:"lead_generated"},
];

// Pace-based focuses. UPDATED again per Bec, 2026-08 (after seeing this
// only asked for the single-metric pace figure — e.g. Employer calls
// showing "0/3" on a Monday when the Daily Pace card right below it showed
// 7 metrics needing 15 combined): "yes one combined number (plus the
// minimum for that specific focus) ei, 15+3 = he should have 18 entries
// against that specific focus." So the minimum a pace-based focus now
// needs is: the SAME combined "needed" total shown at the top of the Daily
// Pace card (sum of every one of the 7 STANDARD_PACE_METRICS' currently-
// needed amount — see computeCombinedPaceNeeded) PLUS the selected focus's
// own needed amount again on top (its contribution to that combined total
// counted a second time — confirmed deliberate by Bec's own 15+3=18
// example). What counts toward MEETING that combined number stays
// focus-specific only (her answer: "Only the focus's own type(s)") — a
// coordinator logging Employer calls doesn't get credit from ACAP contacts
// just because ACAP is also behind pace.
//
// standardLabels: which STANDARD_PACE_METRICS label(s) this focus's own
// "+N" add-on comes from (summed if more than one, e.g. Sign-ups). Events
// isn't one of the 7 standard metrics at all, so it's handled as its own
// small pace calc via targetKeys/actualFields instead (see
// computeFocusThresholdMet) — nothing to double-count there.
const FOCUS_PACE_METRICS = {
  "Employer call campaign":       {actualFields:["call_attempted"],                          standardLabels:["Employer calls"]},
  "Employer site visits":         {actualFields:["site_employers"],                          standardLabels:["Site visits"]},
  "ACAP engagement":              {actualFields:["acap_contact_attempted"],                  standardLabels:["ACAP contacts"]},
  "Sign-ups and registrations":   {actualFields:["commencement","registration","enrolment"], standardLabels:["Commencements","Registrations"]},
  "Events":                       {actualFields:["event"], targetKeys:["event"]},
};

// Terminal pipeline stages — a lead in one of these is no longer "open"
// for the purposes of Pipeline conversion's % calculation below.
const TERMINAL_PIPELINE_STAGES = ["Registered","Enrolled","Closed/lost"];

// Same day-of-week → 1..5 pace-day clamp used by computeDailyPaceDetails,
// duplicated deliberately (matches this file's established pattern of
// small local re-derivations over threading extra params through shared
// functions — see effContactType's 4 call sites).
function weekPaceDayNum(dateStr){
  const d = new Date(dateStr+"T12:00:00");
  const dow = d.getDay();
  return dow===0 ? 5 : dow===6 ? 5 : dow;
}

// Same "needed" math as renderDailyPaceCard's "Needs attention" rows
// (paceRound = Math.ceil(pace); needed = Math.max(0, paceRound-actual)) —
// duplicated here (not called from computeDailyPaceDetails/
// renderDailyPaceCard directly) so computeFocusThresholdMet never has to
// call weeklyTotals()/computeDailyPaceDetails() and reintroduce the
// dayStatus() recursion those fixed (see weeklyPaceActuals' note).
function paceNeeded(actual, weeklyTarget, dayNum){
  const pace = Math.round((weeklyTarget*dayNum/5)*10)/10;
  const paceRound = Math.ceil(pace);
  return Math.max(0, paceRound-actual);
}

// The day's own prorated pace target, WITHOUT subtracting actual — used
// only for a focus's own "add-on" in computeFocusThresholdMet (see
// focusNeeded there). FIXED 2026-08 per Bec: Wayne logged 4 ACAP contacts
// on a Monday, which already exceeded that day's ACAP-specific pace of 3
// — so paceNeeded(4,15,1) correctly returns 0 (nothing further "needed"
// for ACAP specifically), but that silently zeroed out the focus's own
// "+3" add-on too, when Bec's intent (confirmed: "it's also not add[ing]
// on the 3 ACAP as the minimum extra for that field") was for the
// selected focus's own contribution to the combined minimum to always be
// its full day's pace amount, regardless of how much of it is already
// done — only the OTHER 6 (non-focus) metrics in the combined total use
// the clipped/already-caught-up paceNeeded.
function paceTargetFlat(weeklyTarget, dayNum){
  const pace = Math.round((weeklyTarget*dayNum/5)*10)/10;
  return Math.ceil(pace);
}

const WEEKLY_TARGETS = {
  commencement:{VIC:6,NSW:6,QLD:2},
  registration:{VIC:6,NSW:6,QLD:6},
  enrolment:{VIC:0,NSW:0,QLD:0},

// TODAY must be the LOCAL calendar date, not UTC. new Date().toISOString()
// always returns UTC — for Australian timezones (UTC+10/+11), that means
// roughly midnight to 10-11am local time, it silently returns YESTERDAY's
// date instead of today's. This caused early-morning sessions to compute
// the wrong "today", which cascades into S.date's default and any
// follow-up/due-date filtering that falls back to it.
function toLocalYMD(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}

// ── Pending deletions tracker ──────────────────────────────────────────────
// Deletions must be sent to the server explicitly (as an id list), rather
// than relying on the deleted item's absence from the push payload — the
// server no longer treats "not in payload" as "delete it" (see multi-device
// sync fix), since that would let one device's stale local cache silently
// wipe out another device's entries that it simply hadn't pulled yet.
function pendingDeletesKey(coord){ return "pendingDeletes:"+coord; }
function getPendingDeletes(coord){ return lsGet(pendingDeletesKey(coord)) || []; }
function addPendingDelete(coord, id){
  const list = getPendingDeletes(coord);
  if(!list.includes(id)) list.push(id);
  lsSet(pendingDeletesKey(coord), list);
}
function clearPendingDeletes(coord, ids){
  const remaining = getPendingDeletes(coord).filter(id=>!ids.includes(id));
  lsSet(pendingDeletesKey(coord), remaining);
}

// Find employer in cache by business name (partial match)
function findEmployer(coord, bizName) {
  if (!bizName) return null;
  const biz = bizName.trim().toLowerCase();
  return getEmployerCache(coord).find(function(e) {
    const n = (e.bizName||"").trim().toLowerCase();
    return n===biz || n.indexOf(biz)!==-1 || biz.indexOf(n)!==-1;
  })||null;
}

// ── Batch 8 item 1: two-step Organisation → Contact selection ──────────────
// The Employer/ACAP Database is now one row per CONTACT, with rows sharing
// the same orgId grouped under one organisation. groupByOrg turns the flat
// cache into { key -> {orgId, name, contacts:[...]} } so the UI can offer
// "pick the org, then pick/add the contact" instead of one flat business
// list where every contact at the same employer looked like a duplicate.
// Rows from before the org/contact ID migration (orgId blank) fall back to
// being grouped by name alone, so nothing breaks for not-yet-migrated data.
function groupByOrg(list, nameField) {
  const groups = {};
  const order = [];
  (list||[]).forEach(function(e) {
    const key = e.orgId || ("name:"+(e[nameField]||"").trim().toLowerCase());
    if (!groups[key]) { groups[key] = {orgId:e.orgId||"", name:e[nameField]||"", contacts:[]}; order.push(key); }
    groups[key].contacts.push(e);
  });
  // Primary contact first within each group, so it's the sensible default.
  order.forEach(function(key){
    groups[key].contacts.sort(function(a,b){ return (b.isPrimary==="Y")-(a.isPrimary==="Y"); });
  });
  // 2026-08-06 (backlog item 10 — "Employer Search"): groups used to come
  // back in raw sheet/cache insertion order, which has no relationship to
  // how a coordinator scans a datalist while typing — "struggles with
  // previous employers, businesses with many contacts... alphabetical
  // ordering" was called out explicitly. Every datalist/dropdown built
  // from groupByOrg's output (Employer Call, Site Visit, Intro Call, New
  // Employer, Registration/Student Lead's linked-employer picker) now gets
  // this ordering for free.
  return order.map(function(key){ return groups[key]; })
    .sort(function(a,b){ return a.name.trim().toLowerCase().localeCompare(b.name.trim().toLowerCase()); });
}

// Renders the "Step 2" contact picker HTML for a given org group (or an
// empty state if orgName doesn't match a known org yet — i.e. this looks
// like a brand new organisation, in which case the caller falls back to a
// plain text contact-name field instead of showing this picker at all).
function contactPickerHtml(pickerId, newFieldId, group, contactField, currentContactName, syncFnName, newFieldsKind, newFieldsData, relFieldId) {
  if (!group || !group.contacts.length) return "";
  const sync = syncFnName ? `${syncFnName}();` : "";
  // 2026-07-30: relationship shown next to the name in every autodetect
  // dropdown (same style requested for Business Name — see the org-level
  // datalists below), position kept in its own parenthetical.
  const opts = group.contacts.map(function(c){
    const relLabel = (c.empRelationship||c.relType||"");
    const label = (c[contactField]||"(no name on file)") + (c.position ? " ("+c.position+")" : "") + (relLabel?" — "+relLabel:"") + (c.isPrimary==="Y" ? " ⭐ Primary" : "");
    const selected = currentContactName && c[contactField]===currentContactName ? " selected" : "";
    const rel = relLabel.replace(/"/g,"&quot;");
    const optEmail = (c.email||"").replace(/"/g,"&quot;");
    const optPhone = (c.phone||c.mobile||"").replace(/"/g,"&quot;");
    const optPosition = (c.position||"").replace(/"/g,"&quot;");
    return `<option value="${(c[contactField]||"").replace(/"/g,"&quot;")}"${selected} data-rel="${rel}" data-email="${optEmail}" data-phone="${optPhone}" data-position="${optPosition}">${label}</option>`;
  }).join("");
  const isNew = currentContactName && !group.contacts.some(function(c){return c[contactField]===currentContactName;});
  const initialMatch = currentContactName ? group.contacts.find(function(c){return c[contactField]===currentContactName;}) : null;
  const initialRel = initialMatch ? (initialMatch.empRelationship||initialMatch.relType||"") : "";
  const initialPosition = initialMatch ? (initialMatch.position||"") : "";
  // Batch 8 tweak-list item 4: when a brand new contact is being added, show
  // the extra fields needed to complete the WIP record (per the 🟡-required
  // columns in updateEmployerHeaders()/updateAcapHeaders()). newFieldsKind is
  // "employer" or "acap" — pass falsy to skip this (e.g. forms not yet wired).
  const newFieldsId = newFieldsKind ? pickerId+"_newfields" : "";
  // new-list item 2: relFieldId (e.g. "ec_rel"/"sv_rel") is the id of the
  // Employer Relationship <select> living elsewhere on this form — passed
  // through to onContactPickerChange so it can auto-pull the SELECTED
  // CONTACT's specific relationship (not just the org-level one) and
  // re-baseline it for the changed-value-only write (see readContactEdit).
  const onchangeExtra = `,'${newFieldsId}','${relFieldId||""}'`;
  const newFieldsBlock = newFieldsKind
    ? `<div id="${newFieldsId}" style="display:${isNew?"block":"none"};border:1px dashed var(--bd, #ccc);border-radius:var(--r);padding:8px;margin-top:6px;background:var(--bg2, #f7f7f7)">`+
      `<div class="small muted" style="margin-bottom:4px">New contact details — complete for a full WIP record:</div>`+
      newContactFieldsHtml(pickerId, newFieldsKind, newFieldsData)+
      `</div>`
    : "";
  // Batch 8 tweak-list item 11 / new-list item 1: editable Email/Phone for
  // whichever EXISTING contact is currently selected. These fields start
  // BLANK — they are not auto-pulled from the WIP record — and only exist
  // to capture a deliberate update; the placeholder shows what's currently
  // on file for context only, never as a submitted value. Only shown for
  // "employer"/"acap" kinds (Site Visit already has its own always-visible
  // Email/Mobile fields, handled separately in syncSvContact). Left
  // untouched (nothing sent) unless the coordinator actually types a value
  // that differs from what's on file (see onContactPickerChange/readContactEdit).
  const showEditFields = (newFieldsKind==="employer" || newFieldsKind==="acap") && !isNew;
  const editPhoneLabel = newFieldsKind==="acap" ? "Mobile" : "Phone";
  const origEmail = initialMatch ? (initialMatch.email||"").replace(/"/g,"&quot;") : "";
  const origPhone = initialMatch ? (initialMatch.phone||initialMatch.mobile||"").replace(/"/g,"&quot;") : "";
  const editFieldsBlock = (newFieldsKind==="employer" || newFieldsKind==="acap")
    ? `<div id="${pickerId}_editfields" style="display:${showEditFields?"block":"none"};margin-top:6px">`+
      `<div class="small muted" style="margin-bottom:4px">Only fill these in if this contact's details need updating:</div>`+
      fldRow([
        `<div class="field"><label>Email</label><input id="${pickerId}_edit_email" type="email" value="" placeholder="${origEmail||"(Click to Edit)"}" data-orig="${origEmail}"></div>`,
        `<div class="field"><label>${editPhoneLabel}</label><input id="${pickerId}_edit_phone" type="tel" value="" placeholder="${origPhone||"(Click to Edit)"}" data-orig="${origPhone}"></div>`,
      ])+
      `</div>`
    : "";
  return `<div class="field"><label>Contact<span class="req">*</span></label>`+
    `<select id="${pickerId}" onchange="onContactPickerChange('${pickerId}','${newFieldId}'${onchangeExtra});${sync}">`+
    opts+
    `<option value="__new__"${isNew?" selected":""}>+ Add new contact at this organisation</option>`+
    `</select>`+
    `<div id="${pickerId}_rel" style="font-size:11px;color:var(--ts);margin-top:3px">${[initialPosition?"Position: "+initialPosition:"",initialRel?"Employer relationship: "+initialRel:""].filter(Boolean).map(l=>`<div>${l}</div>`).join("")}</div>`+
    `<input id="${newFieldId}" oninput="${sync}" style="margin-top:6px;${isNew?"":"display:none"}" placeholder="New contact's name..." value="${isNew?currentContactName.replace(/"/g,"&quot;"):""}">`+
    newFieldsBlock+
    editFieldsBlock+
    `</div>`;
}

// Batch 8 item 11 / new-list item 1: reads back whichever email/phone edit
// fields exist for a picker, but ONLY returns a value when the coordinator
// actually TYPED SOMETHING that differs from what's on file (data-orig) —
// these fields start blank (see contactPickerHtml), so a blank field must
// never be read as "clear this contact's email/phone"; it just means no
// update was made.
// relFieldId is optional (new-list item 2) — when given, also reports a
// relType edit if the Employer Relationship select's current value differs
// from what it was auto-pulled to (data-orig, set in onContactPickerChange).
// A blank/unpulled baseline (brand-new contact) means whatever's chosen is
// a deliberate first-time choice, not an "edit" — but since relType is a
// required field either way, callers already send it as act.relType
// regardless; this is specifically what tells the backend an EXISTING
// contact's relationship should overwrite rather than fill-if-blank.
function readContactEdit(pickerId, relFieldId) {
  const out = {};
  const emailEl = document.getElementById(pickerId+"_edit_email");
  const phoneEl = document.getElementById(pickerId+"_edit_phone");
  if (emailEl) { const v=emailEl.value.trim(); if (v && v!==(emailEl.getAttribute("data-orig")||"").trim()) out.email=v; }
  if (phoneEl) { const v=phoneEl.value.trim(); if (v && v!==(phoneEl.getAttribute("data-orig")||"").trim()) out.phone=v; }
  if (relFieldId) {
    const relEl = document.getElementById(relFieldId);
    if (relEl) {
      const v=relEl.value.trim();
      const orig=(relEl.getAttribute("data-orig")||"").trim();
      if (v && orig && v!==orig) out.relType=v;
    }
  }
  return out;
}

// Extra field rows shown for a brand-new contact (Batch 8 tweak-list item 4).
// prefix = the pickerId these inputs are namespaced under, e.g. "ec_contact_picker"
// → produces ids like "ec_contact_picker_position". kind = "employer" | "acap".
// 2026-07-30: shared style for every organisation-level autodetect dropdown
// (Employer Call, Site Visit, Intro Call, Site Visit - New Employer, ACAP,
// and the Registration/Enrolment "linked employer" picker). A native
// <option> can only render one line of plain text, so Employer Relationship
// — the single most decision-relevant fact — goes right next to the
// Business Name there; everything else (primary contact, position, contact
// count) moves into the hint area shown once a business is matched, with
// each fact on its own line rather than crammed together.
function orgDatalistOptionHtml(g){
  const primary=g.contacts.find(c=>c.isPrimary==="Y")||g.contacts[0];
  const rel=primary?(primary.empRelationship||primary.relType||""):"";
  return '<option value="'+g.name.replace(/"/g,"&quot;")+'">'+g.name+(rel?" — "+rel:"")+'</option>';
}
function orgHintLinesHtml(g){
  if(!g||!g.contacts||!g.contacts.length) return "";
  const primary=g.contacts.find(c=>c.isPrimary==="Y")||g.contacts[0];
  const lines=[];
  const rel=primary?(primary.empRelationship||primary.relType||""):"";
  if(rel) lines.push("Employer relationship: "+rel);
  if(primary&&primary.contactName) lines.push("Primary contact: "+primary.contactName+(primary.position?" ("+primary.position+")":""));
  if(g.contacts.length>1) lines.push(g.contacts.length+" contacts on file");
  // 2026-08-06 (backlog item 15 — "Better Contact Timeline"): Last Contact
  // Date, Next Follow-up Date and contact count directly on the org hint,
  // so a coordinator can see the timeline right where they're already
  // looking (filling in the employer field) instead of switching to WIP.
  if(primary&&primary.lastContact) lines.push("Last contact: "+fmtDateShort(primary.lastContact));
  if(primary&&primary.nextContact) lines.push("Next follow-up: "+fmtDateShort(primary.nextContact));
  // 2026-08-06 (backlog item 12 — "Contact Notes Visibility"): surfaces the
  // most recent interaction note inline, so CRs can review history before
  // calling without leaving the tracker.
  if(primary&&primary.notes){
    const firstLine=String(primary.notes).split("\n")[0];
    lines.push("Latest note: "+(firstLine.length>140?firstLine.slice(0,140)+"…":firstLine));
  }
  // 2026-08-06 (backlog item 11 — "Profile Builder Visibility"): read-only
  // preview of whatever Profile Builder notes are already on file for this
  // employer. "Edit" is the existing Profile Builder field already present
  // on every call-logging form for this employer — typing there appends a
  // new dated entry (see isSameAsTopEntry_), so no separate edit UI is
  // needed here.
  if(primary&&primary.profileNotes){
    const pbFirstLine=String(primary.profileNotes).split("\n")[0];
    lines.push("Profile Builder: "+(pbFirstLine.length>140?pbFirstLine.slice(0,140)+"…":pbFirstLine));
  }
  // 2026-08-06 (backlog items 9/19 — "Employer Active Status"): shows the
  // current Active/Inactive status with an inline toggle, so a coordinator
  // can flip it right from the tracker instead of opening WIP directly.
  if(primary){
    const isActive=String(primary.active||"Y").trim().toUpperCase()!=="N";
    const orgIdSafe=(g.orgId||"").replace(/'/g,"\\'");
    const bizSafe=(g.name||"").replace(/'/g,"\\'");
    lines.push(`<span>Status: <b style="color:${isActive?"var(--gt,#1baf7a)":"var(--redt)"}">${isActive?"Active":"Inactive"}</b> `+
      `<a href="javascript:void(0)" onclick="toggleEmployerActive('${orgIdSafe}','${bizSafe}',${isActive})" style="margin-left:6px;color:var(--acc,#1a73e8);text-decoration:underline">`+
      `Mark ${isActive?"inactive":"active"}</a></span>`);
  }
  return lines.map(l=>`<div>${l}</div>`).join("");
}

// 2026-08-06 (backlog items 9/19): flips an employer's Active status
// directly from the tracker via set_employer_active, then refreshes the
// local employer cache so the hint reflects the change immediately.
async function toggleEmployerActive(orgId, bizName, currentlyActive){
  const newActive = currentlyActive ? "N" : "Y";
  if(!confirm(`Mark "${bizName}" as ${newActive==="Y"?"Active":"Inactive"}?`)) return;
  try{
    const r = await post("set_employer_active", {coord:S.user.coord, orgId, bizName, active:newActive});
    if(r.ok){
      S.status={ok:true, msg:`${bizName} marked ${newActive==="Y"?"Active":"Inactive"}.`};
      await pullEmployers(S.user.coord);
    } else {
      S.status={ok:false, msg:"Couldn't update status: "+(r.msg||"unknown error")};
    }
  } catch(e){
    S.status={ok:false, msg:"Couldn't update status: "+friendlyError_(e)};
  }
  render();
}

// Shared onchange for any contact picker built by contactPickerHtml — shows
// the "new contact name" field (and, if this picker has one, the new-contact
// details block) only when "+ Add new contact" is chosen, and refreshes the
// "Employer relationship" hint (Batch 8 tweak-list item 3) to match whichever
// contact is now selected.
function onContactPickerChange(pickerId, newFieldId, newFieldsId, relFieldId) {
  const picker=document.getElementById(pickerId), newField=document.getElementById(newFieldId);
  if (!picker||!newField) return;
  const isNew = picker.value==="__new__";
  newField.style.display = isNew ? "block" : "none";
  if (isNew) newField.focus();
  const relDiv=document.getElementById(pickerId+"_rel");
  if (relDiv) {
    const opt=picker.options[picker.selectedIndex];
    const rel=opt?(opt.getAttribute("data-rel")||""):"";
    const position=opt?(opt.getAttribute("data-position")||""):"";
    relDiv.innerHTML = [position?"Position: "+position:"", rel?"Employer relationship: "+rel:""].filter(Boolean).map(l=>`<div>${l}</div>`).join("");
  }
  if (newFieldsId) {
    const nf=document.getElementById(newFieldsId);
    if (nf) nf.style.display = isNew ? "block" : "none";
  }
  // New-list item 2: auto-pull the Employer Relationship select to match
  // whichever EXISTING contact is now selected, and re-baseline data-orig so
  // readContactEdit only sends relType when the coordinator deliberately
  // changes it away from that pulled value. For "+ Add new contact", clear
  // the baseline (any relationship they pick for a brand-new contact is a
  // deliberate choice, not an "edit").
  if (relFieldId) {
    const relSel=document.getElementById(relFieldId);
    if (relSel) {
      if (!isNew) {
        const opt=picker.options[picker.selectedIndex];
        const optRel=opt?(opt.getAttribute("data-rel")||""):"";
        if (optRel) relSel.value=optRel;
        relSel.setAttribute("data-orig", optRel);
      } else {
        relSel.setAttribute("data-orig", "");
      }
    }
  }
  // Batch 8 item 11 / new-list item 1: show/refresh the editable Email/Phone
  // block for whichever existing contact is now selected — re-baselines
  // data-orig to THIS contact's values (for the changed-value diff) and
  // shows them only as placeholder text, so switching contacts never
  // carries over a half-typed edit meant for someone else, never shows a
  // stale contact's details as if they were this one's, and never
  // pre-fills a value that would silently look "unedited" while overwriting.
  const editFields=document.getElementById(pickerId+"_editfields");
  if (editFields) {
    editFields.style.display = isNew ? "none" : "block";
    if (!isNew) {
      const opt=picker.options[picker.selectedIndex];
      const optEmail=opt?(opt.getAttribute("data-email")||""):"";
      const optPhone=opt?(opt.getAttribute("data-phone")||""):"";
      const emailEl=document.getElementById(pickerId+"_edit_email");
      const phoneEl=document.getElementById(pickerId+"_edit_phone");
      if (emailEl) { emailEl.value=""; emailEl.setAttribute("data-orig",optEmail); emailEl.placeholder=optEmail||"(Click to Edit)"; }
      if (phoneEl) { phoneEl.value=""; phoneEl.setAttribute("data-orig",optPhone); phoneEl.placeholder=optPhone||"(Click to Edit)"; }
    }
  }
}

// All days for coord (returns sorted array of dates)
function allDays(coord){
  const keys=[], prefix=PFX+"day:"+coord+":";
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith(prefix)) keys.push(k.replace(prefix,"").replace(PFX,""));
  }
  // The key stored is PFX+dayKey, so parse correctly
  const dates=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith(PFX+"day:"+coord+":")){
      dates.push(k.replace(PFX+"day:"+coord+":",""));
    }
  }
  return dates.sort();
}

// DATE HELPERS
// ═══════════════════════════════════════════════════════════
// 2026-07-31 safety: a coordinator can pick any calendar day in the header
// date picker (and the manager Dashboard's daily-view picker) — nothing
// stopped a Saturday/Sunday being selected, which then became the "day"
// every activity logged in that session got filed under. That's exactly
// what happened when James accidentally logged a full day's real (weekday)
// activity against a Sunday date. isWeekendYMD/snapToWeekday/setLogDate
// below block that: picking a weekend day auto-snaps to the nearest
// working day (Saturday→the Friday before, Sunday→the Monday after) and
// tells the coordinator why, instead of silently accepting it.
function isWeekendYMD(ds){
  if(!ds) return false;
  const dow=new Date(ds+"T12:00:00").getDay();
  return dow===0||dow===6; // 0=Sunday, 6=Saturday
}
function snapToWeekday(ds){
  const d=new Date(ds+"T12:00:00");
  const dow=d.getDay();
  if(dow===6) d.setDate(d.getDate()-1);      // Saturday -> Friday before
  else if(dow===0) d.setDate(d.getDate()+1); // Sunday -> Monday after
  return toLocalYMD(d);
}
// Central setter for every date picker that changes WHICH DAY activities
// are being logged/viewed against (S.date) — use this instead of setting
// S.date directly from an <input type="date">/<select> onchange handler.
function setLogDate(ds, opts){
  opts = opts||{};
  if (isWeekendYMD(ds)) {
    const snapped = snapToWeekday(ds);
    S.date = snapped;
    S.status = {ok:true, msg:"Activities can only be logged Mon–Fri — "+fmtDateShort(ds)+" is a weekend day, moved to "+fmtDateShort(snapped)+"."};
  } else {
    S.date = ds;
  }
  render();
  if (opts.reload) loadFromCloud();
}
function mondayOf(ds){
  const d=new Date(ds+"T12:00:00"), day=d.getDay(), mon=new Date(d);
  mon.setDate(d.getDate()-(day===0?6:day-1));
  return mon.toISOString().substring(0,10);
}
function paceTarget(weeklyTarget, dateInWeek) {
  // How many days into the week are we (including today)?
  const days = weekDaysMF(dateInWeek||S.date);
  const todayStr = S.date||TODAY;
  let daysElapsed = 0;
  for (let i=0; i<days.length; i++) {
    if (days[i] <= todayStr) daysElapsed = i+1;
  }
  return weeklyTarget * daysElapsed / 5;
}

function weekDaysMF(ds){ // Mon-Fri only
  const mon=mondayOf(ds);
  return Array.from({length:5},(_,i)=>{
    const d=new Date(mon+"T12:00:00"); d.setDate(d.getDate()+i);
    return d.toISOString().substring(0,10);
  });
}
// ── Strict lead conversion funnel — 2026-07-28 ──────────────────────────
// Ported back in after the rollback to the pre-sync-fix baseline. This
// widget is pure LOCAL computation (loadDay/allDays read localStorage
// only, getStudentLeadsCache reads the local WIP student-leads cache) —
// no network calls, so it carries none of the risk that caused the
// loading-loop/reappearing-data issue (that was the 30s auto-poll +
// cross-device merge logic, which is intentionally NOT included in this
// rollback). Replaces the old activity-volume-count funnel with a
// strict "same leads narrowing down" funnel: for every lead ever logged,
// what's the furthest stage they reached? Matches by VETtrak UID where
// known (post-registration), name otherwise. Variant B (all open leads,
// not just this week's), per user's 2026-07-28 decision.
const FUNNEL_STAGE_LABELS = ["New lead","Contacted","Sign-up booked","Registered","Enrolled","Commenced"];

function classifyLeadStageIndex_(rec){
  if (rec.type==="commencement") return 5; // ceiling — reaching commencement implies everything before it
  const EXCLUDE_STAGES = ["On hold","Closed/lost"];
  let idx = -1;
  const stage = rec.newStage;
  if (stage && !EXCLUDE_STAGES.includes(stage)) {
    const pIdx = PIPELINE_STAGES.indexOf(stage);
    if (pIdx === 0) idx = 0;                        // New lead
    else if (pIdx >= 1 && pIdx <= 6) idx = 1;        // Initial contact .. Awaiting documents -> Contacted
    else if (pIdx >= 7 && pIdx <= 10) idx = 2;       // Sign-up booked .. Registration submitted -> Sign-up booked
    else if (pIdx === 11) idx = 3;                   // Registered
    else if (pIdx === 12) idx = 4;                   // Enrolled
  }
  // Registration Pipeline / Enrolment Pipeline record completion via
  // contactOutcome rather than newStage — same signal isMeaningfulCall()
  // uses elsewhere in this file.
  if (rec.contactOutcome==="Registered") idx = Math.max(idx, 3);
  if (rec.contactOutcome==="Enrolled") idx = Math.max(idx, 4);
  return idx;
}

function computeStrictLeadFunnel(coord){
  const LEAD_TYPES = ["lead","enrolment_pipeline","registration","pipeline","commencement"];
  // Build name -> UID lookup from the Student Leads WIP cache (uid is
  // blank for anyone not yet registered — falls back to name for those).
  const nameToUid = {};
  (getStudentLeadsCache(coord)||[]).forEach(function(s){
    if (s.name && s.uid) nameToUid[s.name.trim().toLowerCase()] = s.uid;
  });
  const maxIdxByPerson = {}; // identity key -> furthest stage index reached
  allDays(coord).forEach(function(d){
    const day = loadDay(coord, d);
    (day.activities||[]).forEach(function(a){
      if (a.id && (a.id.startsWith("auto_fu_")||a.id.startsWith("auto_acap_")||a.id.startsWith("sl_"))) return;
      if (!LEAD_TYPES.includes(a.type)) return;
      const personName = (a.studentName||a.leadName||"").trim();
      if (!personName) return;
      const key = nameToUid[personName.toLowerCase()] || personName.toLowerCase();
      const idx = classifyLeadStageIndex_(a);
      const effIdx = idx < 0 ? 0 : idx; // any qualifying record at minimum means "New lead" is known
      if (!(key in maxIdxByPerson) || effIdx > maxIdxByPerson[key]) maxIdxByPerson[key] = effIdx;
    });
  });
  const people = Object.values(maxIdxByPerson);
  const counts = FUNNEL_STAGE_LABELS.map(function(_,i){
    return people.filter(function(maxIdx){ return maxIdx >= i; }).length;
  });
  return {labels:FUNNEL_STAGE_LABELS, counts:counts, totalLeads:people.length};
}

// Renders the narrowing-bar funnel (Variant B style from the mockup) —
// bars only, no per-lead drill-down, per user's decision (2026-07-28).
function renderStrictLeadFunnel(coord){
  const f = computeStrictLeadFunnel(coord);
  if (f.totalLeads===0) {

    ${f.labels.map(function(lbl,i){
      const val=f.counts[i];

          <div style="height:100%;width:${pct}%;background:${barColors[i]};display:flex;align-items:center;padding:0 8px;color:#fff;font-weight:700;font-size:12px;border-radius:4px;white-space:nowrap">${val}</div>

  </div>

// ── Weekly (in-week) lead conversion funnel — 2026-08-03 ────────────────
// Bec asked for the funnel shown in weekly-summary views to be scoped to
// "activity against a new lead captured in that week" rather than every
// lead ever logged. Per her explicit choice: (1) a lead only counts here
// if their intake (a type==="lead" record) was logged within the selected
// Mon-Fri week, and (2) their funnel stage is based SOLELY on activity
// also logged within that same week — a lead who progresses further in a
// later week will NOT move this week's bars (that's deliberate: this is a
// snapshot of what happened during the week itself, not a live-updating
// cohort tracker). The all-leads-ever funnel (computeStrictLeadFunnel)
// still exists unchanged and now lives on the History tab.
function computeWeeklyLeadFunnel(coord, ds){
  const LEAD_TYPES = ["lead","enrolment_pipeline","registration","pipeline","commencement"];
  const weekDates = weekDaysMF(ds);
  const nameToUid = {};
  (getStudentLeadsCache(coord)||[]).forEach(function(s){
    if (s.name && s.uid) nameToUid[s.name.trim().toLowerCase()] = s.uid;
  });

  const weekRecordsByPerson = {}; // identity key -> in-week records for that person
  const capturedThisWeek = {};    // identity key -> true if their intake ("lead" record) is in this week

  weekDates.forEach(function(d){
    const day = loadDay(coord, d);
    (day.activities||[]).forEach(function(a){
      if (a.id && (a.id.startsWith("auto_fu_")||a.id.startsWith("auto_acap_")||a.id.startsWith("sl_"))) return;
      if (!LEAD_TYPES.includes(a.type)) return;
      const personName = (a.studentName||a.leadName||"").trim();
      if (!personName) return;
      const key = nameToUid[personName.toLowerCase()] || personName.toLowerCase();
      (weekRecordsByPerson[key] = weekRecordsByPerson[key]||[]).push(a);
      if (a.type==="lead") capturedThisWeek[key] = true;
    });
  });

  const maxIdxByPerson = {};
  Object.keys(weekRecordsByPerson).forEach(function(key){
    if (!capturedThisWeek[key]) return; // only leads actually captured (intake logged) this week
    weekRecordsByPerson[key].forEach(function(a){
      const idx = classifyLeadStageIndex_(a);
      const effIdx = idx < 0 ? 0 : idx;
      if (!(key in maxIdxByPerson) || effIdx > maxIdxByPerson[key]) maxIdxByPerson[key] = effIdx;
    });
  });

  const people = Object.values(maxIdxByPerson);
  const counts = FUNNEL_STAGE_LABELS.map(function(_,i){
    return people.filter(function(maxIdx){ return maxIdx >= i; }).length;
  });
  return {labels:FUNNEL_STAGE_LABELS, counts:counts, totalLeads:people.length};
}

function renderWeeklyLeadFunnel(coord, ds){
  const f = computeWeeklyLeadFunnel(coord, ds);
  if (f.totalLeads===0) {
    return `<div class="small muted" style="padding:8px 0">No new leads captured for ${coord} this week (${fmtWkRange(ds)}) — this fills in as Student Lead activity gets logged for leads captured during the week.</div>`;

    ${f.labels.map(function(lbl,i){
      const val=f.counts[i];
      const pct = f.totalLeads>0 ? Math.max(val/f.totalLeads*100, val>0?4:0) : 0;

      return `<div style="display:flex;align-items:center;gap:8px">

          <div style="height:100%;width:${pct}%;background:${barColors[i]};display:flex;align-items:center;padding:0 8px;color:#fff;font-weight:700;font-size:12px;border-radius:4px;white-space:nowrap">${val}</div>
        </div>

}

function fmtDate(ds){

function fmtDateShort(ds){

function addWeeks(ds, n) {
  const d = new Date((ds||TODAY)+"T12:00:00");
  d.setDate(d.getDate() + n*7);
  return d.toISOString().substring(0,10);
}

function fmtWkRange(ds){

const TRACKER_START = "2026-07-27"; // Team starts using tracker from this date

function isOverdue(dateStr){
  // Not overdue if before tracker start date — clears all pre-existing tasks
  if (!dateStr || dateStr < TRACKER_START) return false;
  return dateStr < TODAY;
}
function isStudentLeadOpen(status){
  // Mirrors the server-side version — any status containing these keywords
  // means the student is closed out (enrolled, registered, cancelled,
  // etc.) and should no longer generate/show follow-ups.
  const s=String(status||"").trim().toLowerCase();
  if(!s) return false;
  if(s==="n/a") return false;
  if(s.indexOf("cancel")!==-1) return false;
  if(s.indexOf("complet")!==-1) return false;
  if(s.indexOf("enrolled")!==-1) return false;
  if(s.indexOf("registered")!==-1) return false;
  if(s.indexOf("closed")!==-1) return false;
  if(s.indexOf("withdrawn")!==-1) return false;
  return true;
}
function dayOfWeek(ds){
  const d=new Date(ds+"T12:00:00");
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
}
