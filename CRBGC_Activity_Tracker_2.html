// ACTIVITY ANALYSIS
// ═══════════════════════════════════════════════════════════
// UPDATED 2026-08-03 — broadened per Bec's redefinition of "Meaningful
// Contacts" on the Manager Dashboard: a Registration/Enrolment Pipeline
// touch now also counts as meaningful when it progressed the record from
// one status to the next, not just when the outcome was literally
// Registered/Enrolled. This is the single shared definition used
// everywhere "meaningful conv(s)"/"Meaningful Contacts" appears — This
// Week tab, Weekly Excel/PDF, the dashboard's weekly card, Trend charts —
// so all of those stay consistent with the Daily Dashboard tile rather
// than silently drifting apart the way the follow-up open/overdue counts
// did earlier.
function isMeaningfulCall(act){
  // UPDATED 2026-08-03: a follow_up_closed record only counts as a
  // meaningful contact when the CR member actually selected a meaningful
  // outcome on the close-followup form (activityOutcome, one of the 5
  // MEANINGFUL_OUTCOMES) — NOT just because the record exists. Per Bec's
  // explicit correction: "i don't want them to auto count towards
  // meaningful contacts as the CR member could simply close off. add an
  // outcome field rather than status." Closing a follow-up off (e.g. a
  // snooze-to-close, "no longer relevant", etc.) must NOT silently credit
  // a meaningful contact just because a closure record was created.
  if(act.type==="follow_up_closed" && MEANINGFUL_OUTCOMES.includes(act.activityOutcome)) return true;
  if(act.type==="employer_call" && act.callOutcome && act.callOutcome.startsWith("Connected – meaningful")) return true;
  if(act.type==="enrolment_pipeline" && act.contactOutcome==="Enrolled") return true;
  if(act.type==="registration" && act.contactOutcome==="Registered") return true;
  if((act.type==="registration"||act.type==="enrolment_pipeline") && act.newStage && act.prevStage && act.newStage!==act.prevStage) return true;
  return false;
}
function activityLabel(type){
  const labels={
    commencement:"Commencement",registration:"Registration Pipeline",enrolment:"Enrolment",
    intro_call:"Employer Introduction Call",acap_contact:"ACAP Call",acap_f2f:"ACAP F2F Visit",
    event:"Event",employer_call:"Employer Call",site_visit:"Site Visit - Existing Employer",
    new_employer_met:"Site Visit - New Employer",new_employer_db:"Add Employer",add_employer:"Add Employer",
    pipeline:"Pipeline",lead:"Student Lead",enrolment_pipeline:"Enrolment Pipeline Follow-up",add_acap:"Add ACAP",follow_up_closed:"Follow-up Closed",
  };
  return labels[type]||type;
}
function activityColor(type){
  if(["commencement","registration","enrolment","intro_call"].includes(type)) return {bg:S1="#E1F5EE",txt:"#085041"};
  if(["acap_contact","acap_f2f","event","add_acap"].includes(type)) return {bg:"#E6F1FB",txt:"#0C447C"};
  return {bg:"#FAEEDA",txt:"#633806"};
}

// FIXED 2026-08-03: found while auditing the live Management Dashboard —
// "Daily Completion" and the "X/5 productive" badge were counting
// system-generated placeholder rows (auto_fu_/auto_acap_/sl_ — the
// auto-scheduled 6-week check-in follow-ups the backend writes itself,
// never something the coordinator actually did that day) as if they were
// real logged activity. weeklyTotals() already excluded these from every
// KPI tile via its own inline filter; this centralises that same filter
// so dayStatus() (used by the productivity badge, This Week, History, and
// the Daily Completion strip) and weeklyTotals() can never drift apart
// again the way they just did — one coordinator's dashboard showed single
// digits on the KPI tiles above a "22 activities" Daily Completion tile
// for the very same day.
function realDayActivities(day){
  return (day.activities||[]).filter(a=>
    !a.id||(!a.id.startsWith("auto_fu_")&&!a.id.startsWith("auto_acap_")&&!a.id.startsWith("sl_"))
  );
}

// Lightweight week-to-date activity totals for the pace-based focuses
// (Employer call campaign/Employer site visits/ACAP engagement/Sign-ups
// and registrations/Events) — deliberately NOT weeklyTotals(), even though
// this duplicates a handful of its per-type counting lines. weeklyTotals()
// calls dayStatus() for every day in the week (to tally days_productive/
// days_partial/days_none), and dayStatus() calls computeFocusThresholdMet()
// — so if computeFocusThresholdMet's pace branch called weeklyTotals(), any
// day with a pace-based focus set would recurse forever (dayStatus →
// computeFocusThresholdMet → weeklyTotals → dayStatus → ...), which is
// exactly the "Maximum call stack size exceeded" crash Bec hit on load.
// This only computes the handful of fields FOCUS_PACE_METRICS actually
// needs, with the same effContactType (closed-follow-up-crediting)
// resolution weeklyTotals uses, but never calls dayStatus.
function weeklyPaceActuals(coord, ds){
  const days = weekDaysMF(ds);
  // 2026-08 — new_employer_met/lead added so computeFocusThresholdMet can
  // compute the FULL combined "needed" total across all 7
  // STANDARD_PACE_METRICS (matching the Daily Pace card) without calling
  // weeklyTotals()/computeDailyPaceDetails() (see the recursion note above
  // this function and on STANDARD_PACE_METRICS/FOCUS_PACE_METRICS).
  const T = {commencement:0, registration:0, enrolment:0, acap_contact_attempted:0, event:0, call_attempted:0, site_employers:0, new_employer_met:0, lead:0};
  const origActLookup = {};
  allDays(coord).forEach(function(d){
    const dd = loadDay(coord, d);
    (dd.activities||[]).forEach(function(a){ if(a.id) origActLookup[a.id]=a; });
  });
  const effContactType = a => {
    if(a.type!=="follow_up_closed") return a.type;
    if(a.origType) return a.origType;
    const orig = a._closedFromId ? origActLookup[a._closedFromId] : null;
    return orig ? orig.type : "";
  };
  days.forEach(d=>{
    const day = loadDay(coord, d);
    const realActs = realDayActivities(day);
    realActs.forEach(a=>{
      const effType = effContactType(a);
      if(a.type==="commencement") T.commencement++;
      if(a.type==="registration" && a.newContactDetails) T.registration++;
      if(a.type==="enrolment") T.enrolment++;
      if(a.type==="enrolment_pipeline" && a.newStage==="Enrolled") T.enrolment++;
      if(effType==="acap_contact"||effType==="acap_f2f") T.acap_contact_attempted++;
      if(effType==="event") T.event++;
      if(effType==="employer_call") T.call_attempted++;
      if(effType==="site_visit") T.site_employers++;
      if(effType==="new_employer_met") T.new_employer_met++;
      if(a.type==="lead") T.lead++;
    });
  });
  return T;
}

// How many of the 7 STANDARD_PACE_METRICS are behind (pct<0.7 of their
// day-prorated pace target) — the exact same "behind" bucket
// computeDailyPaceDetails classifies (pct>=1 "on", pct>=0.7 "amber", else
// "behind"), but computed off weeklyPaceActuals (not weeklyTotals) so it
// can safely be called from dayStatus() without recursing: weeklyTotals()
// calls dayStatus() per day, and computeDailyPaceDetails() calls
// weeklyTotals() — so dayStatus() must never call computeDailyPaceDetails()
// directly (that was exactly the "Maximum call stack size exceeded" crash
// fixed once already — see weeklyPaceActuals' own note). 2026-08 — Bec:
// Primary Focus should now only be asked (and gate "Mark day complete")
// "only to appear when daily pace is not met" — this is that trigger,
// matching the original off-pace-explanation feature's own definition of
// "off pace" (pace.behind>0, not the looser amber/"not fully on track").
function dailyPaceBehindCount(day){
  const state = STATES[day.coord];
  const T = weeklyPaceActuals(day.coord, day.date);
  const dayNum = weekPaceDayNum(day.date);
  let behind=0;
  STANDARD_PACE_METRICS.forEach(m=>{
    const weekly=(WEEKLY_TARGETS[m.targetKey]&&WEEKLY_TARGETS[m.targetKey][state])||0;
    if(weekly<=0) return;
    const pace = Math.round((weekly*dayNum/5)*10)/10;
    const actual = T[m.actualField]||0;
    const pct = pace>0 ? actual/pace : 1;
    if(pct<0.7) behind++;
  });
  return behind;
}

// Pipeline conversion — its own %-based model, per Bec 2026-08:
// "Pipeline conversion needs at least 50% of open all pipeline leads
// (enrolments/registrations) progressed", clarified as: measured against
// EVERY open pipeline/registration/enrolment_pipeline lead the coordinator
// currently has (not just today's), where "open" excludes leads whose
// latest known stage is Registered/Enrolled/Closed-lost, and "progressed"
// means that lead has had at least one recorded stage move (newStage set,
// prevStage set, and they differ) at any point — matching the Pipeline
// tab's own "progressed" definition (renderPipeline). A lead with no open
// leads at all is vacuously "met" (nothing outstanding to explain).
function computePipelineConversionMet(day){
  const leadMap = {};
  allDays(day.coord).forEach(function(d){
    const dd = loadDay(day.coord, d);
    (dd.activities||[]).forEach(function(a){
      if(!["pipeline","registration","enrolment_pipeline"].includes(a.type)) return;
      const key = (a.leadName||a.studentName||"").trim().toLowerCase();
      if(!key) return; // can't identify which lead this is — skip, same as the Pipeline tab showing "—"
      if(!leadMap[key]) leadMap[key] = {stage:"", progressedEver:false};
      const progressedNow = !!(a.newStage && a.prevStage && a.newStage!==a.prevStage);
      leadMap[key].stage = a.newStage || a.prevStage || leadMap[key].stage;
      leadMap[key].progressedEver = leadMap[key].progressedEver || progressedNow;
    });
  });
  const leads = Object.values(leadMap);
  const openLeads = leads.filter(l=>!TERMINAL_PIPELINE_STAGES.includes(l.stage));
  const openCount = openLeads.length;
  const progressedCount = openLeads.filter(l=>l.progressedEver).length;
  const pct = openCount>0 ? Math.round((progressedCount/openCount)*1000)/10 : null;
  const met = openCount===0 ? true : (progressedCount/openCount) >= 0.5;
  return {
    met, count:progressedCount, minActivities:openCount>0?Math.ceil(openCount*0.5):0,
    mode:"percent", pct, openCount, progressedCount, minPercent:50
  };
}

// 2026-08-06: pulled the "did today's logged activity meet this focus's
// minimum" check out of dayStatus() so the same determination can also
// drive the Daily Notes primary-focus gate (see computeFocusThresholdMet/
// saveFocusFollowup) without re-implementing the threshold math a second
// time and risking the two drifting apart.
// OVERHAULED 2026-08 per Bec's threshold redesign (see the long note above
// PRODUCTIVITY_THRESHOLDS) — now branches by focus:
//  - Administration and follow-up / Other: unchanged, day-only, 1 activity
//    of any type.
//  - Pipeline conversion: delegates to computePipelineConversionMet (its
//    own %-of-open-leads model).
//  - Any focus in FOCUS_PACE_METRICS (Employer call campaign, Employer
//    site visits, ACAP engagement, Sign-ups and registrations, Events):
//    week-to-date actual (focus-specific only) vs. a COMBINED minimum —
//    the sum of every STANDARD_PACE_METRICS metric's currently-needed
//    amount (the same total shown at the top of the Daily Pace card) PLUS
//    the focus's own needed amount again on top. See the long note on
//    FOCUS_PACE_METRICS for Bec's worked example (15 combined + 3
//    Employer-calls-specific = 18).
//  - The 3 focuses Bec's redesign didn't touch (New employer acquisition/
//    Existing employer engagement/Employer meetings): unchanged, the
//    original day-only "N of these types, today" model, still crediting
//    closed follow-ups via effContactType (the fix from Bec's earlier
//    ACAP-engagement screenshot report).
function computeFocusThresholdMet(day){
  if(!day.focus) return null; // no focus selected — not applicable

  if(day.focus==="Administration and follow-up" || day.focus==="Other"){
    const acts=realDayActivities(day);
    return {met:acts.length>=1, count:acts.length, minActivities:1, mode:"day"};
  }

  if(day.focus==="Pipeline conversion") return computePipelineConversionMet(day);

  const paceCfg = FOCUS_PACE_METRICS[day.focus];
  if(paceCfg){
    const state = STATES[day.coord];
    const T = weeklyPaceActuals(day.coord, day.date);
    const dayNum = weekPaceDayNum(day.date);

    // Combined total — every one of the 7 standard metrics' currently-
    // needed amount, summed. Identical math/inputs to what
    // renderDailyPaceCard's "Needs attention" rows show, just computed off
    // weeklyPaceActuals (not weeklyTotals) to avoid recursion.
    let combinedNeeded=0;
    STANDARD_PACE_METRICS.forEach(m=>{
      const weekly=(WEEKLY_TARGETS[m.targetKey]&&WEEKLY_TARGETS[m.targetKey][state])||0;
      if(weekly>0) combinedNeeded += paceNeeded(T[m.actualField]||0, weekly, dayNum);
    });

    // The selected focus's own add-on, counted again on top of whatever it
    // already contributed to combinedNeeded above (deliberate — see Bec's
    // 15+3=18 example). UPDATED 2026-08 per Bec: this add-on is always the
    // focus's full day's pace amount (paceTargetFlat), NOT reduced by
    // actual — otherwise a coordinator who already logged enough of their
    // focus's own metric to clear that one sub-target would see the add-on
    // silently drop to 0 (Wayne's case: 4 ACAP contacts on a Monday already
    // exceeded that day's ACAP pace of 3, zeroing the "+3" Bec expected to
    // still be added).
    let focusNeeded=0;
    if(paceCfg.standardLabels){
      paceCfg.standardLabels.forEach(label=>{
        const m = STANDARD_PACE_METRICS.find(sm=>sm.label===label);
        if(!m) return;
        const weekly=(WEEKLY_TARGETS[m.targetKey]&&WEEKLY_TARGETS[m.targetKey][state])||0;
        if(weekly>0) focusNeeded += paceTargetFlat(weekly, dayNum);
      });
    } else if(paceCfg.targetKeys){
      // Events — not one of the 7 standard Daily Pace metrics, so nothing
      // to double-count; computed as its own small pace figure.
      let weeklySum=0;
      paceCfg.targetKeys.forEach(k=>{ weeklySum += (WEEKLY_TARGETS[k]&&WEEKLY_TARGETS[k][state])||0; });
      focusNeeded = paceTargetFlat(weeklySum, dayNum);
    }

    // What counts toward MEETING the combined minimum stays focus-specific
    // only, per Bec: "Only the focus's own type(s)".
    let actual=0;
    paceCfg.actualFields.forEach(f=>{ actual += T[f]||0; });

    const minActivities = combinedNeeded + focusNeeded;
    return {
      met:actual>=minActivities, count:actual, minActivities,
      mode:"pace", combinedNeeded, focusNeeded, dayNum
    };
  }

  // Legacy day-only type-list model — the 3 focuses untouched by Bec's
  // threshold redesign.
  const acts=realDayActivities(day);
  const thresh=PRODUCTIVITY_THRESHOLDS[day.focus]||{minActivities:1, types:[]};
  let relevant;
  if(thresh.types.length===0){
    relevant=acts;
  } else {
    // FIXED 2026-08-06 per Bec (screenshot: ACAP engagement showing 2/3 —
    // "didn't meet minimum" — when the coordinator actually had 4 ACAP
    // touches that day, 2 fresh + 2 via closed follow-ups): this used to
    // filter on the record's raw a.type, so a closed follow-up (whose type
    // is always "follow_up_closed") could never match a focus's type list
    // — even though that exact closure already credits the matching
    // Manager Dashboard tile (e.g. ACAP Contacts) via effContactType. Same
    // resolution used everywhere else in the app: origType first, then
    // the _closedFromId lookup fallback for legacy closures.
    const origActLookup = {};
    allDays(day.coord).forEach(function(d){
      const dd = loadDay(day.coord, d);
      (dd.activities||[]).forEach(function(a){ if(a.id) origActLookup[a.id]=a; });
    });
    const effContactType = a => {
      if(a.type!=="follow_up_closed") return a.type;
      if(a.origType) return a.origType;
      const orig = a._closedFromId ? origActLookup[a._closedFromId] : null;
      return orig ? orig.type : "";
    };
    relevant=acts.filter(a=>thresh.types.includes(effContactType(a)));
  }
  const count=relevant.length;
  return {met:count>=thresh.minActivities, count, minActivities:thresh.minActivities, mode:"day"};
}

// Shared shortfall wording for the Daily Notes Primary Focus card (long
// form, with the running numbers) and the saveEOD gate's error message
// (short form) — mode-aware since "count/minActivities" means something
// different for each of the 3 models computeFocusThresholdMet can return.
function focusThresholdShortfallHeadline(day, ft){
  if(ft.mode==="percent"){
    const pctTxt = ft.pct===null ? "0" : ft.pct;
    return `Only ${ft.progressedCount}/${ft.openCount} open pipeline leads (${pctTxt}%) have progressed — below the ${ft.minPercent}% minimum for "${day.focus}"`;
  }
  if(ft.mode==="pace"){
    return `This week's total for "${day.focus}" hasn't reached this week's pace minimum yet (${ft.count}/${ft.minActivities} so far this week)`;
  }
  return `Today's activity didn't meet the minimum for "${day.focus}" (${ft.count}/${ft.minActivities})`;
}
function focusThresholdShortfallPrompt(day, ft){
  if(ft.mode==="percent") return 'Please explain why "'+day.focus+'" hasn\'t reached the '+ft.minPercent+'% open-pipeline-progression minimum before marking the day complete.';
  if(ft.mode==="pace") return 'Please explain why this week\'s "'+day.focus+'" total hasn\'t reached this week\'s pace minimum before marking the day complete.';
  return 'Please explain why today\'s activity didn\'t meet the minimum for "'+day.focus+'" before marking the day complete.';
}

// 2026-08 — Bec: Primary Focus now "only appear[s] when daily pace is not
// met" (see dailyPaceBehindCount) — on an on-pace day nothing asks for a
// focus at all, so day.focus being empty no longer means "none" the way
// it used to. On-pace days are classified purely on completion/activity;
// only off-pace days (where a focus WAS asked for) still run the focus-
// threshold check.
function dayStatus(day){
  if(dailyPaceBehindCount(day)===0){
    if(day.eodStatus==="complete") return "productive";
    if(realDayActivities(day).length>0) return "partial";
    return "none";
  }
  if(!day.focus) return "none";
  const ft=computeFocusThresholdMet(day);
  if(ft.met && day.eodStatus==="complete") return "productive";
  if(ft.count>0||day.eodStatus==="complete") return "partial";
  return "none";
}

function getDayStatusLabel(status){
  if(status==="productive") return '<span class="day-status ds-productive">✓ Productive day</span>';
  if(status==="partial")    return '<span class="day-status ds-partial">◐ Partial activity</span>';
  return '<span class="day-status ds-none">○ No meaningful activity</span>';
}

// Weekly KR totals for a coord over Mon-Fri
//
// FIXED 2026-08-06 per Bec: "update the KR totals in both the individual
// weekly summaries and the management dashboard trends as per the updates
// we did to count the totals in the management weekly dashboard." Before
// this fix, weeklyTotals() checked a plain a.type for ACAP/Event/Employer
// Call/Site Visit/New Employer Met/Pipeline records, so a closed follow-up
// (type "follow_up_closed") never credited any of those KR rows — even
// though the SAME closure correctly credits its original type's tile on
// both the Daily Dashboard (renderDailyDashboard) and the Weekly Manager
// Dashboard (weeklyTileMetrics, fixed the same way just above). That meant
// the individual coordinator's own "Weekly KR detail" table (This Week
// tab), the Weekly Notes/PDF export, and the Trend dashboard could all
// under-count relative to what the manager's dashboards now show for the
// exact same week — the same class of silent mismatch already fixed once
// for ACAP/Pipeline/Existing Employer Calls on 2026-08-04. Now every
// consumer of weeklyTotals() resolves a closure back to its original
// activity's type (effContactType) — and, where relevant, relType
// (effRelType) — via the same origType-first/_closedFromId-fallback logic
// used everywhere else, so a closed follow-up always credits the same KR
// row it would if it had been logged fresh that day. Metrics that are
// deliberately fresh-only per Bec's separate instruction (commencements,
// registrations, enrolments, and student leads — "student leads should
// only count new leads added to database on that day") are NOT touched by
// this fix, matching the Daily/Weekly Dashboard tiles' own carve-outs.
function weeklyTotals(coord,ds){
  const days=weekDaysMF(ds);
  const T={
    commencement:0,registration:0,enrolment:0,
    intro_call_due:0,intro_call_done:0,intro_call_overdue:0,
    acap_contact_attempted:0,acap_contact_meaningful:0,
    acap_f2f:0,event:0,
    call_attempted:0,call_connected:0,call_meaningful:0,
    followup_booked:0,
    site_locations:new Set(),site_employers:0,site_contacts:0,site_opps:0,
    new_employer_met:0,new_employer_acq:0,new_employer_db:0,
    lead:0,opp_generated:0,
    pipeline_contacted:0,pipeline_progressed:0,pipeline_no_movement:0,pipeline_overdue:0,
    signup_booked:0,signup_done:0,reg_submitted:0,reg_done:0,enrolled_done:0,
    followup_open:0,followup_overdue:0,
    days_complete:0,days_productive:0,days_partial:0,days_none:0,
  };
  // 2026-08-06: same origType-first/_closedFromId-fallback resolution used
  // by renderDailyDashboard()/weeklyTileMetrics() — see the fix note above
  // this function. Built once per call (not per day) since it scans every
  // locally-cached day for this coordinator, exactly like the other two.
  const origActLookup = {};
  allDays(coord).forEach(function(d){
    const dd = loadDay(coord, d);
    (dd.activities||[]).forEach(function(a){ if(a.id) origActLookup[a.id]=a; });
  });
  const resolveOrigAct = a => a._closedFromId ? origActLookup[a._closedFromId] : null;
  const effContactType = a => {
    if(a.type!=="follow_up_closed") return a.type;
    if(a.origType) return a.origType;
    const orig = resolveOrigAct(a);
    return orig ? orig.type : "";
  };
  const effRelType = a => {
    if(a.type!=="follow_up_closed") return a.relType;
    if(a.relType) return a.relType;
    const orig = resolveOrigAct(a);
    return orig ? (orig.relType||"") : "";
  };

  days.forEach(d=>{
    const day=loadDay(coord,d);
    const st=dayStatus(day);
    if(st==="productive") T.days_productive++;
    else if(st==="partial") T.days_partial++;
    else T.days_none++;
    if(day.eodStatus==="complete") T.days_complete++;
    const realActs=realDayActivities(day); // shared with dayStatus() — see note above dayStatus()
    realActs.forEach(a=>{
      const effType = effContactType(a);
      // Deliberately fresh-only (a.type, not effType) — matches the Daily/
      // Weekly Dashboard tiles: a closed follow-up is a RE-contact, not a
      // brand-new commencement/registration/enrolment/lead.
      if(a.type==="commencement") T.commencement++;
      // FIXED 2026-08-06 per Bec: "registrations should only pull new
      // registrations logged for the day, not existing registration
      // activities." Was every Registration Pipeline touch (a.type===
      // "registration", unconditional) — including a coordinator simply
      // progressing a student who was ALREADY in the pipeline from an
      // earlier day. Bec's clarification: "new" specifically means a
      // brand-new person, not an existing lead/contact — i.e. the
      // Registration form's "+ new student" capture block was used
      // (act.newContactDetails is only ever set when the typed name
      // didn't match any existing lead — see onRegNameInput/saveActivity),
      // as opposed to picking an already-known student off the list. A
      // returning/existing student progressing through the pipeline is
      // now correctly excluded — that activity instead counts toward
      // Pipeline Progressed below if it moved a stage.
      if(a.type==="registration" && a.newContactDetails) T.registration++;
      if(a.type==="registration" && a.contactOutcome==="Registered"){ T.reg_submitted++; }
      if(a.type==="registration" && a.newStage==="Sign-up booked") T.signup_booked++;
      if(a.type==="enrolment") T.enrolment++;
      if(a.type==="enrolment_pipeline" && a.newStage==="Enrolled") T.enrolment++;
      if(a.type==="intro_call"){
        T.intro_call_due++;
        if(a.within24h==="Yes") T.intro_call_done++;
        if(a.within24h==="No" && isOverdue(d)) T.intro_call_overdue++;
      }
      // FIXED 2026-08-06: now credits closed follow-ups via effType, same
      // as the Daily/Weekly Dashboard tiles' ACAP Contacts.
      if(effType==="acap_contact"||effType==="acap_f2f"){
        T.acap_contact_attempted++;
        if(a.activityOutcome && !["No opportunity identified"].includes(a.activityOutcome)) T.acap_contact_meaningful++;
      }
      if(effType==="acap_f2f") T.acap_f2f++;
      if(effType==="event") T.event++;
      if(effType==="employer_call"){
        T.call_attempted++;
        if(a.callOutcome&&a.callOutcome.startsWith("Connected")) T.call_connected++;
        if(a.followUpDate) T.followup_booked++;
      }
      if(isMeaningfulCall(a)) T.call_meaningful++;
      // Existing-Employer Site Visits and New-Employer-Met stay two
      // separate KR rows here (unlike the Weekly Manager Dashboard's single
      // combined "Site Visits" tile) — each now correctly credits a closed
      // follow-up back to whichever one its original activity was.
      if(effType==="site_visit"){
        if(a.suburb) T.site_locations.add(a.suburb);
        T.site_employers++;
        if(a.contactName) T.site_contacts++;
        if(a.activityOutcome&&["Apprentice vacancy identified","Student lead identified","Sign-up booked"].includes(a.activityOutcome)) T.site_opps++;
      }
      if(effType==="new_employer_met") T.new_employer_met++;
      if(effType==="new_employer_db"||effType==="add_employer") T.new_employer_db++;
      if((effRelType(a)||"")==="New employer acquired") T.new_employer_acq++;
      // Fresh-only per Bec: "student leads should only count new leads
      // added to database on that day" — same carve-out as the dashboards.
      if(a.type==="lead") T.lead++;
      if(a.activityOutcome&&["Apprentice vacancy identified","Student lead identified","Employer meeting booked","Sign-up booked"].includes(a.activityOutcome)) T.opp_generated++;
      // FIXED 2026-08-06 per Bec: "Pipeline progressed should show any
      // pipeline (enrolment/registrations) that have had movement and are
      // marked as progressed as per the pipeline tab." Was scoped to
      // pipeline+enrolment_pipeline only (effType-based, i.e. crediting
      // closed follow-ups) — silently excluding "registration" entirely,
      // even though the Pipeline tab itself (renderPipeline's `pipes`/
      // `progressed`) has always treated Registration Pipeline as one of
      // the three pipeline types whose stage movement counts. Matches that
      // tab's own definition exactly: raw a.type (no effType/closed-
      // follow-up resolution — the Pipeline tab doesn't do that either),
      // any of the three types, moved when prevStage/newStage are both set
      // and differ. Deliberately a standalone check, NOT nested inside the
      // pipeline_contacted block below — pipeline_contacted intentionally
      // stays pipeline+enrolment_pipeline-only (unchanged; Registrations
      // above already tracks new registration entries separately).
      if(["pipeline","registration","enrolment_pipeline"].includes(a.type) && a.newStage && a.prevStage && a.newStage!==a.prevStage){
        T.pipeline_progressed++;
      }
      if(["pipeline","enrolment_pipeline"].includes(effType)){
        T.pipeline_contacted++;
        // 2026-07-28: "records with no movement" — contacted this week but
        // the stage didn't change (distinct from records never contacted).
        if(a.newStage&&a.prevStage&&a.newStage===a.prevStage) T.pipeline_no_movement++;
        // 2026-07-28: pipeline-specific overdue, distinct from the general
        // T.followup_overdue (which also includes non-pipeline activities).
        if(a.followUpDate && a.status!=="Completed" && a.status!=="Closed" && isOverdue(a.followUpDate)) T.pipeline_overdue++;
        if(a.newStage==="Sign-up booked") T.signup_booked++;
        if(a.newStage==="Sign-up completed") T.signup_done++;
        if(a.newStage==="Registration submitted") T.reg_submitted++;
        if(a.newStage==="Registered") T.reg_done++;
        if(a.newStage==="Enrolled") T.enrolled_done++;
      }
    });

  });

  // FIXED 2026-08-03 — found via Bec spotting "60 open follow-ups · none
  // overdue" directly above a "Follow-up health" card showing 27 overdue
  // for the same coordinator on the same screen. Root cause: this used to
  // scan only day.activities for the 5 day-buckets belonging to the
  // SELECTED week (see the days.forEach above) — but a follow-up's
  // underlying activity record lives under whatever day it was originally
  // logged on, and anything actually overdue was, almost by definition,
  // logged in an earlier week. So this count silently missed nearly every
  // overdue follow-up while "Follow-up health" (via
  // getAllOpenFollowupsForDash, an all-time scan across every local day)
  // correctly found them — the two cards could never have agreed. Follow-up
  // open/overdue is a live "how many are open right now" snapshot, not a
  // "logged this week" count, so it now uses the same all-time source
  // everywhere it's shown (this tab, Weekly Excel/PDF, Trend charts) —
  // note this does mean the Trend view's "Overdue follow-ups" column will
  // show today's live count for every past week rather than a distinct
  // per-week value, since no historical snapshot of past open counts was
  // ever captured to begin with.
  const allOpenFu = getAllOpenFollowupsForDash(coord);
  T.followup_open = allOpenFu.length;
  T.followup_overdue = allOpenFu.filter(function(f){ return f.followUpDate && isOverdue(f.followUpDate); }).length;

  T.site_locations=T.site_locations.size;
  return T;
}

// ═══════════════════════════════════════════════════════════
// VALIDATION
// ═══════════════════════════════════════════════════════════
function validate(fields){
  // fields = [{id, label, required, type, value}]
  const errors={};
  fields.forEach(f=>{
    if(f.required && (!f.value||String(f.value).trim()==="")){
      errors[f.id]=f.label+" is required";
    }
    if(f.type==="email" && f.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.value)){
      errors[f.id]="Enter a valid email address";
    }
    if(f.type==="phone" && f.value && !/^[\d\s\+\-\(\)]{8,}$/.test(f.value)){
      errors[f.id]="Enter a valid phone number";
    }
    if(f.type==="date" && f.value && !/^\d{4}-\d{2}-\d{2}$/.test(f.value)){
      errors[f.id]="Enter a valid date (YYYY-MM-DD)";
    }
  });
  return errors;
}

function downloadDailyExcel() {
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];
  const date = S.date;

  const loadExcelJS = function(cb) {
    if (window.ExcelJS) { cb(); return; }
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js";
    s.onload = cb;
    s.onerror = function(){ alert("Could not load ExcelJS library"); };
    document.head.appendChild(s);
  };

  loadExcelJS(function() {
    const wb = new ExcelJS.Workbook();
    wb.creator = "CRBGC Activity Tracker";
    wb.created = new Date();

    const HDR  = {type:"pattern",pattern:"solid",fgColor:{argb:"FF1C3C6B"}};
    const HDR2 = {type:"pattern",pattern:"solid",fgColor:{argb:"FF2C5F9E"}};
    const GRN  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFC6EFCE"}};
    const AMB  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFFEB9C"}};
    const RED  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFFC7CE"}};
    const O1   = {type:"pattern",pattern:"solid",fgColor:{argb:"FFE1F5EE"}};
    const O2   = {type:"pattern",pattern:"solid",fgColor:{argb:"FFE6F1FB"}};
    const O3   = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFAEEDA"}};
    const WHT  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    const ALT  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFF8F9FA"}};

    function hdrCell(ws, r, c, v, bg) {
      const cell = ws.getCell(r, c);
      cell.value = v; cell.fill = bg||HDR;
      cell.font = {bold:true, color:{argb:"FFFFFFFF"}};
      cell.alignment = {horizontal:"center", vertical:"middle"};
      return cell;
    }
    function dataCell(ws, r, c, v, bold, fill, fontColor, align) {
      const cell = ws.getCell(r, c);
      cell.value = v; if(fill) cell.fill = fill;
      cell.font = {bold:!!bold, color:{argb:fontColor||"FF1a1a1a"}};
      cell.alignment = {horizontal:align||"left", vertical:"middle"};
      cell.border = {bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};
      return cell;
    }

    function paceRAG(val, tgt) {
      if (tgt===0) return {fill:null, font:"FF1a1a1a"};
      const pct = val/tgt;
      if (pct>=1)    return {fill:GRN, font:"FF375623"};
      if (pct>=0.7)  return {fill:AMB, font:"FF7D6608"};
      if (val>0)     return {fill:RED, font:"FF9C0006"};
      return {fill:null, font:"FFaaaaaa"};
    }

    coordsToShow.forEach(function(coord) {
      const state = STATES[coord];
      const day = loadDay(coord, date);
      const acts = realDayActivities(day); // FIXED 2026-08-03 — was raw day.activities, double-counting auto_fu_/auto_acap_ placeholder rows into this report's metrics
      const status = dayStatus(day);
      const tgt = WEEKLY_TARGETS;
      const s = state;
      const statusLabel = status==="productive"?"✅ Productive day":status==="partial"?"◐ Partial activity":"○ No meaningful activity";

      const ws = wb.addWorksheet(coord.split(" ")[0]+" "+state);
      ws.getColumn(1).width = 28;
      ws.getColumn(2).width = 12;
      ws.getColumn(3).width = 16;
      ws.getColumn(4).width = 16;
      ws.getColumn(5).width = 22;
      ws.getColumn(6).width = 20;
      ws.getColumn(7).width = 26;

      let r = 1;

      // Title
      ws.mergeCells(r,1,r,4);
      const tRow = ws.getCell(r,1);
      tRow.value = coord+" — "+state+" · "+fmtDate(date);
      tRow.fill = HDR; tRow.font = {bold:true,size:13,color:{argb:"FFFFFFFF"}};
      tRow.alignment = {horizontal:"left",vertical:"middle"};
      ws.getRow(r).height = 22; r++;

      // Status + focus
      ws.mergeCells(r,1,r,4);
      const sRow = ws.getCell(r,1);
      sRow.value = statusLabel+" · Focus: "+(day.focus||"Not set");
      sRow.fill = status==="productive"?GRN:status==="partial"?AMB:RED;
      sRow.font = {bold:true, color:{argb:status==="productive"?"FF375623":status==="partial"?"FF7D6608":"FF9C0006"}};
      sRow.alignment = {horizontal:"left",vertical:"middle"};
      ws.getRow(r).height = 18; r++;
      r++; // blank

      // Activity metrics header
      hdrCell(ws,r,1,"Metric"); hdrCell(ws,r,2,"Count"); hdrCell(ws,r,3,"Pace Target"); hdrCell(ws,r,4,"Status");
      ws.getRow(r).height = 16; r++;

      const metrics = [
        {label:"Commencements",         val:acts.filter(function(a){return a.type==="commencement";}).length,       tgt:Math.round(paceTarget(tgt.commencement[s])),  obj:"o1"},
        // 2026-08-06: only a brand-new person (newContactDetails set) counts
        // as a new registration — see weeklyTotals()'s matching fix.
        {label:"Registrations",          val:acts.filter(function(a){return a.type==="registration"&&a.newContactDetails;}).length,       tgt:Math.round(paceTarget(tgt.registration[s])),  obj:"o1"},
        {label:"ACAP contacts",          val:acts.filter(function(a){return a.type==="acap_contact"||a.type==="acap_f2f";}).length, tgt:Math.round(paceTarget(tgt.acap_contact[s])), obj:"o2"},
        {label:"ACAP F2F visits",        val:acts.filter(function(a){return a.type==="acap_f2f";}).length,            tgt:Math.round(paceTarget(tgt.acap_f2f[s])),      obj:"o2"},
        {label:"Events",                 val:acts.filter(function(a){return a.type==="event";}).length,               tgt:Math.round(paceTarget(tgt.event[s])),          obj:"o2"},
        {label:"Employer calls",         val:acts.filter(function(a){return a.type==="employer_call";}).length,       tgt:Math.round(paceTarget(tgt.employer_call[s])), obj:"o3"},
        {label:"Meaningful conversations",val:acts.filter(isMeaningfulCall).length,                                   tgt:0,                                             obj:"o3"},
        {label:"Site visits",            val:acts.filter(function(a){return a.type==="site_visit";}).length,          tgt:Math.round(paceTarget(tgt.site_visit[s])),    obj:"o3"},
        {label:"New employers met",      val:acts.filter(function(a){return a.type==="new_employer_met";}).length,    tgt:Math.round(paceTarget(tgt.new_employer_met[s])),obj:"o3"},
        {label:"Student leads",          val:acts.filter(function(a){return a.type==="lead";}).length,                tgt:Math.round(paceTarget(tgt.lead_generated[s])),obj:"o3"},
        {label:"Pipeline contacted",     val:acts.filter(function(a){return a.type==="pipeline";}).length,            tgt:0,                                             obj:"o3"},
        // 2026-08-06: widened to match renderPipeline()'s own definition —
        // pipeline + registration + enrolment_pipeline, see weeklyTotals().
        {label:"Pipeline progressed",    val:acts.filter(function(a){return ["pipeline","registration","enrolment_pipeline"].includes(a.type)&&a.newStage&&a.prevStage&&a.newStage!==a.prevStage;}).length,tgt:0,    obj:"o3"},
        {label:"Follow-ups closed",      val:acts.filter(function(a){return a.type==="follow_up_closed";}).length,   tgt:0,                                             obj:"o3"},
        {label:"Opportunities generated",val:acts.filter(function(a){return ["Apprentice vacancy identified","Student lead identified","Employer meeting booked","Sign-up booked"].includes(a.activityOutcome);}).length,tgt:0,obj:"o3"},
      ];

      metrics.forEach(function(m, mi) {
        const rag = paceRAG(m.val, m.tgt);
        const objFill = m.obj==="o1"?O1:m.obj==="o2"?O2:O3;
        const rowFill = mi%2===0?ALT:WHT;
        dataCell(ws,r,1,m.label,true,objFill, m.obj==="o1"?"FF085041":m.obj==="o2"?"FF0C447C":"FF633806");
        dataCell(ws,r,2,m.val,true, m.tgt>0?rag.fill:rowFill, m.tgt>0?rag.font:"FF1a1a1a","center");
        dataCell(ws,r,3,m.tgt>0?m.tgt:"—",false,rowFill,"FFaaaaaa","center");
        const statusTxt = m.tgt===0?"—":m.val>=m.tgt?"✅ On pace":m.val>=m.tgt*0.7?"⚠ Amber":"🔴 Behind";
        const statusFont = m.tgt===0?"FFaaaaaa":m.val>=m.tgt?"FF375623":m.val>=m.tgt*0.7?"FF7D6608":"FF9C0006";
        dataCell(ws,r,4,statusTxt,true,m.tgt>0?rag.fill:rowFill,statusFont,"center");
        ws.getRow(r).height = 15; r++;
      });

      r++; // blank

      // EOD section
      ws.mergeCells(r,1,r,4);
      const eodHdr = ws.getCell(r,1);
      eodHdr.value = "End of Day Review";
      eodHdr.fill = HDR2; eodHdr.font = {bold:true,color:{argb:"FFFFFFFF"}};
      eodHdr.alignment = {horizontal:"left",vertical:"middle"};
      ws.getRow(r).height = 16; r++;

      const eodRows = [
        ["EOD Result",     day.eodResult||"Not completed"],
        ["Tomorrow",       day.eodTomorrow||"—"],
        ["All entered?",   day.eodAllEntered||"—"],
        ["Status",         day.eodStatus==="complete"?"✅ Day complete":"◐ Draft"],
      ];
      eodRows.forEach(function(er) {
        dataCell(ws,r,1,er[0],true,ALT,"FF1C3C6B");
        ws.mergeCells(r,2,r,4);
        dataCell(ws,r,2,er[1],false,WHT,"FF1a1a1a","left");
        ws.getRow(r).height = 15; r++;
      });

      r++; // blank

      // Activity log
      ws.mergeCells(r,1,r,7);
      const actHdr = ws.getCell(r,1);
      actHdr.value = "Activity Log ("+acts.length+" entries)";
      actHdr.fill = HDR2; actHdr.font = {bold:true,color:{argb:"FFFFFFFF"}};
      ws.getRow(r).height = 16; r++;

      // Activity log headers
      ["Type","Name / Contact","Outcome","Next Action / Follow-up","Action Completed Today","Barrier","What Happened"].forEach(function(h,c){
        hdrCell(ws,r,c+1,h,HDR);
      });
      ws.getRow(r).height = 15; r++;

      acts.forEach(function(a, ai) {
        const fill = ai%2===0?ALT:WHT;
        dataCell(ws,r,1,activityLabel(a.type),false,fill,"FF1a1a1a","center");
        dataCell(ws,r,2,a.bizName||a.acapOrg||a.leadName||a.studentName||a.eventName||"",false,fill);
        dataCell(ws,r,3,a.activityOutcome||a.callOutcome||"",false,fill);
        dataCell(ws,r,4,(a.nextAction||"")+(a.followUpDate?" · "+fmtDateShort(a.followUpDate):""),false,fill);
        dataCell(ws,r,5,a.actionToday||"",false,fill);
        dataCell(ws,r,6,a.barrier||"",false,fill);
        dataCell(ws,r,7,a.closeNotes||(a.type==="follow_up_closed"?a.notes:"")||"",false,fill);
        ws.getRow(r).height = 15; r++;
      });
    });

    wb.xlsx.writeBuffer().then(function(buffer) {
      const blob = new Blob([buffer],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href=url; a.download="CRBGC_Daily_"+date+".xlsx";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    });
  });
}


function downloadWeeklyExcel() {

      fRow.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFAEEDA"}};

          ws.getCell(r,1).font={bold:true,color:{argb:m.warn?"FF9C0006":"FF1a1a1a"}};
          ws.getCell(r,1).alignment={horizontal:"left",vertical:"middle"};
          ws.getCell(r,1).border={bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};

          ws.getCell(r,2).value=m.val;
          ws.getCell(r,2).fill=m.tgt>0&&rag?rag.fill:rowFill;
          ws.getCell(r,2).font={bold:true,color:{argb:m.tgt>0&&rag?rag.font:"FF1a1a1a"}};
          ws.getCell(r,2).alignment={horizontal:"center",vertical:"middle"};
          ws.getCell(r,2).border={bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};

          ws.getCell(r,3).value=m.tgt>0?m.tgt:"—";
          ws.getCell(r,3).fill=rowFill;
          ws.getCell(r,3).font={color:{argb:"FFaaaaaa"}};
          ws.getCell(r,3).alignment={horizontal:"center",vertical:"middle"};
          ws.getCell(r,3).border={bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};

          ws.getCell(r,4).value=pct;
          ws.getCell(r,4).fill=m.tgt>0&&rag?rag.fill:rowFill;
          ws.getCell(r,4).font={color:{argb:m.tgt>0&&rag?rag.font:"FFaaaaaa"}};
          ws.getCell(r,4).alignment={horizontal:"center",vertical:"middle"};
          ws.getCell(r,4).border={bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};

          ws.getCell(r,5).value=m.tgt>0&&rag?rag.label:m.warn&&rag?rag.label:"—";
          ws.getCell(r,5).fill=m.tgt>0&&rag?rag.fill:m.warn&&rag?rag.fill:rowFill;
          ws.getCell(r,5).font={bold:true,color:{argb:m.tgt>0&&rag?rag.font:m.warn&&rag?rag.font:"FFaaaaaa"}};
          ws.getCell(r,5).alignment={horizontal:"center",vertical:"middle"};
          ws.getCell(r,5).border={bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};

          ws.getRow(r).height=15; r++;
        });
        r++; // blank between sections
      });

      // 2026-08-03: itemized weekly Activity Log (per Bec's request that
      // Next Action, Action Completed Today, Barrier and "What Happened"
      // show in the weekly log records — this table was previously KPI
      // totals only, with no per-activity detail).
      const weekDates = weekDaysMF(S.date);
      const weekActs = [];
      weekDates.forEach(function(d){
        const day = loadDay(coord, d);
        realDayActivities(day).forEach(function(a){
          const withDate = Object.assign({}, a);
          withDate._date = d;
          weekActs.push(withDate);
        });
      });

      ws.mergeCells(r,1,r,8);
      const wActHdr = ws.getCell(r,1);
      wActHdr.value = "Activity Log ("+weekActs.length+" entries)";
      wActHdr.fill = HDR2; wActHdr.font = {bold:true,color:{argb:"FFFFFFFF"}};
      wActHdr.alignment = {horizontal:"left",vertical:"middle"};
      ws.getRow(r).height = 16; r++;

      ["Date","Type","Name / Contact","Outcome","Next Action / Follow-up","Action Completed Today","Barrier","What Happened"].forEach(function(h,c){
        const cell = ws.getCell(r,c+1);
        cell.value = h; cell.fill = HDR;
        cell.font = {bold:true,color:{argb:"FFFFFFFF"}};
        cell.alignment = {horizontal:c===0?"left":"center",vertical:"middle"};
      });
      ws.getRow(r).height = 15; r++;

      weekActs.forEach(function(a, ai) {
        const fill = ai%2===0?ALT:WHT;
        function wCell(c,v,align){
          const cell = ws.getCell(r,c);
          cell.value = v; cell.fill = fill;
          cell.font = {color:{argb:"FF1a1a1a"}};
          cell.alignment = {horizontal:align||"left",vertical:"middle"};
          cell.border = {bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};
        }
        wCell(1, fmtDateShort(a._date));
        wCell(2, activityLabel(a.type), "center");
        wCell(3, a.bizName||a.acapOrg||a.leadName||a.studentName||a.eventName||"");
        wCell(4, a.activityOutcome||a.callOutcome||"");
        wCell(5, (a.nextAction||"")+(a.followUpDate?" · "+fmtDateShort(a.followUpDate):""));
        wCell(6, a.actionToday||"");
        wCell(7, a.barrier||"");
        wCell(8, a.closeNotes||(a.type==="follow_up_closed"?a.notes:"")||"");
        ws.getRow(r).height = 15; r++;
      });
    });

    wb.xlsx.writeBuffer().then(function(buffer) {
      const blob=new Blob([buffer],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="CRBGC_Weekly_"+S.date+".xlsx";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    });
  });
}


function downloadTrendExcel() {
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];
  const tF = mondayOf(S.trendFrom || addWeeks(S.date,-7));
  const tT = mondayOf(S.trendTo   || S.date);
  const weeks = [];
  let cW = new Date(tT+"T12:00:00");
  const fW = new Date(tF+"T12:00:00");
  while (cW >= fW && weeks.length < 52) {
    weeks.push(cW.toISOString().substring(0,10));
    cW.setDate(cW.getDate()-7);
  }
  const weekLabels = weeks.map(function(mon){ return fmtDateShort(mon); });

  const TREND_METRICS = [
    {label:"Commencements",           fn:function(T){return T.commencement;},         key:"commencement"},
    {label:"Registrations",           fn:function(T){return T.registration;},         key:"registration"},
    {label:"Calls attempted",         fn:function(T){return T.call_attempted;},       key:"call_attempted"},
    {label:"Meaningful conversations",fn:function(T){return T.call_meaningful;}},
    {label:"Site visits",             fn:function(T){return T.site_employers;},       key:"site_employers"},
    {label:"ACAP contacts",           fn:function(T){return T.acap_contact_attempted;},key:"acap_contact"},
    {label:"Opportunities",           fn:function(T){return T.opp_generated;}},
    {label:"Pipeline progressed",     fn:function(T){return T.pipeline_progressed;}},
    {label:"Pipeline no movement",    fn:function(T){return T.pipeline_no_movement;}, warn:true},
    {label:"Pipeline overdue",        fn:function(T){return T.pipeline_overdue;},     warn:true},
    {label:"New employers met",       fn:function(T){return T.new_employer_met;},     key:"new_employer_met"},
    {label:"Student leads",           fn:function(T){return T.lead;},                key:"lead"},
    {label:"Overdue follow-ups",      fn:function(T){return T.followup_overdue;},    warn:true},
    {label:"Productive days",         fn:function(T){return T.days_productive;}},
  ];

  const data = {};
  coordsToShow.forEach(function(coord) {
    data[coord] = {};
    weeks.forEach(function(mon){ data[coord][mon] = weeklyTotals(coord, mon); });
  });

  function getWeeklyTgt(metricKey, warn, state) {
    if (warn || !metricKey) return 0;
    const t = WEEKLY_TARGETS;
    return metricKey==="commencement"?t.commencement[state]:
           metricKey==="registration"?t.registration[state]:
           metricKey==="call_attempted"?t.employer_call[state]:
           metricKey==="site_employers"?t.site_visit[state]:
           metricKey==="acap_contact"?t.acap_contact[state]:
           metricKey==="new_employer_met"?t.new_employer_met[state]:
           metricKey==="lead"?t.lead_generated[state]:0;
  }

  function ragFill(v, tgt, warn) {
    if (warn) {
      if (v===0) return {argb:"FFC6EFCE"};
      if (v<=2)  return {argb:"FFFFFFEB9C"};
      return          {argb:"FFFFC7CE"};
    }
    if (tgt>0) {
      const pct = v/tgt;
      if (pct>=1)   return {argb:"FFC6EFCE"};
      if (pct>=0.7) return {argb:"FFFFFFEB9C"};
      if (v>0)      return {argb:"FFFFC7CE"};
    }
    return null;
  }

  function ragFont(v, tgt, warn) {
    if (warn) {
      if (v===0) return "375623";
      if (v<=2)  return "7D6608";
      return          "9C0006";
    }
    if (tgt>0) {
      const pct = v/tgt;
      if (pct>=1)   return "375623";
      if (pct>=0.7) return "7D6608";
      if (v>0)      return "9C0006";
    }
    return "1a1a1a";
  }

  // Load ExcelJS
  const loadExcelJS = function(cb) {
    if (window.ExcelJS) { cb(); return; }
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js";
    s.onload = cb;
    s.onerror = function(){ alert("Could not load ExcelJS library — check your internet connection"); };
    document.head.appendChild(s);
  };

  loadExcelJS(function() {
    const wb = new ExcelJS.Workbook();
    wb.creator = "CRBGC Activity Tracker";
    wb.created = new Date();

    function buildSheet(sheetName, coordList) {
      const ws = wb.addWorksheet(sheetName);
      const totalCols = 2 + weeks.length;

      // Column widths
      ws.getColumn(1).width = 28;
      ws.getColumn(2).width = 14;
      for (let i=0; i<weeks.length; i++) ws.getColumn(3+i).width = 11;

      // Title row
      const titleRow = ws.addRow([sheetName]);
      ws.mergeCells(titleRow.number, 1, titleRow.number, totalCols);
      titleRow.getCell(1).fill   = {type:"pattern",pattern:"solid",fgColor:{argb:"FF1C3C6B"}};
      titleRow.getCell(1).font  = {bold:true,size:13,color:{argb:"FFFFFFFF"}};
      titleRow.getCell(1).alignment = {horizontal:"left",vertical:"middle"};
      titleRow.height = 22;

      // Blank row
      ws.addRow([]);

      // Header row
      const hdrs = ["Metric","Trend"].concat(weekLabels);
      const hdrRow = ws.addRow(hdrs);
      hdrRow.height = 18;
      hdrRow.eachCell(function(cell, colNum) {
        const isLatest = colNum === 3;
        cell.fill = {type:"pattern",pattern:"solid",fgColor:{argb: isLatest?"FF1C3C6B":"FF2C5F9E"}};
        cell.font = {bold:true,color:{argb:"FFFFFFFF"}};
        cell.alignment = {horizontal:"center",vertical:"middle"};
        cell.border = {bottom:{style:"thin",color:{argb:"FFFFFFFF"}}};
      });
      hdrRow.getCell(1).alignment = {horizontal:"left"};

      // Data rows
      TREND_METRICS.forEach(function(metric, mi) {
        const rowBgHex = mi%2===0?"FFF8F9FA":"FFFFFFFF";

        // Calculate combined vals across coordList
        const vals = weeks.map(function(mon) {
          return coordList.reduce(function(sum,coord){ return sum+metric.fn(data[coord][mon]); },0);
        });

        // Combined weekly target
        const combinedTgt = coordList.reduce(function(sum,coord){
          return sum + getWeeklyTgt(metric.key, metric.warn, STATES[coord]);
        },0);

        const latest = vals[0]||0, prev = vals[1]||0;
        const diff = latest - prev;
        const trendTxt = diff>0?"↑ +"+diff : diff<0?"↓ "+diff : "→";
        const trendCol = metric.warn
          ? (diff>0?"FF9C0006":diff<0?"FF375623":"FF888888")
          : (diff>0?"FF375623":diff<0?"FF9C0006":"FF888888");

        const rowData = [metric.label, trendTxt].concat(vals);
        const row = ws.addRow(rowData);
        row.height = 16;

        // Metric label cell
        row.getCell(1).font = {bold:true, color:{argb: metric.warn?"FF9C0006":"FF1a1a1a"}};
        row.getCell(1).fill = {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
        row.getCell(1).alignment = {horizontal:"left",vertical:"middle"};

        // Trend cell
        row.getCell(2).font = {bold:true, color:{argb:trendCol}};
        row.getCell(2).fill = {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
        row.getCell(2).alignment = {horizontal:"center",vertical:"middle"};

        // Value cells
        vals.forEach(function(v, vi) {
          const cell = row.getCell(3+vi);
          const isLatest = vi===0;
          cell.value = v;
          cell.alignment = {horizontal:"center",vertical:"middle"};

          if (isLatest) {
            const fill = ragFill(v, combinedTgt, metric.warn);
            cell.fill = fill
              ? {type:"pattern",pattern:"solid",fgColor:fill}
              : {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
            cell.font = {bold:true, color:{argb:"FF"+ragFont(v, combinedTgt, metric.warn)}};
          } else {
            cell.fill = {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
            cell.font = {color:{argb: v===0?"FFAAAAAA":"FF555555"}};
          }
          cell.border = {bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};
        });
      });
    }

    // Per-coordinator sheets
    coordsToShow.forEach(function(coord) {
      buildSheet(coord.split(" ")[0]+" "+STATES[coord], [coord]);
    });

    // Team combined sheet
    if (S.dashFilter.coord === "all") {
      buildSheet("Team Combined", coordsToShow);
    }

    // Write and download
    wb.xlsx.writeBuffer().then(function(buffer) {
      const blob = new Blob([buffer], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url;
      a.download = "CRBGC_Trend_"+S.date+".xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  });
}

function downloadDashboardPDF() {
  if (S.dashView === "trend") return downloadTrendPDF();
  const isDaily = S.dashView === "daily";
  const coordsToShow = S.dashFilter.coord === "all" ? COORDS : [S.dashFilter.coord];
  const date = S.date;
  const title = isDaily
    ? "Daily Management Report — " + fmtDate(date)
    : "Weekly Management Report — " + fmtWkRange(date);

  let body = "";

  coordsToShow.forEach(function(coord) {
    const state = STATES[coord];
    const tgt = WEEKLY_TARGETS;
    const s = state;

    if (isDaily) {
      const day = loadDay(coord, date);
      const acts = realDayActivities(day); // FIXED 2026-08-03 — was raw day.activities, double-counting auto_fu_/auto_acap_ placeholder rows into Employer calls/ACAP contacts on this report
      const status = dayStatus(day);
      const statusLabel = status==="productive"?"✅ Productive day":status==="partial"?"◐ Partial activity":"○ No meaningful activity";

      const commencements    = acts.filter(a=>a.type==="commencement").length;
      // 2026-08-06: only a brand-new person (newContactDetails set) counts
      // as a new registration — see weeklyTotals()'s matching fix.
      const registrations    = acts.filter(a=>a.type==="registration"&&a.newContactDetails).length;
      const acapContacts     = acts.filter(a=>a.type==="acap_contact"||a.type==="acap_f2f").length;
      const callsAttempted   = acts.filter(a=>a.type==="employer_call"&&(!a.id||!a.id.startsWith("auto_fu_"))).length;
      const callsMeaningful  = acts.filter(isMeaningfulCall).length;
      const siteVisits       = acts.filter(a=>a.type==="site_visit").length;
      const newEmployers     = acts.filter(a=>a.type==="new_employer_met"||a.type==="new_employer_db").length;
      const leads            = acts.filter(a=>a.type==="lead").length;
      const pipelineContacted= acts.filter(a=>a.type==="pipeline").length;
      // 2026-08-06: widened to match renderPipeline()'s own definition —

// ── Daily pace computation — 2026-08-06: pulled out of renderDailyPaceCard
// so the SAME "is this coordinator off-pace today" determination can also
// gate the End-of-day review's off-pace explanation prompt (see saveEOD()
// and the "Needs attention" note on renderDailyNotes()'s EOD card) without
// re-implementing the pace math a second time and risking the two drifting
// apart. Returns per-metric status ("on"/"amber"/"behind") exactly as
// already shown in the "Needs attention" list below — "behind" is <70% of
// the day-prorated weekly target, same threshold as before this refactor. ─
function computeDailyPaceDetails(coord, state, date) {
  const ds = date||S.date||TODAY;
  // Which day of the week is it? (1=Mon, 5=Fri)
  const d = new Date(ds+"T12:00:00");
  const dow = d.getDay(); // 0=Sun, 1=Mon...5=Fri, 6=Sat
  const dayNum = dow === 0 ? 5 : dow === 6 ? 5 : dow; // clamp weekends to 5
  const tgt = WEEKLY_TARGETS;
  const s = state;
  const T = weeklyTotals(coord, ds);

  // Metrics to pace-check (those with targets > 0)
  const paceMetrics = [
    {label:"Commencements",    actual:T.commencement,          weekly:tgt.commencement[s]},
    {label:"Registrations",    actual:T.registration,          weekly:tgt.registration[s]},
    {label:"ACAP contacts",    actual:T.acap_contact_attempted,weekly:tgt.acap_contact[s]},
    {label:"Employer calls",   actual:T.call_attempted,        weekly:tgt.employer_call[s]},
    {label:"Site visits",      actual:T.site_employers,        weekly:tgt.site_visit[s]},
    {label:"New employers met",actual:T.new_employer_met,      weekly:tgt.new_employer_met[s]},
    {label:"Student leads",    actual:T.lead,                  weekly:tgt.lead_generated[s]},
  ].filter(m=>m.weekly>0);

  // Daily pace target = weekly × dayNum/5
  let onTrack=0, behind=0, ahead=0;
  const details=[];
  paceMetrics.forEach(m=>{
    const pace = Math.round((m.weekly * dayNum / 5) * 10) / 10;
    const pct = pace > 0 ? m.actual / pace : 1;
    if (pct >= 1)      { ahead++;   details.push({...m, pace, status:"on"}); }
    else if (pct >= 0.7){ onTrack++; details.push({...m, pace, status:"amber"}); }
    else               { behind++;  details.push({...m, pace, status:"behind"}); }
  });

  const total = paceMetrics.length;
  const dayLabels = ["","Mon","Tue","Wed","Thu","Fri"];
  const dayLabel = dayLabels[dayNum]||"Today";

  return {details, onTrack, behind, ahead, total, dayNum, dayLabel};
}

// ── Daily pace card ───────────────────────────────────────────────────────
function renderDailyPaceCard(coord, state, date) {
  const {details, onTrack, behind, ahead, total, dayLabel} = computeDailyPaceDetails(coord, state, date);

  // Overall status
  let statusBg, statusTxt, statusIcon, statusMsg;
  if (behind === 0 && onTrack === 0) {
    statusBg="#E1F5EE"; statusTxt="#085041"; statusIcon="✅";
    statusMsg="On track for the week";
  } else if (behind <= 1) {
    statusBg="#FFEB9C"; statusTxt="#7D6608"; statusIcon="⚠";
    statusMsg=behind+" metric"+(behind>1?"s":"")+" behind "+dayLabel+"'s pace";
  } else {
    statusBg="#FFC7CE"; statusTxt="#9C0006"; statusIcon="🔴";
    statusMsg=behind+" metrics behind "+dayLabel+"'s pace";
  }

  // Build metric rows — only show those behind or at risk
  const showDetails = details.filter(d=>d.status!=="on");

  let h=`<div class="card" style="border-left:4px solid ${behind>1?"var(--redt)":behind===1?"var(--ambert)":"var(--greent)"}">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:${showDetails.length>0?10:0}px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--tp)">${statusIcon} Daily pace — ${dayLabel}</div>
        <div style="font-size:12px;color:var(--ts);margin-top:2px">${statusMsg}</div>
      </div>
      <div style="text-align:center;background:${statusBg};padding:6px 12px;border-radius:var(--r)">
        <div style="font-size:20px;font-weight:700;color:${statusTxt}">${ahead}/${total}</div>
        <div style="font-size:10px;color:${statusTxt}">on pace</div>
      </div>
    </div>`;

  if (showDetails.length > 0) {
    h+=`<div style="border-top:.5px solid var(--bd);padding-top:8px">
      <div style="font-size:11px;font-weight:600;color:var(--tm);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Needs attention</div>`;
    showDetails.forEach(m=>{
      const paceRound = Math.ceil(m.pace);
      const needed = Math.max(0, paceRound - m.actual);
      const col = m.status==="behind"?"var(--redt)":"var(--ambert)";
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:.5px solid var(--bd)">
        <span style="flex:1;font-size:12px;color:var(--ts)">${m.label}</span>
        <span style="font-size:12px;font-weight:700;color:var(--tp)">${m.actual}</span>
        <span style="font-size:11px;color:var(--tm)">/ ${paceRound} by ${dayLabel}</span>
        <span style="font-size:11px;font-weight:600;color:${col}">${needed>0?"+"+needed+" needed":""}</span>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderActItem(a, viewCoord){
  const col=activityColor(a.type);

  const meaningful=isMeaningfulCall(a);
  // Manager can delete any record; coordinators can only delete their own
  const canDelete = S.user.isManager || !viewCoord || viewCoord === S.user.coord;
  const delCoord = viewCoord || S.user.coord;
  const name=a.bizName||a.studentName||a.leadName||a.acapOrg||a.eventName||"";
  return `<div class="act-item">
    <div class="act-item-hdr" style="padding-right:44px">
      <span class="tag" style="background:${col.bg};color:${col.txt}">${activityLabel(a.type)}</span>

  if(visits.length>0){
    // Group by suburb
    const bySuburb={};
    visits.forEach(v=>{ const s=v.suburb||"Unknown location"; if(!bySuburb[s])bySuburb[s]=[]; bySuburb[s].push(v); });
    h+=`<div class="sect-hdr">Today's site visits</div><div style="padding:0 12px;">`;
    Object.entries(bySuburb).forEach(([suburb,vs])=>{
      h+=`<div style="margin-bottom:4px;font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;">${suburb} · ${vs.length} employer${vs.length>1?"s":""}</div>`;
      vs.forEach(a=>{
        h+=`<div class="act-item">
          <div class="act-item-hdr" style="padding-right:44px">
            <span class="bold small">${a.bizName||"—"}</span>
            <span class="muted small">${a.contactName||""}</span>
          </div>
          <div class="act-btns">
            <button class="act-edit" onclick="editActivity('${a.id}')" title="Edit"><i class="ti ti-pencil"></i></button>
            <button class="act-del" onclick="deleteActivity('${a.id}')" title="Delete"><i class="ti ti-trash"></i></button>
          </div>
          ${a.relType?`<div class="small" style="color:var(--ts)">${a.relType}</div>`:""}
          ${a.activityOutcome?`<div class="small" style="color:var(--ts)">${a.activityOutcome}</div>`:""}
          ${a.nextAction?`<div class="small muted mt8"><i class="ti ti-arrow-right"></i> ${a.nextAction}${a.followUpDate?" · Follow-up booked: "+fmtDateShort(a.followUpDate):""}</div>`:""}
        </div>`;
      });
    });
    h+=`</div>`;
  }
  return h;
}

function renderPipeline(coord,state,day){
  // New-list item 7: Registration Pipeline and Enrolment Pipeline activities

  // existed as raw synced rows. They now show up here alongside the general
  // Pipeline Contact log.
  const pipes=(day.activities||[]).filter(a=>["pipeline","registration","enrolment_pipeline"].includes(a.type));

  let h=`<div class="card">
    <div class="card-title"><i class="ti ti-git-branch"></i> Pipeline Conversion — ${fmtDate(S.date)}</div>
    <div class="field-row" style="grid-template-columns:1fr 1fr;margin-bottom:12px;">

      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--greent)">${progressed}</div><div class="small muted">Progressed</div></div>

      <button class="btn-primary" onclick="openActivityModal('registration')"><i class="ti ti-file-check"></i> Registration Pipeline</button>

  </div>`;

  if(pipes.length>0){
    h+=`<div class="sect-hdr">Pipeline contacts today</div><div style="padding:0 12px;">
    ${pipes.map(a=>{
      const moved=a.newStage&&a.prevStage&&a.newStage!==a.prevStage;
      const name=a.leadName||a.studentName||"—";
      const typeTag=a.type==="registration"?"Registration":a.type==="enrolment_pipeline"?"Enrolment":"";
      return `<div class="act-item">
        <div class="act-item-hdr" style="padding-right:44px">
          <span class="bold small">${name}</span>
          <span class="muted small">${a.trade||""}</span>
          ${typeTag?`<span class="tag" style="background:var(--s2);color:var(--ts);font-size:10px">${typeTag}</span>`:""}
          ${moved?'<span class="tag" style="background:var(--green);color:var(--greent);font-size:10px">↑ Progressed</span>':""}
        </div>
        <div class="act-btns">
          <button class="act-edit" onclick="editActivity('${a.id}')" title="Edit"><i class="ti ti-pencil"></i></button>
          <button class="act-del" onclick="deleteActivity('${a.id}')" title="Delete"><i class="ti ti-trash"></i></button>
        </div>
        ${moved?`<div class="small" style="color:var(--ts)">${a.prevStage} <i class="ti ti-arrow-right" style="font-size:11px"></i> <strong>${a.newStage}</strong></div>`:`<div class="small muted">${a.newStage||a.prevStage||""}</div>`}
        ${a.linkedEmployer?`<div class="small muted"><i class="ti ti-building"></i> ${a.linkedEmployer}</div>`:""}
        ${a.barrier?`<div class="small muted mt8"><i class="ti ti-lock"></i> Barrier: ${a.barrier}</div>`:""}
        ${a.nextAction?`<div class="small muted mt8"><i class="ti ti-arrow-right"></i> ${a.nextAction}${a.followUpDate?" · Follow-up booked: "+fmtDateShort(a.followUpDate):""}</div>`:""}
      </div>`;
    }).join("")}
    </div>`;
  }
  return h;
}

// ═══════════════════════════════════════════════════════════
// DAILY NOTES TAB
// ═══════════════════════════════════════════════════════════
function renderDailyNotes(coord,state,day){
  const noteFields=[
    {id:"nwins",label:"Wins & key outcomes",ph:"What went well today?",icon:"ti-star",col:"#085041"},
    {id:"nblockers",label:"Blockers & follow-ups needed",ph:"What needs actioning?",icon:"ti-alert-triangle",col:"#9c0006"},
    {id:"npipeline",label:"Pipeline notes",ph:"New leads, opportunities moving forward…",icon:"ti-git-branch",col:"#633806"},
    {id:"ncampaign",label:"Campaign progress notes",ph:"Updates on active campaigns, employer call runs, estate visits…",icon:"ti-speakerphone",col:"#0C447C"},
  ];

  // 2026-08-06 — Bec: "move the Primary focus function from the today tab
  // to the daily notes section and update to: what was your primary focus
  // today? apply the same logic on how many should be met to accept it as
  // a primary focus, if not, highlight and ask for a reason as to why...
  // if it does - ask for a brief outline of that primary focus." Asked
  // retrospectively, with a follow-up driven by the SAME threshold check
  // dayStatus() itself uses (via the shared computeFocusThresholdMet — see
  // the note above that function), so this can never disagree with the
  // day's own productive/partial/none classification.
  //
  // UPDATED 2026-08 per Bec, after asking to confirm it always showed:
  // "can you add this to the end of day review instead of it having it's
  // own card and set the condition for it only to appear when daily pace
  // is not met?" So Primary Focus no longer has its own standalone card —
  // its markup is now built here (focusSectionHtml) and spliced into the
  // End-of-day review card below, ahead of the existing result/tomorrow/
  // all-entered fields, and only rendered at all when
  // dailyPaceBehindCount(day)>0 (matches the original off-pace-explanation
  // feature's own "behind" trigger — see dailyPaceBehindCount's note). On
  // an on-pace day nothing here is asked or required — day.focus can stay
  // empty and dayStatus() no longer depends on it in that case.
  const focusThreshold = computeFocusThresholdMet(day);
  const paceBehindCount = dailyPaceBehindCount(day);
  const focusSectionHtml = paceBehindCount===0 ? "" : `
    <div class="field">
      <label>What was your primary focus today?<span class="req">*</span></label>
      <select id="focus_sel" onchange="saveFocus()">
        <option value="">— Select focus —</option>
        ${PRIMARY_FOCUS.map(f=>`<option value="${f}"${day.focus===f?" selected":""}>${f}</option>`).join("")}
      </select>
    </div>
    ${day.focus==="Other"?`<div class="field"><label>Describe your focus<span class="req">*</span></label>
      <input id="focus_other" value="${day.focusOther||""}" placeholder="Describe..." onchange="saveFocusOther()"></div>`:""}
    ${day.focus?`<div style="margin:4px 0 10px">${getDayStatusLabel(dayStatus(day))}</div>`:""}
    ${(()=>{
      if(!day.focus||!focusThreshold) return "";
      if(focusThreshold.met){
        return `<div class="field" style="margin-bottom:0">
          <label>Brief outline of today's primary focus<span class="req">*</span></label>
          <div class="hint" style="margin-bottom:4px">A couple of sentences on what this focus actually involved today.</div>
          <textarea id="focus_outline" placeholder="What did today's ${day.focus} focus involve?" onchange="saveFocusFollowup('outline',this.value)" style="min-height:60px">${day.focusOutline||""}</textarea>
        </div>`;
      }
      return `<div class="field" style="margin-bottom:0;background:#fcebeb;border-radius:var(--r);padding:10px;border-left:3px solid var(--redt)">
        <label style="color:#9c0006">${focusThresholdShortfallHeadline(day,focusThreshold)}<span class="req">*</span></label>
        <div class="hint" style="margin-bottom:4px">Why hasn't this focus's minimum been reached? Were you focused on something that doesn't show up here, or blocked some other way?</div>
        <textarea id="focus_shortfall" placeholder="e.g. Spent most of the day on an urgent employer issue that isn't a loggable activity type." onchange="saveFocusFollowup('shortfall',this.value)" style="min-height:60px">${day.focusShortfallReason||""}</textarea>
      </div>`;
    })()}
  `;

  let h=`<div class="card">
    <div class="card-title"><i class="ti ti-notes"></i> Daily Notes — ${fmtDate(S.date)}</div>
    ${noteFields.map(f=>`
    <div class="field">
      <label><i class="ti ${f.icon}" style="color:${f.col}"></i> ${f.label}</label>
      <textarea id="${f.id}" placeholder="${f.ph}" onchange="saveNote('${f.id}',this.value)" style="min-height:80px">${day[f.id]||""}</textarea>
    </div>`).join("")}
  </div>`;

  // 2026-08-06: Risk section — structured, multi-entry (unlike the plain
  // textareas above, a day can have zero, one, or several distinct risks),
  // rolled up into the Weekly Summary's own Risk section (renderWkNotes)
  // and the Weekly Notes PDF export (downloadWeeklyNotes). Fields per
  // Bec's spec: Issue Identified (Root Cause), Responsible Department,
  // Action Taken, Outcome/Follow-up.
  const risks=day.risks||[];
  h+=`<div class="card">
    <div class="card-title"><i class="ti ti-alert-octagon" style="color:#9c0006"></i> Risk
      <span class="small muted" style="font-weight:400;margin-left:4px">— issues to own and drive to resolution</span>
    </div>
    ${!risks.length?'<div class="small muted" style="margin-bottom:10px">No risks logged for today.</div>':""}
    ${risks.map((r,i)=>`
    <div style="border:1px solid var(--bd);border-radius:var(--r2);padding:10px;margin-bottom:10px;background:#fcebeb1a">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;font-weight:600;color:#9c0006">Risk ${i+1}</span>
        <button onclick="deleteRisk(${i})" class="btn-ghost btn-sm" style="padding:2px 8px;font-size:11px" title="Remove this risk"><i class="ti ti-trash"></i></button>
      </div>
      <div class="field">
        <label>Issue identified (root cause)</label>
        <div class="hint" style="margin-bottom:4px">Don't just state the symptom — what's actually driving this problem?</div>
        <textarea onchange="updateRisk(${i},'issue',this.value)" placeholder="What is the underlying cause?" style="min-height:60px">${r.issue||""}</textarea>
      </div>
      <div class="field">
        <label>Responsible department</label>
        <div class="hint" style="margin-bottom:4px">Which area is best placed to own the issue?</div>
        <select onchange="updateRisk(${i},'department',this.value)">
          <option value="">— Select —</option>
          ${RISK_DEPARTMENTS.map(d=>`<option value="${d}"${r.department===d?" selected":""}>${d}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Action taken</label>
        <div class="hint" style="margin-bottom:4px">What have you done so far? Include conversations, referrals, emails or actions completed.</div>
        <textarea onchange="updateRisk(${i},'action',this.value)" placeholder="What's been done to begin resolving this?" style="min-height:60px">${r.action||""}</textarea>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Outcome / follow-up</label>
        <div class="hint" style="margin-bottom:4px">What's the current status? If not resolved, who owns the next step and when will you follow up?</div>
        <textarea onchange="updateRisk(${i},'outcome',this.value)" placeholder="Current status and next step" style="min-height:60px">${r.outcome||""}</textarea>
      </div>
    </div>`).join("")}
    <button onclick="addRisk()" class="btn-ghost btn-sm"><i class="ti ti-plus"></i> Add risk</button>
  </div>`;

  // End of day review
  const eodComplete=day.eodStatus==="complete";
  h+=`<div class="card" style="${eodComplete?"border-color:var(--greent);background:#f0fff8":""}">
    <div class="card-title"><i class="ti ti-checklist"></i> End-of-day review
      ${eodComplete?'<span class="tag" style="background:var(--green);color:var(--greent);font-size:11px">✓ Day complete</span>':'<span class="tag" style="background:var(--amber);color:var(--ambert);font-size:11px">Draft</span>'}
    </div>
    <div id="eod_errors"></div>
    ${focusSectionHtml}
    <div class="field">
      <label>What result did today's activity create?</label>
      <textarea id="eod_result" placeholder="What was actually achieved?" onchange="saveEOD('result',this.value)" style="min-height:72px">${day.eodResult||""}</textarea>
    </div>
    <div class="field">
      <label>Highest-priority action for tomorrow</label>
      <textarea id="eod_tomorrow" placeholder="What must happen first tomorrow?" onchange="saveEOD('tomorrow',this.value)" style="min-height:60px">${day.eodTomorrow||""}</textarea>
    </div>
    <div class="field">
      <label>All activities and follow-ups entered and current?</label>
      <select id="eod_entered" onchange="saveEOD('entered',this.value)">
        <option value="">— Select —</option>
        <option value="Yes"${day.eodAllEntered==="Yes"?" selected":""}>Yes — everything is up to date</option>
        <option value="No"${day.eodAllEntered==="No"?" selected":""}>No — some items still to enter</option>
      </select>
    </div>
    <!-- 2026-08 — Bec: "remove - this is redundant now the primary focus
         is in the same tab." The standalone off-pace explanation prompt
         (behind-pace metrics → required free-text reason) was removed:
         the Primary Focus card above already covers this ground — it asks
         for the same kind of explanation (why a focus's minimum wasn't
         met) whenever the coordinator is behind on their selected focus,
         so asking a second, near-identical question here was redundant.
         day.eodOffPaceNote / saveEOD('offPaceNote',...) are left in place
         (harmless) so already-recorded historical notes still display on
         the Weekly Summary/Manager Dashboard "Needs attention" rollups —
         only the input prompt and its required-field gate are removed. -->
    <div style="display:flex;gap:8px;margin-top:4px">
      <button onclick="saveEOD('status','draft')" class="${!eodComplete?"btn-primary":"btn-ghost"} btn-sm">Save as draft</button>
      <button onclick="saveEOD('status','complete')" class="${eodComplete?"btn-success":"btn-primary"} btn-sm">✓ Mark day complete</button>
    </div>
  </div>`;

  return h;
}
