<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRBGC Activity Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --hdr:#1C3C6B;--hdr2:#2C5F9E;--tp:#1a1a1a;--ts:#555;--tm:#888;
  --o1:#E1F5EE;--o1t:#085041;--o2:#E6F1FB;--o2t:#0C447C;--o3:#FAEEDA;--o3t:#633806;
  --green:#C6EFCE;--greent:#375623;--amber:#FFEB9C;--ambert:#7D6608;
  --red:#FFC7CE;--redt:#9C0006;--redbg:#FFF5F5;
  --s1:#F8F9FA;--s2:#F0F2F5;--bd:#E0E0E0;--bds:#CCCCCC;
  --r:8px;--r2:12px;--accent:#1a73e8;
  font-family:Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f2f5;min-height:100vh;font-size:14px;color:var(--tp);}
#app{max-width:520px;margin:0 auto;padding:0 0 80px;}
/* Header */
.hdr{background:var(--hdr);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;}
.hdr-title{font-size:15px;font-weight:700;}
.hdr-sub{font-size:11px;opacity:.75;margin-top:2px;}
.hdr-btns{display:flex;gap:8px;}
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.icon-btn:hover{background:rgba(255,255,255,.25);}
/* Status bar */
.sb{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--bd);font-size:12px;}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* Tab bar */
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid var(--bd);gap:0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tb{flex-shrink:0;padding:10px 14px;font-size:12px;font-weight:500;color:var(--tm);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tb.on{color:var(--hdr);border-bottom-color:var(--hdr);font-weight:700;}
/* Cards */
.card{background:#fff;border-radius:var(--r2);margin:12px 12px 0;padding:14px;border:.5px solid var(--bd);}
.card-title{font-size:13px;font-weight:600;color:var(--tp);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
/* Form elements */
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:13px;color:var(--tp);background:#fff;font-family:Arial,sans-serif;transition:border .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;}
input.err,select.err,textarea.err{border-color:var(--redt);background:#FFF5F5;}
textarea{resize:vertical;min-height:72px;}
label{font-size:12px;font-weight:500;color:var(--ts);display:block;margin-bottom:4px;}
label .req{color:var(--redt);margin-left:2px;}
.field{margin-bottom:12px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.hint{font-size:11px;color:var(--tm);margin-top:3px;}
.err-msg{font-size:11px;color:var(--redt);margin-top:3px;display:flex;align-items:center;gap:3px;}
/* Buttons */
button{padding:8px 16px;border-radius:var(--r);border:1.5px solid var(--bds);cursor:pointer;font-size:13px;font-weight:500;font-family:Arial,sans-serif;transition:.15s;}
.btn-primary{background:var(--accent);color:#fff;border-color:#1558b0;}
.btn-primary:hover{background:#1558b0;}
.btn-success{background:#085041;color:#fff;border-color:#085041;}
.btn-danger{background:var(--redt);color:#fff;border-color:#800000;}
.btn-ghost{background:none;color:var(--ts);border-color:var(--bd);}
.btn-sm{padding:5px 11px;font-size:12px;}
/* Activity pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
/* Activity type tags */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
/* KR summary rows */
.kr-row{display:flex;align-items:center;padding:8px 0;border-bottom:.5px solid var(--bd);gap:8px;}
.kr-row:last-child{border-bottom:none;}
.kr-label{flex:1;font-size:12px;color:var(--ts);}
.kr-val{font-size:14px;font-weight:700;color:var(--tp);min-width:28px;text-align:right;}
.kr-tgt{font-size:11px;color:var(--tm);min-width:40px;text-align:right;}
.progress-bar{height:4px;background:var(--bd);border-radius:2px;margin-top:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width .3s;}
/* Activity log items */
.act-item{background:var(--s1);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;border:.5px solid var(--bd);position:relative;}
.act-item-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.act-time{font-size:11px;color:var(--tm);}
.act-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--tm);cursor:pointer;font-size:14px;padding:2px;}
.act-del:hover{color:var(--redt);}
/* Day status badges */
.day-status{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.ds-productive{background:var(--green);color:var(--greent);}
.ds-partial{background:var(--amber);color:var(--ambert);}
.ds-none{background:var(--red);color:var(--redt);}
/* Overdue indicator */
.overdue{color:var(--redt);font-weight:600;}
.overdue-badge{background:var(--red);color:var(--redt);padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;}
/* Weekly day grid */
.wk-day{background:#fff;border-radius:var(--r);border:.5px solid var(--bd);margin-bottom:8px;overflow:hidden;}
.wk-day-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--s2);cursor:pointer;}
.wk-day-body{padding:10px 12px;border-top:.5px solid var(--bd);}
/* Manager dashboard */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dash-card{background:#fff;border-radius:var(--r2);padding:14px;border:.5px solid var(--bd);}
.dash-num{font-size:28px;font-weight:700;color:var(--hdr);}
.dash-lbl{font-size:12px;color:var(--tm);}
/* Conversion funnel */
.funnel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;}
.funnel-step{background:var(--s1);border:.5px solid var(--bd);border-radius:var(--r);padding:6px 10px;text-align:center;}
.funnel-step .num{font-size:18px;font-weight:700;color:var(--hdr);}
.funnel-arrow{color:var(--tm);}
/* Section headers */
.sect-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tm);padding:10px 12px 4px;margin-top:4px;}
/* Focus badge */
.focus-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--o2);color:var(--o2t);}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;}
.modal{background:#fff;border-radius:var(--r2) var(--r2) 0 0;width:100%;max-width:520px;margin:0 auto;padding:20px 16px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
/* User setup */
.user-setup{background:#fff;border-radius:var(--r2);margin:20px 12px;padding:24px;}
/* Floating push btn */
.push-fab{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;z-index:50;}
.push-fab:disabled{opacity:.6;}
/* Utility */
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;}
.flex{display:flex;} .flex-center{display:flex;align-items:center;} .gap8{gap:8px;} .gap12{gap:12px;}
.bold{font-weight:600;} .small{font-size:12px;} .muted{color:var(--tm);}
.hidden{display:none;}
.divider{border:none;border-top:.5px solid var(--bd);margin:12px 0;}
.w100{width:100%;}
.text-red{color:var(--redt);} .text-green{color:var(--greent);} .text-amber{color:var(--ambert);}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwhsxmi0drQCntbqjjveKG4RwK9UrVveSRAH6iZQ0J4RFFE5y1QW2aUlyI1AIbpNty-5w/exec";
const SRC_ID = "13D91QS2g-DZCbNxqlXcQhAZHTamALw3eAOfEj1LdL0k";
const WIP_ID = "1tFinzQotgIErtpCq2LKNybvInw5b3LtTQ2hkC0QKHxY";
const PFX = "baa2_";

const COORDS = ["Wayne Mallia","James Fox","Johnson Morgan"];
const STATES = {"Wayne Mallia":"VIC","James Fox":"NSW","Johnson Morgan":"QLD"};
const MANAGER_CODE = "manager2026";

const PRIMARY_FOCUS = [
  "Employer call campaign","Employer site visits","Pipeline conversion",
  "New employer acquisition","Existing employer engagement","ACAP engagement",
  "Employer meetings","Events","Sign-ups and registrations",
  "Administration and follow-up","Other"
];

const CALL_OUTCOMES = [
  "Connected – meaningful conversation","Connected – no current opportunity",
  "No answer","Voicemail left","Follow-up message sent",
  "Callback requested","Incorrect details","Not interested",
  "Do not contact — removed from list","Other"
];

const ACTIVITY_OUTCOMES = [
  "No opportunity identified","Follow-up required","Apprentice vacancy identified",
  "Student lead identified","Employer meeting booked","Candidate referred to employer",
  "Sign-up booked","Sign-up completed","Registration submitted",
  "Registration completed","Future opportunity","Not suitable/closed","Other"
];

const REL_TYPES = [
  "Existing active employer","Existing inactive employer","Previous employer",
  "New prospect","New employer acquired"
];

const PIPELINE_STAGES = [
  "New lead","Initial contact attempted","Contact established",
  "Eligibility being confirmed","Employer required","Employer identified",
  "Awaiting documents","Sign-up booked","Sign-up completed",
  "Enrolment processing","Registration submitted","Registered","On hold","Closed/lost"
];

const ACT_OUTCOME_NEEDS_FOLLOWUP = [
  "Follow-up required","Apprentice vacancy identified","Student lead identified",
  "Employer meeting booked","Candidate referred to employer","Sign-up booked","Future opportunity"
];

// Productive day thresholds per primary focus
const PRODUCTIVITY_THRESHOLDS = {
  "Employer call campaign":         {minActivities:5, types:["employer_call"]},
  "Employer site visits":           {minActivities:2, types:["site_visit"]},
  "Pipeline conversion":            {minActivities:3, types:["pipeline"]},
  "New employer acquisition":       {minActivities:3, types:["employer_call","site_visit","new_employer"]},
  "Existing employer engagement":   {minActivities:3, types:["employer_call","site_visit"]},
  "ACAP engagement":                {minActivities:3, types:["acap_contact","acap_f2f"]},
  "Employer meetings":              {minActivities:2, types:["site_visit","new_employer"]},
  "Events":                         {minActivities:1, types:["event"]},
  "Sign-ups and registrations":     {minActivities:2, types:["commencement","enrolment","registration"]},
  "Administration and follow-up":   {minActivities:1, types:[]},
  "Other":                          {minActivities:1, types:[]},
};

const WEEKLY_TARGETS = {
  commencement:{VIC:6,NSW:6,QLD:2},
  registration:{VIC:6,NSW:6,QLD:6},
  enrolment:{VIC:0,NSW:0,QLD:0},
  intro_call:{VIC:0,NSW:0,QLD:0},
  acap_contact:{VIC:15,NSW:15,QLD:15},
  acap_f2f:{VIC:2,NSW:2,QLD:2},
  event:{VIC:1,NSW:1,QLD:1},
  site_visit:{VIC:4,NSW:4,QLD:4},
  employer_call:{VIC:15,NSW:15,QLD:15},
  new_employer_met:{VIC:8,NSW:8,QLD:8},
  new_employer_db:{VIC:8,NSW:8,QLD:8},
  lead_generated:{VIC:8,NSW:8,QLD:8},
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const TODAY = new Date().toISOString().substring(0,10);
let S = {
  user: lsGet("user") || null,   // {coord, isManager}
  date: TODAY,
  tab: "today",
  modal: null,
  syncing: false,
  loading: false,      // fetching from cloud
  unsyncedChanges: false,
  lastSynced: null,    // ISO timestamp of last successful push
  status: {ok:true, msg:"Ready"},
  editAct: null,
  wkExpanded: {},
  dashFilter: {coord:"all",dateFrom:"",dateTo:""},
  dashView: "weekly",
  trendFrom: "",  // trend date range start
  trendTo:   "",  // trend date range end
};

// ═══════════════════════════════════════════════════════════
// STORAGE HELPERS
// ═══════════════════════════════════════════════════════════
function lsKey(k){ return PFX+k; }
function lsGet(k){ try{const v=localStorage.getItem(lsKey(k));return v?JSON.parse(v):null;}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(lsKey(k),JSON.stringify(v));}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(lsKey(k));}catch(e){} }

function dayKey(coord,date){ return `day:${coord}:${date}`; }
function loadDay(coord,date){
  return lsGet(dayKey(coord,date)) || {
    coord,date,focus:"",focusOther:"",
    eodResult:"",eodTomorrow:"",eodAllEntered:"",eodStatus:"draft",
    activities:[]
  };
}
function saveDay(day){ lsSet(dayKey(day.coord,day.date),day); }
function getDay(){ return loadDay(S.user.coord, S.date); }

// ── Pending deletions tracker ──────────────────────────────────────────────
// Deletions must be sent to the server explicitly (as an id list), rather
// than relying on the deleted item's absence from the push payload — the
// server no longer treats "not in payload" as "delete it" (see multi-device
// sync fix), since that would let one device's stale local cache silently
// wipe out another device's entries that it simply hadn't pulled yet.
function pendingDeletesKey(coord){ return "pendingDeletes:"+coord; }
function getPendingDeletes(coord){ return lsGet(pendingDeletesKey(coord)) || []; }
function addPendingDelete(coord, id){
  const list = getPendingDeletes(coord);
  if(!list.includes(id)) list.push(id);
  lsSet(pendingDeletesKey(coord), list);
}
function clearPendingDeletes(coord, ids){
  const remaining = getPendingDeletes(coord).filter(id=>!ids.includes(id));
  lsSet(pendingDeletesKey(coord), remaining);
}

// ── Employer database cache ───────────────────────────────────────────────
function empCacheKey(coord){ return PFX+"employers:"+coord; }

function getEmployerCache(coord){
  try{ const c=localStorage.getItem(empCacheKey(coord)); return c?JSON.parse(c):[]; }
  catch(e){ return []; }
}

function setEmployerCache(coord, employers){
  try{ localStorage.setItem(empCacheKey(coord), JSON.stringify(employers)); }
  catch(e){}
}

// Find employer in cache by business name (partial match)
function findEmployer(coord, bizName) {
  if (!bizName) return null;
  const biz = bizName.trim().toLowerCase();
  return getEmployerCache(coord).find(function(e) {
    const n = (e.bizName||"").trim().toLowerCase();
    return n===biz || n.indexOf(biz)!==-1 || biz.indexOf(n)!==-1;
  })||null;
}

function uuid(){ return Date.now().toString(36)+Math.random().toString(36).substring(2,7); }

// All days for coord (returns sorted array of dates)
function allDays(coord){
  const keys=[], prefix=PFX+"day:"+coord+":";
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith(prefix)) keys.push(k.replace(prefix,"").replace(PFX,""));
  }
  // The key stored is PFX+dayKey, so parse correctly
  const dates=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith(PFX+"day:"+coord+":")){
      dates.push(k.replace(PFX+"day:"+coord+":",""));
    }
  }
  return dates.sort();
}

// ═══════════════════════════════════════════════════════════
// DATE HELPERS
// ═══════════════════════════════════════════════════════════
function mondayOf(ds){
  const d=new Date(ds+"T12:00:00"), day=d.getDay(), mon=new Date(d);
  mon.setDate(d.getDate()-(day===0?6:day-1));
  return mon.toISOString().substring(0,10);
}
function paceTarget(weeklyTarget, dateInWeek) {
  // How many days into the week are we (including today)?
  const days = weekDaysMF(dateInWeek||S.date);
  const todayStr = S.date||TODAY;
  let daysElapsed = 0;
  for (let i=0; i<days.length; i++) {
    if (days[i] <= todayStr) daysElapsed = i+1;
  }
  return weeklyTarget * daysElapsed / 5;
}

function weekDaysMF(ds){ // Mon-Fri only
  const mon=mondayOf(ds);
  return Array.from({length:5},(_,i)=>{
    const d=new Date(mon+"T12:00:00"); d.setDate(d.getDate()+i);
    return d.toISOString().substring(0,10);
  });
}
function fmtDate(ds){
  const d=new Date(ds+"T12:00:00");
  return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
}
function fmtDateShort(ds){
  const d=new Date(ds+"T12:00:00");
  return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});
}
function addWeeks(ds, n) {
  const d = new Date((ds||TODAY)+"T12:00:00");
  d.setDate(d.getDate() + n*7);
  return d.toISOString().substring(0,10);
}

function fmtWkRange(ds){
  const days=weekDaysMF(ds);
  return fmtDateShort(days[0])+" – "+fmtDateShort(days[4]);
}
const TRACKER_START = "2026-07-27"; // Team starts using tracker from this date

function isOverdue(dateStr){
  // Not overdue if before tracker start date — clears all pre-existing tasks
  if (!dateStr || dateStr < TRACKER_START) return false;
  return dateStr < TODAY;
}
function dayOfWeek(ds){
  const d=new Date(ds+"T12:00:00");
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
}

// ═══════════════════════════════════════════════════════════
// ACTIVITY ANALYSIS
// ═══════════════════════════════════════════════════════════
function isMeaningfulCall(act){
  return act.type==="employer_call" && act.callOutcome && act.callOutcome.startsWith("Connected – meaningful");
}
function activityLabel(type){
  const labels={
    commencement:"Commencement",registration:"Registration",enrolment:"Enrolment",
    intro_call:"Intro Call",acap_contact:"ACAP Contact",acap_f2f:"ACAP F2F Visit",
    event:"Event",employer_call:"Employer Call",site_visit:"Site Visit",
    new_employer_met:"Employer Met",new_employer_db:"Add Employer",add_employer:"Add Employer",
    pipeline:"Pipeline",lead:"Student Lead",enrolment_pipeline:"Enrolment Pipeline Follow-up",add_acap:"Add ACAP",follow_up_closed:"Follow-up Closed",
  };
  return labels[type]||type;
}
function activityColor(type){
  if(["commencement","registration","enrolment","intro_call"].includes(type)) return {bg:S1="#E1F5EE",txt:"#085041"};
  if(["acap_contact","acap_f2f","event","add_acap"].includes(type)) return {bg:"#E6F1FB",txt:"#0C447C"};
  return {bg:"#FAEEDA",txt:"#633806"};
}

function dayStatus(day){
  if(!day.focus) return "none";
  const acts=day.activities||[];
  const thresh=PRODUCTIVITY_THRESHOLDS[day.focus]||{minActivities:1,types:[]};
  const relevant=thresh.types.length===0?acts:acts.filter(a=>thresh.types.includes(a.type));
  const count=relevant.length;
  if(count>=thresh.minActivities && day.eodStatus==="complete") return "productive";
  if(count>0||day.eodStatus==="complete") return "partial";
  return "none";
}

function getDayStatusLabel(status){
  if(status==="productive") return '<span class="day-status ds-productive">✓ Productive day</span>';
  if(status==="partial")    return '<span class="day-status ds-partial">◐ Partial activity</span>';
  return '<span class="day-status ds-none">○ No meaningful activity</span>';
}

// Weekly KR totals for a coord over Mon-Fri
function weeklyTotals(coord,ds){
  const days=weekDaysMF(ds);
  const T={
    commencement:0,registration:0,enrolment:0,
    intro_call_due:0,intro_call_done:0,intro_call_overdue:0,
    acap_contact_attempted:0,acap_contact_meaningful:0,
    acap_f2f:0,event:0,
    call_attempted:0,call_connected:0,call_meaningful:0,
    followup_booked:0,
    site_locations:new Set(),site_employers:0,site_contacts:0,site_opps:0,
    new_employer_met:0,new_employer_acq:0,new_employer_db:0,
    lead:0,opp_generated:0,
    pipeline_contacted:0,pipeline_progressed:0,
    signup_booked:0,signup_done:0,reg_submitted:0,reg_done:0,
    followup_open:0,followup_overdue:0,
    days_complete:0,days_productive:0,days_partial:0,days_none:0,
  };
  days.forEach(d=>{
    const day=loadDay(coord,d);
    const st=dayStatus(day);
    if(st==="productive") T.days_productive++;
    else if(st==="partial") T.days_partial++;
    else T.days_none++;
    if(day.eodStatus==="complete") T.days_complete++;
    const realActs=(day.activities||[]).filter(a=>
      !a.id||(a.id&&!a.id.startsWith("auto_fu_")&&!a.id.startsWith("auto_acap_")&&!a.id.startsWith("sl_"))
    );
    realActs.forEach(a=>{
      if(a.type==="commencement") T.commencement++;
      if(a.type==="registration") T.registration++;
      if(a.type==="enrolment") T.enrolment++;
      if(a.type==="intro_call"){
        T.intro_call_due++;
        if(a.within24h==="Yes") T.intro_call_done++;
        if(a.within24h==="No" && isOverdue(d)) T.intro_call_overdue++;
      }
      if(a.type==="acap_contact"||a.type==="acap_f2f"){
        T.acap_contact_attempted++;
        if(a.activityOutcome && !["No opportunity identified"].includes(a.activityOutcome)) T.acap_contact_meaningful++;
      }
      if(a.type==="acap_f2f") T.acap_f2f++;
      if(a.type==="event") T.event++;
      if(a.type==="employer_call"){
        T.call_attempted++;
        if(a.callOutcome&&a.callOutcome.startsWith("Connected")) T.call_connected++;
        if(isMeaningfulCall(a)) T.call_meaningful++;
        if(a.followUpDate) T.followup_booked++;
      }
      if(a.type==="site_visit"){
        if(a.suburb) T.site_locations.add(a.suburb);
        T.site_employers++;
        if(a.contactName) T.site_contacts++;
        if(a.activityOutcome&&["Apprentice vacancy identified","Student lead identified","Sign-up booked"].includes(a.activityOutcome)) T.site_opps++;
      }
      if(a.type==="new_employer_met") T.new_employer_met++;
      if(a.type==="new_employer_db") T.new_employer_db++;
      if(a.relType==="New employer acquired") T.new_employer_acq++;
      if(a.type==="lead") T.lead++;
      if(a.activityOutcome&&["Apprentice vacancy identified","Student lead identified","Employer meeting booked","Sign-up booked"].includes(a.activityOutcome)) T.opp_generated++;
      if(a.type==="pipeline"){
        T.pipeline_contacted++;
        if(a.newStage&&a.prevStage&&a.newStage!==a.prevStage) T.pipeline_progressed++;
        if(a.newStage==="Sign-up booked") T.signup_booked++;
        if(a.newStage==="Sign-up completed") T.signup_done++;
        if(a.newStage==="Registration submitted") T.reg_submitted++;
        if(a.newStage==="Registered") T.reg_done++;
      }
      if(a.followUpDate){
        T.followup_open++;
        if(isOverdue(a.followUpDate)) T.followup_overdue++;
      }
    });
  });
  T.site_locations=T.site_locations.size;
  return T;
}

// ═══════════════════════════════════════════════════════════
// VALIDATION
// ═══════════════════════════════════════════════════════════
function validate(fields){
  // fields = [{id, label, required, type, value}]
  const errors={};
  fields.forEach(f=>{
    if(f.required && (!f.value||String(f.value).trim()==="")){
      errors[f.id]=f.label+" is required";
    }
    if(f.type==="email" && f.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.value)){
      errors[f.id]="Enter a valid email address";
    }
    if(f.type==="phone" && f.value && !/^[\d\s\+\-\(\)]{8,}$/.test(f.value)){
      errors[f.id]="Enter a valid phone number";
    }
    if(f.type==="date" && f.value && !/^\d{4}-\d{2}-\d{2}$/.test(f.value)){
      errors[f.id]="Enter a valid date (YYYY-MM-DD)";
    }
  });
  return errors;
}

function downloadDailyExcel() {
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];
  const date = S.date;

  const loadExcelJS = function(cb) {
    if (window.ExcelJS) { cb(); return; }
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js";
    s.onload = cb;
    s.onerror = function(){ alert("Could not load ExcelJS library"); };
    document.head.appendChild(s);
  };

  loadExcelJS(function() {
    const wb = new ExcelJS.Workbook();
    wb.creator = "CRBGC Activity Tracker";
    wb.created = new Date();

    const HDR  = {type:"pattern",pattern:"solid",fgColor:{argb:"FF1C3C6B"}};
    const HDR2 = {type:"pattern",pattern:"solid",fgColor:{argb:"FF2C5F9E"}};
    const GRN  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFC6EFCE"}};
    const AMB  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFFEB9C"}};
    const RED  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFFC7CE"}};
    const O1   = {type:"pattern",pattern:"solid",fgColor:{argb:"FFE1F5EE"}};
    const O2   = {type:"pattern",pattern:"solid",fgColor:{argb:"FFE6F1FB"}};
    const O3   = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFAEEDA"}};
    const WHT  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
    const ALT  = {type:"pattern",pattern:"solid",fgColor:{argb:"FFF8F9FA"}};

    function hdrCell(ws, r, c, v, bg) {
      const cell = ws.getCell(r, c);
      cell.value = v; cell.fill = bg||HDR;
      cell.font = {bold:true, color:{argb:"FFFFFFFF"}};
      cell.alignment = {horizontal:"center", vertical:"middle"};
      return cell;
    }
    function dataCell(ws, r, c, v, bold, fill, fontColor, align) {
      const cell = ws.getCell(r, c);
      cell.value = v; if(fill) cell.fill = fill;
      cell.font = {bold:!!bold, color:{argb:fontColor||"FF1a1a1a"}};
      cell.alignment = {horizontal:align||"left", vertical:"middle"};
      cell.border = {bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};
      return cell;
    }

    function paceRAG(val, tgt) {
      if (tgt===0) return {fill:null, font:"FF1a1a1a"};
      const pct = val/tgt;
      if (pct>=1)    return {fill:GRN, font:"FF375623"};
      if (pct>=0.7)  return {fill:AMB, font:"FF7D6608"};
      if (val>0)     return {fill:RED, font:"FF9C0006"};
      return {fill:null, font:"FFaaaaaa"};
    }

    coordsToShow.forEach(function(coord) {
      const state = STATES[coord];
      const day = loadDay(coord, date);
      const acts = day.activities||[];
      const status = dayStatus(day);
      const tgt = WEEKLY_TARGETS;
      const s = state;
      const statusLabel = status==="productive"?"✅ Productive day":status==="partial"?"◐ Partial activity":"○ No meaningful activity";

      const ws = wb.addWorksheet(coord.split(" ")[0]+" "+state);
      ws.getColumn(1).width = 28;
      ws.getColumn(2).width = 12;
      ws.getColumn(3).width = 16;
      ws.getColumn(4).width = 16;

      let r = 1;

      // Title
      ws.mergeCells(r,1,r,4);
      const tRow = ws.getCell(r,1);
      tRow.value = coord+" — "+state+" · "+fmtDate(date);
      tRow.fill = HDR; tRow.font = {bold:true,size:13,color:{argb:"FFFFFFFF"}};
      tRow.alignment = {horizontal:"left",vertical:"middle"};
      ws.getRow(r).height = 22; r++;

      // Status + focus
      ws.mergeCells(r,1,r,4);
      const sRow = ws.getCell(r,1);
      sRow.value = statusLabel+" · Focus: "+(day.focus||"Not set");
      sRow.fill = status==="productive"?GRN:status==="partial"?AMB:RED;
      sRow.font = {bold:true, color:{argb:status==="productive"?"FF375623":status==="partial"?"FF7D6608":"FF9C0006"}};
      sRow.alignment = {horizontal:"left",vertical:"middle"};
      ws.getRow(r).height = 18; r++;
      r++; // blank

      // Activity metrics header
      hdrCell(ws,r,1,"Metric"); hdrCell(ws,r,2,"Count"); hdrCell(ws,r,3,"Pace Target"); hdrCell(ws,r,4,"Status");
      ws.getRow(r).height = 16; r++;

      const metrics = [
        {label:"Commencements",         val:acts.filter(function(a){return a.type==="commencement";}).length,       tgt:Math.round(paceTarget(tgt.commencement[s])),  obj:"o1"},
        {label:"Registrations",          val:acts.filter(function(a){return a.type==="registration";}).length,       tgt:Math.round(paceTarget(tgt.registration[s])),  obj:"o1"},
        {label:"ACAP contacts",          val:acts.filter(function(a){return a.type==="acap_contact"||a.type==="acap_f2f";}).length, tgt:Math.round(paceTarget(tgt.acap_contact[s])), obj:"o2"},
        {label:"ACAP F2F visits",        val:acts.filter(function(a){return a.type==="acap_f2f";}).length,            tgt:Math.round(paceTarget(tgt.acap_f2f[s])),      obj:"o2"},
        {label:"Events",                 val:acts.filter(function(a){return a.type==="event";}).length,               tgt:Math.round(paceTarget(tgt.event[s])),          obj:"o2"},
        {label:"Employer calls",         val:acts.filter(function(a){return a.type==="employer_call";}).length,       tgt:Math.round(paceTarget(tgt.employer_call[s])), obj:"o3"},
        {label:"Meaningful conversations",val:acts.filter(isMeaningfulCall).length,                                   tgt:0,                                             obj:"o3"},
        {label:"Site visits",            val:acts.filter(function(a){return a.type==="site_visit";}).length,          tgt:Math.round(paceTarget(tgt.site_visit[s])),    obj:"o3"},
        {label:"New employers met",      val:acts.filter(function(a){return a.type==="new_employer_met";}).length,    tgt:Math.round(paceTarget(tgt.new_employer_met[s])),obj:"o3"},
        {label:"Student leads",          val:acts.filter(function(a){return a.type==="lead";}).length,                tgt:Math.round(paceTarget(tgt.lead_generated[s])),obj:"o3"},
        {label:"Pipeline contacted",     val:acts.filter(function(a){return a.type==="pipeline";}).length,            tgt:0,                                             obj:"o3"},
        {label:"Pipeline progressed",    val:acts.filter(function(a){return a.type==="pipeline"&&a.newStage&&a.prevStage&&a.newStage!==a.prevStage;}).length,tgt:0,    obj:"o3"},
        {label:"Follow-ups closed",      val:acts.filter(function(a){return a.type==="follow_up_closed";}).length,   tgt:0,                                             obj:"o3"},
        {label:"Opportunities generated",val:acts.filter(function(a){return ["Apprentice vacancy identified","Student lead identified","Employer meeting booked","Sign-up booked"].includes(a.activityOutcome);}).length,tgt:0,obj:"o3"},
      ];

      metrics.forEach(function(m, mi) {
        const rag = paceRAG(m.val, m.tgt);
        const objFill = m.obj==="o1"?O1:m.obj==="o2"?O2:O3;
        const rowFill = mi%2===0?ALT:WHT;
        dataCell(ws,r,1,m.label,true,objFill, m.obj==="o1"?"FF085041":m.obj==="o2"?"FF0C447C":"FF633806");
        dataCell(ws,r,2,m.val,true, m.tgt>0?rag.fill:rowFill, m.tgt>0?rag.font:"FF1a1a1a","center");
        dataCell(ws,r,3,m.tgt>0?m.tgt:"—",false,rowFill,"FFaaaaaa","center");
        const statusTxt = m.tgt===0?"—":m.val>=m.tgt?"✅ On pace":m.val>=m.tgt*0.7?"⚠ Amber":"🔴 Behind";
        const statusFont = m.tgt===0?"FFaaaaaa":m.val>=m.tgt?"FF375623":m.val>=m.tgt*0.7?"FF7D6608":"FF9C0006";
        dataCell(ws,r,4,statusTxt,true,m.tgt>0?rag.fill:rowFill,statusFont,"center");
        ws.getRow(r).height = 15; r++;
      });

      r++; // blank

      // EOD section
      ws.mergeCells(r,1,r,4);
      const eodHdr = ws.getCell(r,1);
      eodHdr.value = "End of Day Review";
      eodHdr.fill = HDR2; eodHdr.font = {bold:true,color:{argb:"FFFFFFFF"}};
      eodHdr.alignment = {horizontal:"left",vertical:"middle"};
      ws.getRow(r).height = 16; r++;

      const eodRows = [
        ["EOD Result",     day.eodResult||"Not completed"],
        ["Tomorrow",       day.eodTomorrow||"—"],
        ["All entered?",   day.eodAllEntered||"—"],
        ["Status",         day.eodStatus==="complete"?"✅ Day complete":"◐ Draft"],
      ];
      eodRows.forEach(function(er) {
        dataCell(ws,r,1,er[0],true,ALT,"FF1C3C6B");
        ws.mergeCells(r,2,r,4);
        dataCell(ws,r,2,er[1],false,WHT,"FF1a1a1a","left");
        ws.getRow(r).height = 15; r++;
      });

      r++; // blank

      // Activity log
      ws.mergeCells(r,1,r,4);
      const actHdr = ws.getCell(r,1);
      actHdr.value = "Activity Log ("+acts.length+" entries)";
      actHdr.fill = HDR2; actHdr.font = {bold:true,color:{argb:"FFFFFFFF"}};
      ws.getRow(r).height = 16; r++;

      // Activity log headers
      ["Type","Name / Contact","Outcome","Next Action / Follow-up"].forEach(function(h,c){
        hdrCell(ws,r,c+1,h,HDR);
      });
      ws.getRow(r).height = 15; r++;

      acts.forEach(function(a, ai) {
        const fill = ai%2===0?ALT:WHT;
        dataCell(ws,r,1,activityLabel(a.type),false,fill,"FF1a1a1a","center");
        dataCell(ws,r,2,a.bizName||a.acapOrg||a.leadName||a.studentName||a.eventName||"",false,fill);
        dataCell(ws,r,3,a.activityOutcome||a.callOutcome||"",false,fill);
        dataCell(ws,r,4,(a.nextAction||"")+(a.followUpDate?" · "+fmtDateShort(a.followUpDate):""),false,fill);
        ws.getRow(r).height = 15; r++;
      });
    });

    wb.xlsx.writeBuffer().then(function(buffer) {
      const blob = new Blob([buffer],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href=url; a.download="CRBGC_Daily_"+date+".xlsx";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    });
  });
}

function downloadTrendExcel() {
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];
  const tF = mondayOf(S.trendFrom || addWeeks(S.date,-7));
  const tT = mondayOf(S.trendTo   || S.date);
  const weeks = [];
  let cW = new Date(tT+"T12:00:00");
  const fW = new Date(tF+"T12:00:00");
  while (cW >= fW && weeks.length < 52) {
    weeks.push(cW.toISOString().substring(0,10));
    cW.setDate(cW.getDate()-7);
  }
  const weekLabels = weeks.map(function(mon){ return fmtDateShort(mon); });

  const TREND_METRICS = [
    {label:"Commencements",           fn:function(T){return T.commencement;},         key:"commencement"},
    {label:"Registrations",           fn:function(T){return T.registration;},         key:"registration"},
    {label:"Calls attempted",         fn:function(T){return T.call_attempted;},       key:"call_attempted"},
    {label:"Meaningful conversations",fn:function(T){return T.call_meaningful;}},
    {label:"Site visits",             fn:function(T){return T.site_employers;},       key:"site_employers"},
    {label:"ACAP contacts",           fn:function(T){return T.acap_contact_attempted;},key:"acap_contact"},
    {label:"Opportunities",           fn:function(T){return T.opp_generated;}},
    {label:"Pipeline progressed",     fn:function(T){return T.pipeline_progressed;}},
    {label:"New employers met",       fn:function(T){return T.new_employer_met;},     key:"new_employer_met"},
    {label:"Student leads",           fn:function(T){return T.lead;},                key:"lead"},
    {label:"Overdue follow-ups",      fn:function(T){return T.followup_overdue;},    warn:true},
    {label:"Productive days",         fn:function(T){return T.days_productive;}},
  ];

  const data = {};
  coordsToShow.forEach(function(coord) {
    data[coord] = {};
    weeks.forEach(function(mon){ data[coord][mon] = weeklyTotals(coord, mon); });
  });

  function getWeeklyTgt(metricKey, warn, state) {
    if (warn || !metricKey) return 0;
    const t = WEEKLY_TARGETS;
    return metricKey==="commencement"?t.commencement[state]:
           metricKey==="registration"?t.registration[state]:
           metricKey==="call_attempted"?t.employer_call[state]:
           metricKey==="site_employers"?t.site_visit[state]:
           metricKey==="acap_contact"?t.acap_contact[state]:
           metricKey==="new_employer_met"?t.new_employer_met[state]:
           metricKey==="lead"?t.lead_generated[state]:0;
  }

  function ragFill(v, tgt, warn) {
    if (warn) {
      if (v===0) return {argb:"FFC6EFCE"};
      if (v<=2)  return {argb:"FFFFFFEB9C"};
      return          {argb:"FFFFC7CE"};
    }
    if (tgt>0) {
      const pct = v/tgt;
      if (pct>=1)   return {argb:"FFC6EFCE"};
      if (pct>=0.7) return {argb:"FFFFFFEB9C"};
      if (v>0)      return {argb:"FFFFC7CE"};
    }
    return null;
  }

  function ragFont(v, tgt, warn) {
    if (warn) {
      if (v===0) return "375623";
      if (v<=2)  return "7D6608";
      return          "9C0006";
    }
    if (tgt>0) {
      const pct = v/tgt;
      if (pct>=1)   return "375623";
      if (pct>=0.7) return "7D6608";
      if (v>0)      return "9C0006";
    }
    return "1a1a1a";
  }

  // Load ExcelJS
  const loadExcelJS = function(cb) {
    if (window.ExcelJS) { cb(); return; }
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js";
    s.onload = cb;
    s.onerror = function(){ alert("Could not load ExcelJS library — check your internet connection"); };
    document.head.appendChild(s);
  };

  loadExcelJS(function() {
    const wb = new ExcelJS.Workbook();
    wb.creator = "CRBGC Activity Tracker";
    wb.created = new Date();

    function buildSheet(sheetName, coordList) {
      const ws = wb.addWorksheet(sheetName);
      const totalCols = 2 + weeks.length;

      // Column widths
      ws.getColumn(1).width = 28;
      ws.getColumn(2).width = 14;
      for (let i=0; i<weeks.length; i++) ws.getColumn(3+i).width = 11;

      // Title row
      const titleRow = ws.addRow([sheetName]);
      ws.mergeCells(titleRow.number, 1, titleRow.number, totalCols);
      titleRow.getCell(1).fill   = {type:"pattern",pattern:"solid",fgColor:{argb:"FF1C3C6B"}};
      titleRow.getCell(1).font  = {bold:true,size:13,color:{argb:"FFFFFFFF"}};
      titleRow.getCell(1).alignment = {horizontal:"left",vertical:"middle"};
      titleRow.height = 22;

      // Blank row
      ws.addRow([]);

      // Header row
      const hdrs = ["Metric","Trend"].concat(weekLabels);
      const hdrRow = ws.addRow(hdrs);
      hdrRow.height = 18;
      hdrRow.eachCell(function(cell, colNum) {
        const isLatest = colNum === 3;
        cell.fill = {type:"pattern",pattern:"solid",fgColor:{argb: isLatest?"FF1C3C6B":"FF2C5F9E"}};
        cell.font = {bold:true,color:{argb:"FFFFFFFF"}};
        cell.alignment = {horizontal:"center",vertical:"middle"};
        cell.border = {bottom:{style:"thin",color:{argb:"FFFFFFFF"}}};
      });
      hdrRow.getCell(1).alignment = {horizontal:"left"};

      // Data rows
      TREND_METRICS.forEach(function(metric, mi) {
        const rowBgHex = mi%2===0?"FFF8F9FA":"FFFFFFFF";

        // Calculate combined vals across coordList
        const vals = weeks.map(function(mon) {
          return coordList.reduce(function(sum,coord){ return sum+metric.fn(data[coord][mon]); },0);
        });

        // Combined weekly target
        const combinedTgt = coordList.reduce(function(sum,coord){
          return sum + getWeeklyTgt(metric.key, metric.warn, STATES[coord]);
        },0);

        const latest = vals[0]||0, prev = vals[1]||0;
        const diff = latest - prev;
        const trendTxt = diff>0?"↑ +"+diff : diff<0?"↓ "+diff : "→";
        const trendCol = metric.warn
          ? (diff>0?"FF9C0006":diff<0?"FF375623":"FF888888")
          : (diff>0?"FF375623":diff<0?"FF9C0006":"FF888888");

        const rowData = [metric.label, trendTxt].concat(vals);
        const row = ws.addRow(rowData);
        row.height = 16;

        // Metric label cell
        row.getCell(1).font = {bold:true, color:{argb: metric.warn?"FF9C0006":"FF1a1a1a"}};
        row.getCell(1).fill = {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
        row.getCell(1).alignment = {horizontal:"left",vertical:"middle"};

        // Trend cell
        row.getCell(2).font = {bold:true, color:{argb:trendCol}};
        row.getCell(2).fill = {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
        row.getCell(2).alignment = {horizontal:"center",vertical:"middle"};

        // Value cells
        vals.forEach(function(v, vi) {
          const cell = row.getCell(3+vi);
          const isLatest = vi===0;
          cell.value = v;
          cell.alignment = {horizontal:"center",vertical:"middle"};

          if (isLatest) {
            const fill = ragFill(v, combinedTgt, metric.warn);
            cell.fill = fill
              ? {type:"pattern",pattern:"solid",fgColor:fill}
              : {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
            cell.font = {bold:true, color:{argb:"FF"+ragFont(v, combinedTgt, metric.warn)}};
          } else {
            cell.fill = {type:"pattern",pattern:"solid",fgColor:{argb:rowBgHex}};
            cell.font = {color:{argb: v===0?"FFAAAAAA":"FF555555"}};
          }
          cell.border = {bottom:{style:"hair",color:{argb:"FFE0E0E0"}}};
        });
      });
    }

    // Per-coordinator sheets
    coordsToShow.forEach(function(coord) {
      buildSheet(coord.split(" ")[0]+" "+STATES[coord], [coord]);
    });

    // Team combined sheet
    if (S.dashFilter.coord === "all") {
      buildSheet("Team Combined", coordsToShow);
    }

    // Write and download
    wb.xlsx.writeBuffer().then(function(buffer) {
      const blob = new Blob([buffer], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url;
      a.download = "CRBGC_Trend_"+S.date+".xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  });
}

    <button onclick="scrollTabs(1)" style="position:absolute;right:0;top:0;height:32px;width:24px;background:linear-gradient(to left,#fff,transparent);border:none;cursor:pointer;font-size:16px;color:var(--hdr);z-index:5;display:flex;align-items:center;justify-content:center;padding:0">›</button>`;

  // Tab content
  if(S.tab==="today")      h+=renderToday(coord,state,day);
  if(S.tab==="calls")      h+=renderCalls(coord,state,day);
  if(S.tab==="visits")     h+=renderVisits(coord,state,day);
  if(S.tab==="pipeline")   h+=renderPipeline(coord,state,day);
  if(S.tab==="notes")      h+=renderDailyNotes(coord,state,day);

  // Push FAB
  h+=`<button class="push-fab" onclick="pushData()" ${S.syncing?"disabled":""}>

  </button>`;

  return h;
}

// ── Daily pace card ───────────────────────────────────────────────────────
function renderDailyPaceCard(coord, state, T) {
  // Which day of the week is it? (1=Mon, 5=Fri)
  const d = new Date((S.date||TODAY)+"T12:00:00");
  const dow = d.getDay(); // 0=Sun, 1=Mon...5=Fri, 6=Sat
  const dayNum = dow === 0 ? 5 : dow === 6 ? 5 : dow; // clamp weekends to 5
  const tgt = WEEKLY_TARGETS;
  const s = state;

  // Metrics to pace-check (those with targets > 0)
  const paceMetrics = [
    {label:"Commencements",    actual:T.commencement,          weekly:tgt.commencement[s]},
    {label:"Registrations",    actual:T.registration,          weekly:tgt.registration[s]},
    {label:"ACAP contacts",    actual:T.acap_contact_attempted,weekly:tgt.acap_contact[s]},
    {label:"Employer calls",   actual:T.call_attempted,        weekly:tgt.employer_call[s]},
    {label:"Site visits",      actual:T.site_employers,        weekly:tgt.site_visit[s]},
    {label:"New employers met",actual:T.new_employer_met,      weekly:tgt.new_employer_met[s]},
    {label:"Student leads",    actual:T.lead,                  weekly:tgt.lead_generated[s]},
  ].filter(m=>m.weekly>0);

  // Daily pace target = weekly × dayNum/5
  let onTrack=0, behind=0, ahead=0;
  const details=[];
  paceMetrics.forEach(m=>{
    const pace = Math.round((m.weekly * dayNum / 5) * 10) / 10;
    const pct = pace > 0 ? m.actual / pace : 1;
    if (pct >= 1)      { ahead++;   details.push({...m, pace, status:"on"}); }
    else if (pct >= 0.7){ onTrack++; details.push({...m, pace, status:"amber"}); }
    else               { behind++;  details.push({...m, pace, status:"behind"}); }
  });

  const total = paceMetrics.length;
  const overallPct = total > 0 ? ahead / total : 0;
  const dayLabels = ["","Mon","Tue","Wed","Thu","Fri"];
  const dayLabel = dayLabels[dayNum]||"Today";

  // Overall status
  let statusBg, statusTxt, statusIcon, statusMsg;
  if (behind === 0 && onTrack === 0) {
    statusBg="#E1F5EE"; statusTxt="#085041"; statusIcon="✅";
    statusMsg="On track for the week";
  } else if (behind <= 1) {
    statusBg="#FFEB9C"; statusTxt="#7D6608"; statusIcon="⚠";
    statusMsg=behind+" metric"+(behind>1?"s":"")+" behind "+dayLabel+"'s pace";
  } else {
    statusBg="#FFC7CE"; statusTxt="#9C0006"; statusIcon="🔴";
    statusMsg=behind+" metrics behind "+dayLabel+"'s pace";
  }

  // Build metric rows — only show those behind or at risk
  const showDetails = details.filter(d=>d.status!=="on");

  let h=`<div class="card" style="border-left:4px solid ${behind>1?"var(--redt)":behind===1?"var(--ambert)":"var(--greent)"}">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:${showDetails.length>0?10:0}px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--tp)">${statusIcon} Daily pace — ${dayLabel}</div>
        <div style="font-size:12px;color:var(--ts);margin-top:2px">${statusMsg}</div>
      </div>
      <div style="text-align:center;background:${statusBg};padding:6px 12px;border-radius:var(--r)">
        <div style="font-size:20px;font-weight:700;color:${statusTxt}">${ahead}/${total}</div>
        <div style="font-size:10px;color:${statusTxt}">on pace</div>
      </div>
    </div>`;

  if (showDetails.length > 0) {
    h+=`<div style="border-top:.5px solid var(--bd);padding-top:8px">
      <div style="font-size:11px;font-weight:600;color:var(--tm);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Needs attention</div>`;
    showDetails.forEach(m=>{
      const paceRound = Math.ceil(m.pace);
      const needed = Math.max(0, paceRound - m.actual);
      const col = m.status==="behind"?"var(--redt)":"var(--ambert)";
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:.5px solid var(--bd)">
        <span style="flex:1;font-size:12px;color:var(--ts)">${m.label}</span>
        <span style="font-size:12px;font-weight:700;color:var(--tp)">${m.actual}</span>
        <span style="font-size:11px;color:var(--tm)">/ ${paceRound} by ${dayLabel}</span>
        <span style="font-size:11px;font-weight:600;color:${col}">${needed>0?"+"+needed+" needed":""}</span>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderActItem(a, viewCoord){
  const col=activityColor(a.type);
  const overdue=a.followUpDate&&isOverdue(a.followUpDate);
  // Manager can delete any record; coordinators can only delete their own
  const canDelete = S.user.isManager || !viewCoord || viewCoord === S.user.coord;
  const delCoord = viewCoord || S.user.coord;
  return `<div class="act-item">
    <div class="act-item-hdr">
      <span class="tag" style="background:${col.bg};color:${col.txt}">${activityLabel(a.type)}</span>
      ${a.type!=="follow_up_closed"?`<span class="act-time">${a.timestamp||""}</span>`:""}
      ${overdue?`<span class="overdue-badge">⚠ Follow-up overdue</span>`:""}
      ${canDelete?`<button class="act-edit" onclick="editActivity('${a.id}','${delCoord}')" title="Edit" style="background:none;border:none;cursor:pointer;color:var(--ts);padding:2px 4px;margin-right:2px"><i class="ti ti-pencil" style="font-size:14px"></i></button>`:""}      ${canDelete?`<button class="act-del" onclick="deleteActivity('${a.id}','${delCoord}')" title="Delete"><i class="ti ti-trash"></i></button>`:""}
    </div>
    <div style="font-size:12px;color:var(--ts)">
      ${a.bizName||a.studentName||a.leadName||a.acapOrg||a.eventName||""}
      ${a.contactName?` · ${a.contactName}`:""}
      ${a.relType?` <span style="font-size:10px;background:var(--s2);color:var(--tm);padding:1px 5px;border-radius:10px">${a.relType}</span>`:""}
      ${a.callOutcome?` · <em>${a.callOutcome}</em>`:""}
      ${a.activityOutcome?` · ${a.activityOutcome}`:""}
    </div>
    ${a.nextAction?`<div style="font-size:11px;color:var(--tm);margin-top:3px"><i class="ti ti-arrow-right"></i> ${a.nextAction}${a.followUpDate?" · "+fmtDateShort(a.followUpDate):""}</div>`:""}
  </div>`;
}

function renderCalls(coord,state,day){
  const calls=(day.activities||[]).filter(a=>a.type==="employer_call"&&(!a.id||!a.id.startsWith("auto_fu_")));
  const attempted=calls.length;
  const connected=calls.filter(a=>a.callOutcome&&a.callOutcome.startsWith("Connected")).length;
  const meaningful=calls.filter(isMeaningfulCall).length;
  const followups=calls.filter(a=>a.followUpDate).length;

  let h=`<div class="card">
    <div class="card-title"><i class="ti ti-phone"></i> Employer Calls — ${fmtDate(S.date)}</div>
    <div class="field-row" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:12px;">
      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--hdr)">${attempted}</div><div class="small muted">Attempted</div></div>
      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--greent)">${connected}</div><div class="small muted">Connected</div></div>
      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--o2t)">${meaningful}</div><div class="small muted">Meaningful</div></div>
      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--ambert)">${followups}</div><div class="small muted">Follow-ups</div></div>
    </div>
    <button class="btn-primary w100" onclick="openActivityModal('employer_call')"><i class="ti ti-plus"></i> Log Employer Call</button>
  </div>`;

  if(calls.length>0){
    h+=`<div class="sect-hdr">Call log for today</div><div style="padding:0 12px;">
    ${calls.map(a=>{
      const meaningful_icon=isMeaningfulCall(a)?'<i class="ti ti-star-filled" style="color:var(--greent);font-size:11px"></i>':'';
      return `<div class="act-item">
        <div class="act-item-hdr">
          ${meaningful_icon}<span class="bold small">${a.bizName||"—"}</span>
          <span class="muted small">${a.contactName||""}</span>
          ${a.type!=="follow_up_closed"?`<span class="act-time">${a.timestamp||""}</span>`:""}
          <button class="act-del" onclick="deleteActivity('${a.id}')"><i class="ti ti-trash"></i></button>
        </div>
        <div class="small" style="color:var(--ts)">
          <span class="tag" style="background:${a.callOutcome&&a.callOutcome.startsWith("Connected")?"var(--green)":"var(--s2)"};color:var(--greent)">${a.callOutcome||"—"}</span>
          ${a.relType?`<span style="margin-left:6px;color:var(--tm)">${a.relType}</span>`:""}
        </div>
        ${a.meaningfulDiscussion?`<div class="small muted mt8">${a.meaningfulDiscussion}</div>`:""}
        ${a.activityOutcome?`<div class="small mt8"><strong>Outcome:</strong> ${a.activityOutcome}</div>`:""}
        ${a.nextAction?`<div class="small muted mt8"><i class="ti ti-arrow-right"></i> ${a.nextAction}${a.followUpDate?" · "+fmtDateShort(a.followUpDate)+(isOverdue(a.followUpDate)?'<span class="overdue"> OVERDUE</span>':''):""}
        </div>`:""}
      </div>`;
    }).join("")}
    </div>`;
  }
  return h;
}

function renderVisits(coord,state,day){
  const visits=(day.activities||[]).filter(a=>a.type==="site_visit");

  const opps=visits.filter(a=>["Apprentice vacancy identified","Student lead identified","Sign-up booked"].includes(a.activityOutcome)).length;

  let h=`<div class="card">
    <div class="card-title"><i class="ti ti-building"></i> Site Visits — ${fmtDate(S.date)}</div>
    <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:12px;">
      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--hdr)">${locations}</div><div class="small muted">Locations</div></div>
      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--hdr)">${visits.length}</div><div class="small muted">Employers</div></div>
      <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--greent)">${opps}</div><div class="small muted">Opportunities</div></div>
    </div>
    <div class="hint" style="margin-bottom:10px">Log each employer separately even if at the same location.</div>
    <button class="btn-primary w100" onclick="openActivityModal('site_visit')"><i class="ti ti-plus"></i> Log Site Visit</button>
  </div>`;

  if(visits.length>0){
    // Group by suburb
    const bySuburb={};
    visits.forEach(v=>{ const s=v.suburb||"Unknown location"; if(!bySuburb[s])bySuburb[s]=[]; bySuburb[s].push(v); });
    h+=`<div class="sect-hdr">Today's site visits</div><div style="padding:0 12px;">`;
    Object.entries(bySuburb).forEach(([suburb,vs])=>{
      h+=`<div style="margin-bottom:4px;font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;">${suburb} · ${vs.length} employer${vs.length>1?"s":""}</div>`;
      vs.forEach(a=>{
        h+=`<div class="act-item">
          <div class="act-item-hdr">
            <span class="bold small">${a.bizName||"—"}</span>
            <span class="muted small">${a.contactName||""}</span>
            <button class="act-del" onclick="deleteActivity('${a.id}')"><i class="ti ti-trash"></i></button>
          </div>
          <div class="small" style="color:var(--ts)">${a.relType||""} ${a.activityOutcome?` · ${a.activityOutcome}`:""}</div>
          ${a.nextAction?`<div class="small muted mt8"><i class="ti ti-arrow-right"></i> ${a.nextAction}${a.followUpDate?" · "+fmtDateShort(a.followUpDate):""}</div>`:""}
        </div>`;
      });
    });
    h+=`</div>`;
  }
  return h;
}

// ═══════════════════════════════════════════════════════════
function renderDailyNotes(coord,state,day){
  const noteFields=[
    {id:"nwins",label:"Wins & key outcomes",ph:"What went well today?",icon:"ti-star",col:"#085041"},
    {id:"nblockers",label:"Blockers & follow-ups needed",ph:"What needs actioning?",icon:"ti-alert-triangle",col:"#9c0006"},
    {id:"npipeline",label:"Pipeline notes",ph:"New leads, opportunities moving forward…",icon:"ti-git-branch",col:"#633806"},
    {id:"ncampaign",label:"Campaign progress notes",ph:"Updates on active campaigns, employer call runs, estate visits…",icon:"ti-speakerphone",col:"#0C447C"},
  ];

  let h=`<div class="card">

    <div class="field">
      <label><i class="ti ${f.icon}" style="color:${f.col}"></i> ${f.label}</label>

  // End of day review
  const eodComplete=day.eodStatus==="complete";
  h+=`<div class="card" style="${eodComplete?"border-color:var(--greent);background:#f0fff8":""}">
    <div class="card-title"><i class="ti ti-checklist"></i> End-of-day review
      ${eodComplete?'<span class="tag" style="background:var(--green);color:var(--greent);font-size:11px">✓ Day complete</span>':'<span class="tag" style="background:var(--amber);color:var(--ambert);font-size:11px">Draft</span>'}
    </div>
    <div class="field">
      <label>What result did today's activity create?</label>
      <textarea id="eod_result" placeholder="What was actually achieved?" onchange="saveEOD('result',this.value)" style="min-height:72px">${day.eodResult||""}</textarea>
    </div>
    <div class="field">
      <label>Highest-priority action for tomorrow</label>
      <textarea id="eod_tomorrow" placeholder="What must happen first tomorrow?" onchange="saveEOD('tomorrow',this.value)" style="min-height:60px">${day.eodTomorrow||""}</textarea>
    </div>
    <div class="field">
      <label>All activities and follow-ups entered and current?</label>
      <select id="eod_entered" onchange="saveEOD('entered',this.value)">
        <option value="">— Select —</option>
        <option value="Yes"${day.eodAllEntered==="Yes"?" selected":""}>Yes — everything is up to date</option>
        <option value="No"${day.eodAllEntered==="No"?" selected":""}>No — some items still to enter</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button onclick="saveEOD('status','draft')" class="${!eodComplete?"btn-primary":"btn-ghost"} btn-sm">Save as draft</button>
      <button onclick="saveEOD('status','complete')" class="${eodComplete?"btn-success":"btn-primary"} btn-sm">✓ Mark day complete</button>
    </div>
  </div>`;

  return h;
}

      <div class="funnel-step"><div class="num">${T.call_meaningful}</div><div class="small muted">Meaningful</div></div>
      <div class="funnel-arrow">→</div>
      <div class="funnel-step"><div class="num">${T.opp_generated}</div><div class="small muted">Opps</div></div>
      <div class="funnel-arrow">→</div>

      <div class="funnel-step"><div class="num">${T.registration}</div><div class="small muted">Regs</div></div>

  // Day-by-day breakdown
  h+=`<div class="sect-hdr">Day by day</div>`;

    h+=`<div class="wk-day" style="${isToday?"border-color:var(--hdr)":""}">
      <div class="wk-day-hdr" onclick="S.wkExpanded['${d}']=!S.wkExpanded['${d}'];render()">

          <span class="bold">${dayOfWeek(d)} ${fmtDateShort(d)}</span>

        <div style="display:flex;align-items:center;gap:8px">

          ${overdueCnt>0?`<span class="overdue-badge">⚠ ${overdueCnt} overdue</span>`:""}

          <div class="small muted mt8">${day.eodResult}</div>

  // Full weekly KR table
  const tgt=WEEKLY_TARGETS, s=state;
  const krRows=[
    {label:"Commencements",val:T.commencement,tgt:tgt.commencement[s]},
    {label:"Registrations",val:T.registration,tgt:tgt.registration[s]},
    {label:"Enrolments",val:T.enrolment,tgt:tgt.enrolment[s]},
    {label:"Intro calls completed",val:T.intro_call_done,tgt:tgt.intro_call[s]},
    {label:"ACAP contacts",val:T.acap_contact_attempted,tgt:tgt.acap_contact[s]},

    {label:"Events",val:T.event,tgt:tgt.event[s]},
    {label:"Employer calls attempted",val:T.call_attempted,tgt:tgt.employer_call[s]},
    {label:"Calls connected",val:T.call_connected,tgt:0},
    {label:"Meaningful conversations",val:T.call_meaningful,tgt:0},
    {label:"Site visits (employers)",val:T.site_employers,tgt:tgt.site_visit[s]},
