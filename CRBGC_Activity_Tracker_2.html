    {label:"New employers met",val:T.new_employer_met,tgt:tgt.new_employer_met[s]},
    {label:"New employers to DB",val:T.new_employer_db,tgt:tgt.new_employer_db[s]},
    {label:"Student leads",val:T.lead,tgt:tgt.lead_generated[s]},
    {label:"Opportunities generated",val:T.opp_generated,tgt:0},
    {label:"Pipeline progressed",val:T.pipeline_progressed,tgt:0},
    {label:"Sign-ups booked",val:T.signup_booked,tgt:0},
    {label:"Registrations submitted",val:T.reg_submitted,tgt:0},
    {label:"Follow-ups open",val:T.followup_open,tgt:0},
    {label:"Follow-ups overdue",val:T.followup_overdue,tgt:0,red:true},
  ];

  h+=`<div class="card"><div class="card-title"><i class="ti ti-table"></i> Weekly KR detail</div>
    ${krRows.map(k=>{
      const pct=k.tgt>0?Math.min(100,Math.round(k.val/k.tgt*100)):0;
      const col=k.red?"var(--redt)":k.tgt===0?"var(--tp)":pct>=100?"var(--greent)":pct>=70?"var(--ambert)":"var(--redt)";
      return `<div class="kr-row">
        <span class="kr-label">${k.label}</span>
        <span class="kr-val" style="color:${k.val>0&&k.red?"var(--redt)":"var(--tp)"}">${k.val}</span>
        ${k.tgt>0?`<span class="kr-tgt muted">/ ${k.tgt}</span>`:`<span class="kr-tgt"></span>`}
      </div>`;
    }).join("")}
  </div>`;

  return h;
}

// ═══════════════════════════════════════════════════════════
// WEEKLY NOTES TAB
// ═══════════════════════════════════════════════════════════
function renderWkNotes(coord,state){
  const wkMon=mondayOf(S.date);
  const allWks=getAllWeeks(coord);
  let ref={wr1:"",wr2:"",wr3:""};
  try{const r=localStorage.getItem(PFX+"wkref:"+coord+":"+wkMon);if(r)ref=JSON.parse(r);}catch(e){}

  const days=weekDaysMF(S.date);
  // Aggregate daily notes for the week
  const cats={wins:[],blockers:[],pipeline:[],campaign:[]};
  days.forEach(d=>{
    const dy=loadDay(coord,d);
    if(dy.nwins&&dy.nwins.trim()) cats.wins.push({d,text:dy.nwins.trim()});
    if(dy.nblockers&&dy.nblockers.trim()) cats.blockers.push({d,text:dy.nblockers.trim()});
    if(dy.npipeline&&dy.npipeline.trim()) cats.pipeline.push({d,text:dy.npipeline.trim()});
    if(dy.ncampaign&&dy.ncampaign.trim()) cats.campaign.push({d,text:dy.ncampaign.trim()});
  });

  let h=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0;">
    <div>
      <div style="font-size:14px;font-weight:600">Weekly Notes</div>
      <div class="small muted">${fmtWkRange(S.date)} · ${coord}</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select onchange="S.date=this.value;render()" style="font-size:12px;padding:5px 8px;width:auto">
        ${allWks.map(wk=>`<option value="${weekDaysMF(wk)[0]}"${mondayOf(S.date)===wk?" selected":""}>${fmtWkRange(wk)}</option>`).join("")}
      </select>
      <button onclick="downloadWeeklyNotes()" style="font-size:12px;padding:5px 10px;background:#085041;color:#fff;border:none;border-radius:var(--r);cursor:pointer;white-space:nowrap"><i class="ti ti-download"></i> PDF</button>
    </div>
  </div>`;

  // Daily notes summary
  const noteCategories=[
    {key:"wins",label:"Wins & Key Outcomes",icon:"ti-star",border:"#1baf7a",bg:"#e1f5ee",col:"#085041"},
    {key:"blockers",label:"Blockers & Follow-ups",icon:"ti-alert-triangle",border:"#e24b4a",bg:"#fcebeb",col:"#9c0006"},
    {key:"pipeline",label:"Pipeline Notes",icon:"ti-git-branch",border:"#eda100",bg:"#faeeda",col:"#633806"},
    {key:"campaign",label:"Campaign Progress",icon:"ti-speakerphone",border:"#2a78d6",bg:"#e6f1fb",col:"#0C447C"},
  ];

  noteCategories.forEach(cat=>{
    if(cats[cat.key].length===0) return;
    h+=`<div class="card" style="border-left:3px solid ${cat.border};">
      <div class="card-title" style="color:${cat.col}"><i class="ti ${cat.icon}"></i> ${cat.label}</div>
      ${cats[cat.key].map(e=>`<div style="margin-bottom:8px;padding:8px 10px;background:${cat.bg};border-radius:var(--r);font-size:12px;">
        <div style="font-size:11px;font-weight:600;color:${cat.col};margin-bottom:3px">${fmtDate(e.d)}</div>
        <div style="color:var(--tp);line-height:1.6">${e.text}</div>
      </div>`).join("")}
    </div>`;
  });

  // Weekly reflection
  h+=`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="card-title" style="margin:0"><i class="ti ti-bulb"></i> Weekly Reflection</div>
      <button onclick="saveWeeklyReflection()" class="btn-primary btn-sm">Save</button>
    </div>
    <div class="field">
      <label>1. What moved registrations forward this week?</label>
      <div class="hint" style="margin-bottom:6px">Which decisions, conversations, or actions genuinely advanced BAA and CWBTS?</div>
      <textarea id="wr1" style="min-height:90px">${ref.wr1||""}</textarea>
    </div>
    <div class="field">
      <label>2. What created friction?</label>
      <div class="hint" style="margin-bottom:6px">Not to assign blame, but to remove obstacles.</div>
      <textarea id="wr2" style="min-height:90px">${ref.wr2||""}</textarea>
    </div>
    <div class="field">
      <label>3. What must I improve next week?</label>
      <div class="hint" style="margin-bottom:6px">Standards rise when we notice the small things.</div>
      <textarea id="wr3" style="min-height:90px">${ref.wr3||""}</textarea>
    </div>
  </div>`;

  return h;
}

// ═══════════════════════════════════════════════════════════
// HISTORY TAB
// ═══════════════════════════════════════════════════════════
function renderHistory(coord,state){
  const allDates=allDays(coord).reverse().slice(0,60);
  if(allDates.length===0) return `<div class="card"><div class="muted small">No history recorded yet.</div></div>`;

  // Overdue followups first
  const overdue=getAllOverdueFollowups(coord);
  let h="";
  if(overdue.length>0){
    h+=`<div class="card" style="border-color:var(--redt)">
      <div class="card-title" style="color:var(--redt)"><i class="ti ti-alert-triangle"></i> Overdue follow-ups (${overdue.length})</div>
      ${overdue.map(a=>`<div class="act-item" style="border-left:3px solid var(--redt)">
        <div class="act-item-hdr">
          <span class="tag" style="background:var(--red);color:var(--redt)">${activityLabel(a.type)}</span>
          <span class="bold small">${a.bizName||a.acapOrg||a.leadName||a.studentName||""}</span>
          <span class="overdue-badge">Due ${fmtDateShort(a.followUpDate)}</span>
        </div>
        <div class="small muted">${a.nextAction||""}</div>
      </div>`).join("")}
    </div>`;
  }

  h+=`<div class="sect-hdr">Recent days</div>`;
  allDates.forEach(d=>{
    const day=loadDay(coord,d);
    // Filter out auto follow-up rows and badly-mapped rows (bizName = state)
    const STATE_NAMES = ["VIC","NSW","QLD","ACT","SA","WA","TAS","NT"];
    const acts=(day.activities||[]).filter(a=>
      !(a.id&&(a.id.startsWith("auto_fu_")||a.id.startsWith("auto_acap_")||a.id.startsWith("sl_"))) &&
      !STATE_NAMES.includes(a.bizName)
    );
    // Only show dates from tracker start date onwards
    if(d < TRACKER_START) return;
    if(acts.length===0&&!day.focus) return;
    const status=dayStatus(day);
    h+=`<div class="wk-day">
      <div class="wk-day-hdr" onclick="S.wkExpanded['h${d}']=!S.wkExpanded['h${d}'];render()">
        <div>
          <span class="bold small">${fmtDate(d)}</span>
          ${day.focus?`<div class="small muted mt8">${day.focus}</div>`:""}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${getDayStatusLabel(status)}
          <span class="small muted">${acts.length} act${acts.length!==1?"s":""}</span>
          <i class="ti ${S.wkExpanded["h"+d]?"ti-chevron-up":"ti-chevron-down"}" style="font-size:12px;color:var(--tm)"></i>
        </div>
      </div>
      ${S.wkExpanded["h"+d]?`<div class="wk-day-body">${acts.map(a=>renderActItem(a)).join("")}
      ${day.eodResult?`<div style="padding:8px 10px;background:var(--s1);border-radius:var(--r);border-left:3px solid var(--hdr);margin-top:8px">
        <div class="small bold">EOD result</div><div class="small muted mt8">${day.eodResult}</div>
      </div>`:""}
      </div>`:""}
    </div>`;
  });
  return h;
}

// ═══════════════════════════════════════════════════════════
// MANAGER DASHBOARD
// ═══════════════════════════════════════════════════════════
function renderDailyDashboard(){
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];
  const date = S.date;
  let h = "";

  coordsToShow.forEach(function(coord) {
    const state = STATES[coord];
    const day = loadDay(coord, date);
    const acts = day.activities||[];
    const status = dayStatus(day);

    // Daily counts
    const commencements   = acts.filter(a=>a.type==="commencement").length;
    const registrations   = acts.filter(a=>a.type==="registration").length;
    const acapContacts    = acts.filter(a=>a.type==="acap_contact"||a.type==="acap_f2f").length;
    const callsAttempted  = acts.filter(a=>a.type==="employer_call"&&(!a.id||!a.id.startsWith("auto_fu_"))).length;
    const callsMeaningful = acts.filter(isMeaningfulCall).length;
    const siteVisits      = acts.filter(a=>a.type==="site_visit").length;
    const newEmployers    = acts.filter(a=>a.type==="new_employer_met"||a.type==="new_employer_db").length;
    const leads           = acts.filter(a=>a.type==="lead").length;
    const pipelineContacted = acts.filter(a=>a.type==="pipeline").length;
    const pipelineProgressed = acts.filter(a=>a.type==="pipeline"&&a.newStage&&a.prevStage&&a.newStage!==a.prevStage).length;
    const followupsClosed = acts.filter(a=>a.type==="follow_up_closed").length;
    const oppsGenerated   = acts.filter(a=>["Apprentice vacancy identified","Student lead identified","Employer meeting booked","Sign-up booked"].includes(a.activityOutcome)).length;

    // Daily pace targets
    const tgt = WEEKLY_TARGETS;
    const s = state;

    h += `<div class="card">
      <div class="card-title">
        <i class="ti ti-user-circle"></i> ${coord} — ${state}
        <span style="margin-left:8px">${getDayStatusLabel(status)}</span>
        <button onclick="switchToCoord('${coord}')" style="margin-left:auto;font-size:11px;padding:3px 10px;background:var(--hdr);color:#fff;border:none;border-radius:var(--r);cursor:pointer">View & Edit →</button>
      </div>

      <!-- Focus -->
      ${day.focus?`<div style="margin-bottom:10px"><span class="focus-badge"><i class="ti ti-target"></i> ${day.focus}${day.focusOther?" — "+day.focusOther:""}</span></div>`:`<div style="color:var(--tm);font-size:12px;margin-bottom:10px"><i class="ti ti-alert-circle"></i> No primary focus set</div>`}

      <!-- Daily activity grid -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">
        ${[
          {lbl:"Commencements",   val:commencements,    tgt:Math.round(paceTarget(tgt.commencement[s]))},
          {lbl:"Registrations",   val:registrations,    tgt:Math.round(paceTarget(tgt.registration[s]))},
          {lbl:"ACAP contacts",   val:acapContacts,      tgt:Math.round(paceTarget(tgt.acap_contact[s]))},
          {lbl:"Calls attempted", val:callsAttempted,   tgt:Math.round(paceTarget(tgt.employer_call[s]))},
          {lbl:"Meaningful convs",val:callsMeaningful,  tgt:0},
          {lbl:"Site visits",     val:siteVisits,       tgt:Math.round(paceTarget(tgt.site_visit[s]))},
          {lbl:"New employers",   val:newEmployers,     tgt:Math.round(paceTarget(tgt.new_employer_met[s]))},
          {lbl:"Student leads",   val:leads,            tgt:Math.round(paceTarget(tgt.lead_generated[s]))},
          {lbl:"Pipeline",        val:pipelineContacted,tgt:0},
        ].map(k=>{
          const onPace = k.tgt===0 || k.val>=k.tgt;
          const col = k.val===0?"var(--tm)":onPace?"var(--greent)":"var(--redt)";
          return `<div style="background:var(--s1);border-radius:var(--r);padding:8px;text-align:center;border:.5px solid var(--bd)">
            <div style="font-size:20px;font-weight:700;color:${col}">${k.val}</div>
            <div style="font-size:10px;color:var(--tm)">${k.lbl}</div>
            ${k.tgt>0?`<div style="font-size:10px;color:${onPace?"var(--greent)":"var(--redt)"}">pace: ${k.tgt}</div>`:""}
          </div>`;
        }).join("")}
      </div>

      <!-- Opportunities & pipeline -->
      ${oppsGenerated>0||pipelineProgressed>0||followupsClosed>0?`
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        ${oppsGenerated>0?`<span style="background:var(--green);color:var(--greent);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">⭐ ${oppsGenerated} opp${oppsGenerated>1?"s":""}</span>`:""}
        ${pipelineProgressed>0?`<span style="background:var(--o2);color:var(--o2t);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">↑ ${pipelineProgressed} pipeline moved</span>`:""}
        ${followupsClosed>0?`<span style="background:var(--o1);color:var(--o1t);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">✓ ${followupsClosed} follow-up${followupsClosed>1?"s":""} closed</span>`:""}
      </div>`:""}

      <!-- EOD summary -->
      ${day.eodResult?`<div style="background:var(--s1);border-radius:var(--r);padding:10px 12px;border-left:3px solid var(--hdr);font-size:12px">
        <div style="font-weight:600;color:var(--hdr);margin-bottom:4px"><i class="ti ti-checklist"></i> EOD Result</div>
        <div style="color:var(--ts)">${day.eodResult}</div>
        ${day.eodTomorrow?`<div style="margin-top:6px;color:var(--tm)"><i class="ti ti-arrow-right"></i> Tomorrow: ${day.eodTomorrow}</div>`:""}
      </div>`:`<div style="color:var(--tm);font-size:12px;padding:8px 0"><i class="ti ti-clock"></i> EOD review not yet completed</div>`}

      <!-- Activities log (expandable) -->
      ${acts.length>0?`
      <div style="margin-top:10px">
        <div style="font-size:11px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Activity log (${acts.length})</div>
        ${acts.slice(0,3).map(a=>renderActItem(a,coord)).join("")}
        ${acts.length>3?`<div style="font-size:12px;color:var(--tm);text-align:center;padding:4px;cursor:pointer" onclick="switchToCoord('${coord}');S.tab='today';render()">+${acts.length-3} more — tap to view all</div>`:""}
      </div>`:`<div style="color:var(--tm);font-size:12px;padding:8px 0"><i class="ti ti-circle-dashed"></i> No activities logged today</div>`}
    </div>`;
  });

  return h||`<div class="card"><div class="muted small">No data for this date.</div></div>`;
}

// ── Rolling week-on-week trend dashboard ──────────────────────────────────
function renderTrendDashboard() {
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];

  // Build weeks from trendFrom to trendTo — latest first
  const trendFrom = mondayOf(S.trendFrom || addWeeks(S.date,-7));
  const trendTo   = mondayOf(S.trendTo   || S.date);
  const weeks = [];
  let cur = new Date(trendTo+"T12:00:00");
  const fromDate = new Date(trendFrom+"T12:00:00");
  while (cur >= fromDate && weeks.length < 52) {
    weeks.push(cur.toISOString().substring(0,10));
    cur.setDate(cur.getDate()-7);
  }

  // Key metrics to trend
  const TREND_METRICS = [
    {key:"commencement",    label:"Commencements",         fn:function(T){return T.commencement;}},
    {key:"registration",    label:"Registrations",         fn:function(T){return T.registration;}},
    {key:"call_attempted",  label:"Calls attempted",       fn:function(T){return T.call_attempted;}},
    {key:"call_meaningful", label:"Meaningful convs",      fn:function(T){return T.call_meaningful;}},
    {key:"site_employers",  label:"Site visits",           fn:function(T){return T.site_employers;}},
    {key:"acap_contact",    label:"ACAP contacts",         fn:function(T){return T.acap_contact_attempted;}},
    {key:"opp_generated",   label:"Opportunities",         fn:function(T){return T.opp_generated;}},
    {key:"pipeline_prog",   label:"Pipeline progressed",   fn:function(T){return T.pipeline_progressed;}},
    {key:"new_employer_met",label:"New employers met",     fn:function(T){return T.new_employer_met;}},
    {key:"lead",            label:"Student leads",         fn:function(T){return T.lead;}},
    {key:"followup_overdue",label:"Overdue follow-ups",    fn:function(T){return T.followup_overdue;}, warn:true},
    {key:"days_productive", label:"Productive days",       fn:function(T){return T.days_productive;}},
  ];

  // Pre-calculate totals for each coord and week
  const data = {};
  coordsToShow.forEach(function(coord) {
    data[coord] = {};
    weeks.forEach(function(mon) {
      data[coord][mon] = weeklyTotals(coord, mon);
    });
  });

  let h = "";

  // If all coords shown — render combined team trend table
  if (S.dashFilter.coord === "all") {
    h += `<div class="card">
      <div class="card-title"><i class="ti ti-trending-up"></i> Team — Week on Week Trend</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <th style="text-align:left;padding:6px 8px;background:var(--hdr);color:#fff;min-width:130px">Metric</th>
          <th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff">Trend</th>
          ${weeks.map(function(mon){
            return `<th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff;white-space:nowrap">${fmtDateShort(mon)}</th>`;
          }).join("")}
        </tr>
        ${TREND_METRICS.map(function(metric, mi) {
          const rowBg = mi%2===0?"var(--s1)":"#fff";
          const vals = weeks.map(function(mon) {
            return coordsToShow.reduce(function(sum,coord){ return sum + metric.fn(data[coord][mon]); }, 0);
          });
          const latest = vals[0];
          const prev   = vals[1]||0;
          const trend  = latest > prev ? "↑" : latest < prev ? "↓" : "→";
          const trendCol = metric.warn
            ? (latest>prev?"var(--redt)":latest<prev?"var(--greent)":"var(--tm)")
            : (latest>prev?"var(--greent)":latest<prev?"var(--redt)":"var(--tm)");
          const max = Math.max(...vals, 1);

          return `<tr>
            <td style="padding:6px 8px;font-weight:600;background:${rowBg};color:${metric.warn?"var(--redt)":"var(--tp)"}">${metric.label}</td>
            <td style="text-align:center;padding:6px 4px;background:${rowBg};font-size:16px;font-weight:700;color:${trendCol}">${trend}</td>
            ${vals.map(function(v, vi) {
              const isLatest = vi === 0;
              const barH = Math.round((v/max)*24);
              // Team table - RAG vs combined target across all shown coords
              const combinedTgt = coordsToShow.reduce(function(sum,coord){
                const s=STATES[coord], t=WEEKLY_TARGETS;
                const tk = metric.warn?0:
                  metric.label==="Commencements"?t.commencement[s]:
                  metric.label==="Registrations"?t.registration[s]:
                  metric.label==="Calls attempted"?t.employer_call[s]:
                  metric.label==="Site visits"?t.site_visit[s]:
                  metric.label==="ACAP contacts"?t.acap_contact[s]:
                  metric.label==="New employers met"?t.new_employer_met[s]:
                  metric.label==="Student leads"?t.lead_generated[s]:0;
                return sum+tk;
              },0);
              let tCellBg, tCellTxt, tBarCol;
              if (metric.warn) {
                tCellBg = v===0?"var(--green)":v<=3?"var(--amber)":"var(--red)";
                tCellTxt = v===0?"var(--greent)":v<=3?"var(--ambert)":"var(--redt)";
                tBarCol = tCellTxt;
              } else if (combinedTgt>0) {
                const pct=v/combinedTgt;
                if(pct>=1)     {tCellBg="var(--green)";tCellTxt="var(--greent)";tBarCol="var(--greent)";}
                else if(pct>=0.7){tCellBg="var(--amber)";tCellTxt="var(--ambert)";tBarCol="var(--ambert)";}
                else if(v>0)   {tCellBg="var(--red)";  tCellTxt="var(--redt)";  tBarCol="var(--redt)";  }
                else           {tCellBg=rowBg;          tCellTxt="var(--tm)";    tBarCol="var(--bd)";    }
              } else {
                tCellBg=rowBg; tCellTxt=v===0?"var(--tm)":"var(--tp)"; tBarCol=v===0?"var(--bd)":"var(--hdr2)";
              }
              return `<td style="text-align:center;padding:3px;background:${isLatest?tCellBg:rowBg};vertical-align:bottom;border-radius:${isLatest?4:0}px">
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
                  <div style="font-size:11px;font-weight:${isLatest?700:400};color:${isLatest?tCellTxt:v===0?"var(--tm)":"var(--tp)"}">${v}</div>
                  <div style="width:20px;height:${Math.max(barH,2)}px;background:${isLatest?tBarCol:v===0?"var(--bd)":"#ccc"};border-radius:2px"></div>
                </div>
              </td>`;
            }).join("")}
          </tr>`;
        }).join("")}
      </table>
      </div>
    </div>`;
  }

  // Per-coordinator trend cards
  coordsToShow.forEach(function(coord) {
    const state = STATES[coord];
    h += `<div class="card">
      <div class="card-title"><i class="ti ti-user-circle"></i> ${coord} — ${state} · Week on Week</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <th style="text-align:left;padding:6px 8px;background:var(--hdr);color:#fff;min-width:130px">Metric</th>
          <th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff">Trend</th>
          ${weeks.map(function(mon){
            return `<th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff;white-space:nowrap">${fmtDateShort(mon)}</th>`;
          }).join("")}
        </tr>
        ${TREND_METRICS.map(function(metric, mi) {
          const rowBg = mi%2===0?"var(--s1)":"#fff";
          const vals = weeks.map(function(mon){ return metric.fn(data[coord][mon]); });
          const latest = vals[0];
          const prev   = vals[1]||0;
          const trend  = latest > prev ? "↑" : latest < prev ? "↓" : "→";
          const trendCol = metric.warn
            ? (latest>prev?"var(--redt)":latest<prev?"var(--greent)":"var(--tm)")
            : (latest>prev?"var(--greent)":latest<prev?"var(--redt)":"var(--tm)");
          const max = Math.max(...vals, 1);
          const tgt = WEEKLY_TARGETS;
          const weeklyTgt = metric.key==="commencement"?tgt.commencement[state]:
                            metric.key==="registration"?tgt.registration[state]:
                            metric.key==="call_attempted"?tgt.employer_call[state]:
                            metric.key==="site_employers"?tgt.site_visit[state]:
                            metric.key==="acap_contact"?tgt.acap_contact[state]:
                            metric.key==="new_employer_met"?tgt.new_employer_met[state]:
                            metric.key==="lead"?tgt.lead_generated[state]:0;

          return `<tr>
            <td style="padding:6px 8px;font-weight:600;background:${rowBg};color:${metric.warn?"var(--redt)":"var(--tp)"}">${metric.label}${weeklyTgt?`<div style="font-size:10px;color:var(--tm);font-weight:400">target: ${weeklyTgt}</div>`:""}
            </td>
            <td style="text-align:center;padding:6px 4px;background:${rowBg};font-size:16px;font-weight:700;color:${trendCol}">${trend}</td>
            ${vals.map(function(v, vi) {
              const isLatest = vi === 0;
              const barH = Math.round((v/max)*28);
              // RAG colouring vs weekly target
              let cellBg, cellTxt, barCol;
              if (metric.warn) {
                // Overdue follow-ups — inverse RAG (more = worse)
                cellBg = v===0?"var(--green)":v<=2?"var(--amber)":"var(--red)";
                cellTxt = v===0?"var(--greent)":v<=2?"var(--ambert)":"var(--redt)";
                barCol = v===0?"var(--greent)":v<=2?"var(--ambert)":"var(--redt)";
              } else if (weeklyTgt>0) {
                const pct = v/weeklyTgt;
                if (pct>=1)    { cellBg="var(--green)"; cellTxt="var(--greent)"; barCol="var(--greent)"; }
                else if(pct>=0.7){ cellBg="var(--amber)"; cellTxt="var(--ambert)"; barCol="var(--ambert)"; }
                else if(v>0)   { cellBg="var(--red)";   cellTxt="var(--redt)";   barCol="var(--redt)";   }
                else           { cellBg=rowBg;           cellTxt="var(--tm)";     barCol="var(--bd)";     }
              } else {
                // No target — neutral colouring, darker if higher
                cellBg = rowBg; cellTxt = v===0?"var(--tm)":"var(--tp)"; barCol = v===0?"var(--bd)":"var(--hdr2)";
              }
              return `<td style="text-align:center;padding:3px;background:${isLatest?cellBg:rowBg};vertical-align:bottom;border-radius:${isLatest?4:0}px">
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
                  <div style="font-size:11px;font-weight:${isLatest?700:400};color:${isLatest?cellTxt:v===0?"var(--tm)":"var(--tp)"}">${v}</div>
                  <div style="width:20px;height:${Math.max(barH,2)}px;background:${isLatest?barCol:v===0?"var(--bd)":"#ccc"};border-radius:2px"></div>
                </div>
              </td>`;
            }).join("")}
          </tr>`;
        }).join("")}
      </table>
      </div>
    </div>`;
  });

  return h;
}

// ── Debug: fetch raw follow-ups via the app's own code path ─────────────
// Uses jsonpFetch (same function pullFollowups uses) so results are directly
// comparable across devices — no browser-tab auth/caching confounds like
// navigating to the raw exec URL directly can introduce.
async function debugFollowups(){
  const coord=S.user.coord, state=STATES[coord];
  const url=WEBAPP_URL+"?action=get_followups&coord="+encodeURIComponent(coord)+"&state="+state;
  try{
    const data=await jsonpFetch(url);
    if(!data.ok){ alert("Server error: "+(data.msg||"unknown")); return; }
    const list=data.followups||[];
    const byType={};
    list.forEach(f=>{ byType[f.type]=(byType[f.type]||0)+1; });
    const typeLines=Object.keys(byType).map(t=>t+": "+byType[t]).join("\n");
    const idLines=list.map(f=>f.type+" | "+f.id+" | due "+f.followUpDate).join("\n");
    alert(
      "Coord: "+coord+"\n"+
      "Total: "+data.count+"\n\n"+
      "By type:\n"+typeLines+"\n\n"+
      "All entries:\n"+idLines
    );
  }catch(e){
    alert("Fetch failed: "+e.message);
  }
}

// Field builder helpers
function fld(label,id,type,val,options,required){
  // options = array of option values (for select), or null/undefined for other types
  // required = "true" string or truthy value
  const req=required?`<span class="req">*</span>`:"";
  let input;
  if(type==="select"){
    const optArr=Array.isArray(options)?options:[];
    const opts=optArr.map(o=>`<option value="${o}"${val===o?" selected":""}>${o||"— Select —"}</option>`).join("");
    input=`<select id="${id}" ${required?"required":""}>${opts}</select>`;
  } else if(type==="textarea"){
    input=`<textarea id="${id}" placeholder="${label}..." ${required?"required":""}>${val||""}</textarea>`;
  } else {
    input=`<input id="${id}" type="${type}" value="${val||""}" placeholder="${label}..." ${required?"required":""}>`;
  }
  return `<div class="field"><label>${label}${req}</label>${input}</div>`;
}
function fldRow(fields){
  return `<div class="field-row">${fields.join("")}</div>`;
}

    fields+=fld("Email","add_acap_email","email",data.email||"");
    fields+=fld("Mobile","add_acap_mobile","text",data.mobile||"");
  }

  if(type==="add_acap"){ act.acapOrg=g("add_acap_org");act.contactName=g("add_acap_contact");act.position=g("add_acap_position");act.studentState=g("add_acap_state");act.suburb=g("add_acap_region");act.email=g("add_acap_email");act.mobile=g("add_acap_mobile"); }

  if(type==="event"){ act.eventName=g("ev_name");act.location=g("ev_loc");act.attendees=g("ev_att");act.activityOutcome=g("ev_outcome");act.notes=g("ev_notes"); }

}

function snoozeFollowup(id, date, coord) {
  // Capture bizName FIRST before any mutations
  let bizName = "";
  try {
    const dayCheck = loadDay(coord, date);
    const actCheck = (dayCheck.activities||[]).find(a=>a.id===id);
    if (actCheck) {
      bizName = actCheck.bizName||"";
    }
    if (!bizName) {
      const cf = localStorage.getItem(PFX+"followups:"+coord);
      if (cf) {
        const fuCheck = JSON.parse(cf).find(a=>a.id===id);
        if (fuCheck) bizName = fuCheck.bizName||"";
      }
    }
  } catch(e_) {}

  // Move follow-up to next working day relative to S.date
  const base = new Date((S.date||TODAY)+"T12:00:00");
  base.setDate(base.getDate()+1);
  // Skip weekends
  while (base.getDay()===0 || base.getDay()===6) base.setDate(base.getDate()+1);
  const tomorrowStr = base.toISOString().substring(0,10);

  // Update in local day record
  const day = loadDay(coord, date);
  const act = (day.activities||[]).find(a=>a.id===id);
  if (act) {
    act.followUpDate = tomorrowStr;
    act.snoozeCount = (act.snoozeCount||0) + 1;
    act.lastSnoozed = S.date||TODAY;
    saveDay(day);
  }

  // Update cloud cache
  try {
    const cacheKey = PFX+"followups:"+coord;
    let followups = [];
    const cf = localStorage.getItem(cacheKey);
    if (cf) followups = JSON.parse(cf);
    const f = followups.find(a=>a.id===id);
    if (f) {
      f.followUpDate = tomorrowStr;
      f.snoozeCount = (f.snoozeCount||0) + 1;
      f.lastSnoozed = S.date||TODAY;
      if (!bizName) bizName = f.bizName||"";
    } else if (act) {
      followups.push({...act, followUpDate:tomorrowStr, snoozeCount:1, lastSnoozed:S.date||TODAY});
      if (!bizName) bizName = act.bizName||"";
    }
    localStorage.setItem(cacheKey, JSON.stringify(followups));
  } catch(e) {}

  // Fire WIP update — detect if ACAP or employer activity
  const snoozeActType = (function(){
    try {
      const dc=loadDay(coord,date);
      const ac=(dc.activities||[]).find(function(a){return a.id===id;});
      if(ac) return ac.type||"";
      const cf=localStorage.getItem(PFX+"followups:"+coord);
      if(cf){const fc=JSON.parse(cf).find(function(a){return a.id===id;});if(fc) return fc.type||"";}
    } catch(e){}
    return "";
  })();
  const isAcapSnooze = snoozeActType==="acap_contact"||snoozeActType==="acap_f2f";
  // Get org name for ACAP
  let acapOrg_ = "";
  if (isAcapSnooze) {
    try {
      const dc=loadDay(coord,date);
      const ac=(dc.activities||[]).find(function(a){return a.id===id;});
      acapOrg_ = ac ? (ac.acapOrg||ac.bizName||"") : "";
      if(!acapOrg_){const cf=localStorage.getItem(PFX+"followups:"+coord);if(cf){const fc=JSON.parse(cf).find(function(a){return a.id===id;});if(fc)acapOrg_=fc.acapOrg||fc.bizName||"";}}
    } catch(e){}
  }
  if (isAcapSnooze && acapOrg_) {
    fetch(WEBAPP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({type:"update_acap_followup",coord,org:acapOrg_,
        nextContactDate:tomorrowStr,lastContactDate:S.date||TODAY,action:"snooze"})
    }).catch(function(){});
  } else if (!isAcapSnooze && bizName) {
    fetch(WEBAPP_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({
        type:"update_employer_followup",
        coord, bizName,
        nextContactDate:tomorrowStr,
        lastContactDate:S.date||TODAY,
        action:"snooze"
      })
    }).catch(function(){});
  }

  S.unsyncedChanges = true;
  S.status = {ok:true, msg:"Snoozed to "+tomorrowStr+(bizName?" — "+bizName:"")+" — push to sync"};
  render();
}

function getAllDueToday(coord){
  const result=[];
  allDays(coord).forEach(d=>{
    const day=loadDay(coord,d);
    (day.activities||[]).forEach(a=>{
      const _cd=S.date||TODAY; if(a.followUpDate===_cd && a.status!=="Completed" && a.status!=="Closed"){
        result.push({...a,_date:d});
      }
    });
  });
  try{
    const _cf=localStorage.getItem(PFX+"followups:"+coord);
    if(_cf) JSON.parse(_cf).forEach(function(a){
      const _cd2=S.date||TODAY;
      if(a.followUpDate===_cd2 && a.status!=="Completed" && a.status!=="Closed"){
        if(!result.find(function(r){return r.id===a.id;})) result.push(a);
      }
    });
  }catch(e_){}
  return result.sort((a,b)=>a.type>b.type?1:-1);
}

function getAllOverdueFollowups(coord){
  const result=[];
  allDays(coord).forEach(d=>{
    const day=loadDay(coord,d);
    (day.activities||[]).forEach(a=>{
      if(a.followUpDate && isOverdue(a.followUpDate) && a.status!=="Completed" && a.status!=="Closed") result.push({...a,_date:d});
    });
  });
  return result.sort((a,b)=>a.followUpDate>b.followUpDate?1:-1);

function getAllWeeks(coord){
  const dates=allDays(coord);
  if(dates.length===0) return [mondayOf(TODAY)];
  const weeks=new Set();
  dates.forEach(d=>weeks.add(mondayOf(d)));
  weeks.add(mondayOf(TODAY));
  return Array.from(weeks).sort().reverse();
}

function confirmCloseFollowup(id, date, coord) {
  const outcome       = document.getElementById("fu_outcome")?.value||"";
  const notes         = document.getElementById("fu_notes")?.value?.trim()||"";
  const justification = document.getElementById("fu_justification")?.value?.trim()||"";
  const newFu         = document.getElementById("fu_new_followup")?.value||"no";
  const newDate       = document.getElementById("fu_new_date")?.value||"";
  const newAction     = document.getElementById("fu_new_action")?.value?.trim()||"";

  // Validation
  if (!outcome) { alert("Please select an outcome"); return; }
  if (!notes)   { alert("Please describe what happened"); return; }
  const isMeaningful = MEANINGFUL_OUTCOMES.indexOf(outcome) !== -1;
  if (!isMeaningful && !justification) {
    alert("Please provide justification for closing without meaningful contact");
    return;
  }

  const closeDate = S.date||TODAY;

  // Update original activity record
  const day = loadDay(coord, date);
  const act = (day.activities||[]).find(a=>a.id===id);
  if (act) {
    act.status        = "Completed";
    act.closeOutcome  = outcome;
    act.closeNotes    = notes;
    act.justification = justification||"";
    act.closedDate    = closeDate;
    act.meaningful    = isMeaningful;
    saveDay(day);
  }

  // Remove from followup cache
  try {
    const cacheKey = PFX+"followups:"+coord;
    const cf = localStorage.getItem(cacheKey);
    if (cf) localStorage.setItem(cacheKey, JSON.stringify(JSON.parse(cf).filter(a=>a.id!==id)));
  } catch(e) {}

  // If meaningful — log as a new activity on TODAY (counts toward day's log)
  if (isMeaningful) {
    const todayRec = loadDay(coord, closeDate);
    if (!todayRec.activities) todayRec.activities=[];
    todayRec.activities.push({
      id: uuid(),
      type: "follow_up_closed",
      timestamp: new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}),
      date: closeDate,
      bizName: act?.bizName||act?.acapOrg||act?.leadName||act?.studentName||"",
      contactName: act?.contactName||"",
      activityOutcome: outcome,
      notes: notes,
      status: "Completed",
      closeOutcome: outcome,
      _closedFromId: id,
    });
    saveDay(todayRec);
  }

  // If new follow-up needed
  if (newFu==="yes" && newDate) {
    const origDay = loadDay(coord, date);
    const origAct = (origDay.activities||[]).find(a=>a.id===id);
    if (origAct) {
      origAct.followUpDate = newDate;
      origAct.nextAction   = newAction||origAct.nextAction;
      origAct.status       = "Open";
      origAct.snoozeCount  = 0;
      saveDay(origDay);
      try {
        const cacheKey = PFX+"followups:"+coord;
        const cf = localStorage.getItem(cacheKey);
        const fus = cf ? JSON.parse(cf) : [];
        fus.push({...origAct});
        localStorage.setItem(cacheKey, JSON.stringify(fus));
      } catch(e) {}
    }
  }

  S.modal = null;
  S.unsyncedChanges = true;

  // Update WIP Employer DB next contact date
  try {
    // Try local day record first, then cloud cache
    const origDay2 = loadDay(coord, date);
    let origAct2 = (origDay2.activities||[]).find(a=>a.id===id);
    if (!origAct2) {
      const cf2 = localStorage.getItem(PFX+"followups:"+coord);
      if (cf2) origAct2 = JSON.parse(cf2).find(a=>a.id===id);
    }
    // Also check the act variable already retrieved above
    if (!origAct2 && act) origAct2 = act;
    const bizName2 = origAct2 ? (origAct2.bizName||"") : "";
    if (bizName2) {
      // If meaningful — clear next contact date (will be reset by auto scheduler)
      // If not meaningful — set next contact date to today + 6 weeks
      const today_ = S.date||TODAY;
      let nextDate = "";
      if (!isMeaningful) {
        const n = new Date(today_+"T12:00:00"); n.setDate(n.getDate()+42);
        nextDate = n.toISOString().substring(0,10);
      }
      const fuAction = outcome==="Do not contact — removed from list"
        ? "do_not_contact"
        : isMeaningful ? "closed_meaningful" : "closed_no_contact";
      const isAcapClose = origAct2 && (origAct2.type==="acap_contact"||origAct2.type==="acap_f2f");
      const acapOrgClose = isAcapClose ? (origAct2.acapOrg||origAct2.bizName||"") : "";
      if (isAcapClose && acapOrgClose) {
        fetch(WEBAPP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
          body:JSON.stringify({type:"update_acap_followup",coord,org:acapOrgClose,
            nextContactDate:nextDate,lastContactDate:today_,action:fuAction})
        }).catch(function(){});
      } else if (!isAcapClose && bizName2) {
        fetch(WEBAPP_URL, {
          method:"POST", mode:"no-cors",
          headers:{"Content-Type":"text/plain"},
          body:JSON.stringify({
            type:"update_employer_followup",
            coord, bizName:bizName2,
            nextContactDate:nextDate,
            lastContactDate:today_,
            action: fuAction
          })
        }).catch(function(){});
      }
    }
  } catch(e_){}

  const msg = isMeaningful
    ? "✅ Follow-up closed — counted as today's activity. Push to sync."
    : "Follow-up closed (no meaningful contact recorded). Push to sync.";
  S.status = {ok:true, msg};
  render();
}

function getAllOpenFollowupsForDash(coord) {

    const cf = localStorage.getItem(PFX+"followups:"+coord);
    if (cf) JSON.parse(cf).forEach(function(a) {
      if (a.status!=="Completed" && a.status!=="Closed" && !seen.has(a.id)) {
        seen.add(a.id); result.push(a);
      }
    });
  } catch(e) {}
  // Also check all local days
  allDays(coord).forEach(function(d) {
    const day = loadDay(coord, d);
    (day.activities||[]).forEach(function(a) {
      if (a.followUpDate && a.status!=="Completed" && a.status!=="Closed" && !seen.has(a.id)) {
        seen.add(a.id); result.push(a);
      }
    });
  });
  return result;
}

function actToRow(a, day, coord, state) {
  const d = a._date || day.date || S.date;
  return [
    a.id, coord, state, d,
    day.focus||"", day.focusOther||"",
    a.type, a.timestamp||"",

    a.suburb||"", a.mobile||"", a.email||"",
    a.studentName||"", a.studentState||"", a.trade||"",
    a.prevStage||"", a.newStage||"", a.contactOutcome||"",
    a.barrier||"", a.actionToday||"", a.expectedReg||"",
    a.activityOutcome||"", a.nextAction||"", a.followUpDate||"",
    a.responsible||coord, a.status||"Open", a.notes||"",
    a.within24h||"", day.eodStatus||"", day.eodResult||"",
    day.eodTomorrow||"", day.eodAllEntered||"",
    a.acapOrg||"", a.eventName||"", a.attendees||"",
    a.postcode||"", a.leadName||"",
  ];
}

async function post(type, payload) {
  const body = JSON.stringify({...payload, type});
  try {
    // Try with CORS first (works when hosted on server)
    const res = await fetch(WEBAPP_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body
    });
    if(res.ok) return await res.json();
  } catch(e) {}
  // Fallback: no-cors for local file (can't read response but data gets written)
  await fetch(WEBAPP_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain"},
    body
  });
  return {ok:true, msg:"Pushed (no-cors mode)"};
}

async function pushData() {
  if(S.syncing) return;
  S.syncing=true; S.status={ok:true,msg:"Syncing…"}; render();

  const coord=S.user.coord, state=STATES[coord];
  const monday=mondayOf(S.date);
  const days=weekDaysMF(S.date);
  const errors=[];
  let pushed=0;

  // Build activity rows
  const actRows=[], leadRows=[], empRows=[], dayMetaArr=[];
  days.forEach(d=>{
    const day=loadDay(coord,d);
    dayMetaArr.push({
      date:d, focus:day.focus||"", focusOther:day.focusOther||"",
      eodStatus:day.eodStatus||"", eodResult:day.eodResult||"",
      eodTomorrow:day.eodTomorrow||"", eodAllEntered:day.eodAllEntered||"",
      nwins:day.nwins||"", nblockers:day.nblockers||"",
      npipeline:day.npipeline||"", ncampaign:day.ncampaign||"",
    });
    const realActs=(day.activities||[]).filter(a=>
      !a.id||(a.id&&!a.id.startsWith("auto_fu_")&&!a.id.startsWith("auto_acap_")&&!a.id.startsWith("sl_"))
    );
    realActs.forEach(a=>{
      actRows.push(actToRow(a, day, coord, state));
      if(a.type==="lead"){
        const auDate=d.split("-").reverse().join("/");
        leadRows.push([auDate,a.studentName||"",a.mobile||"",a.email||"",a.trade||"",a.studentState||state,"Tracker","New lead"]);
      }
      if(a.type==="new_employer_db"){
        const auDate=d.split("-").reverse().join("/");
        // Columns: A=DateAdded, B=Active, C=EmpRelationship, D=State, E=BizName,
        //          F=ContactName, G=Position, H=Email, I=Phone, J-L=Website/FB/IG,
        //          M=Region, N=Address, O=Postcode, P=ProfileBuilder,
        //          Q=LastContact, R=Notes, S=FURequired, T=NextContact, U=ActivityOutcome
        empRows.push([auDate,"Y",a.relType||"New Prospect",state,a.bizName||"",
          a.contactName||"","",a.email||"",a.phone||"","","","",
          "","",a.postcode||"","",
          auDate,"","","","",""]);
      }
    });
  });

  // Push activities
  const deletedIds = getPendingDeletes(coord);
  try {
    const r=await post("push_activities",{coord,state,mondayStr:monday,rows:actRows,deletedIds});
    if(r.ok) { pushed+=actRows.length; clearPendingDeletes(coord, deletedIds); }
    else errors.push("Activities: "+r.msg);
  } catch(e){ errors.push("Activities: "+e.message); }

  // Push day meta (focus, EOD, notes)
  try {
    const r=await post("push_day_meta",{coord,days:dayMetaArr});
    if(!r.ok) errors.push("Day meta: "+r.msg);
  } catch(e){ errors.push("Day meta: "+e.message); }

  // Push leads
  try {
    const r=await post("push_leads",{coord,state,mondayStr:monday,rows:leadRows});
    if(!r.ok) errors.push("Leads: "+r.msg);
  } catch(e){ errors.push("Leads: "+e.message); }

  // Push employers
  try {
    const r=await post("push_employers",{coord,state,mondayStr:monday,rows:empRows});
    if(!r.ok) errors.push("Employers: "+r.msg);
  } catch(e){ errors.push("Employers: "+e.message); }

  // Push weekly reflection
  try {
    const wkMon=mondayOf(S.date);
    let ref={wr1:"",wr2:"",wr3:""};
    try{const rv=localStorage.getItem(PFX+"wkref:"+coord+":"+wkMon);if(rv)ref=JSON.parse(rv);}catch(e){}
    if(ref.wr1||ref.wr2||ref.wr3){
      const r=await post("push_reflection",{coord,weekMonday:wkMon,...ref});
      if(!r.ok) errors.push("Reflection: "+r.msg);
    }
  } catch(e){ errors.push("Reflection: "+e.message); }

  if(errors.length>0){
    S.status={ok:false,msg:"Errors: "+errors.join(" | ")};
    S.unsyncedChanges=true;
  } else {
    S.status={ok:true,msg:"✓ Synced — "+actRows.length+" activities · "+leadRows.length+" leads · "+empRows.length+" employers"};
    S.unsyncedChanges=false;
    S.lastSynced=new Date().toISOString();
    lsSet("lastSynced:"+coord,S.lastSynced);
  }
  S.syncing=false; render();
}

// ── JSONP fetch — works from local file:// and SharePoint ────────────────
async function jsonpFetch(url, retries) {
  retries = retries || 0;
  // Try fetch() first — works on mobile and modern browsers
  // Append callback=none so Apps Script returns plain JSON
  const sep = url.includes("?") ? "&" : "?";
  const fetchUrl = url + sep + "_t=" + Date.now();
  try {
    const resp = await fetch(fetchUrl, {method:"GET", mode:"cors"});
    if (resp.ok) {
      const data = await resp.json();
      return data;
    }
  } catch(fetchErr) {
    // fetch failed (CORS not enabled on Apps Script) — fall through to JSONP
  }

  // JSONP fallback
  return new Promise(function(resolve, reject) {
    const cbName = "cb_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const fullUrl = url + sep + "callback=" + cbName + "&_t=" + Date.now();
    let done = false;
    window[cbName] = function(data) {
      done = true;
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      resolve(data);
    };
    const cleanup = function(err) {
      if (done) return;
      done = true;
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      if (retries < 2) {
        setTimeout(function() {
          jsonpFetch(url, retries+1).then(resolve).catch(reject);
        }, 2000*(retries+1));
      } else {
        reject(new Error(err));
      }
    };
    script.onerror = function() { cleanup("Script load failed"); };
    setTimeout(function() { cleanup("Timeout"); }, 15000);
    script.src = fullUrl;
    document.body.appendChild(script);
  });
}
// ── Pull data from cloud for current week ────────────────────────────────
async function pullWeek(coord, dateInWeek) {
  const state=STATES[coord], monday=mondayOf(dateInWeek||S.date);
  const url=WEBAPP_URL+"?action=get_week&coord="+encodeURIComponent(coord)+"&state="+state+"&monday="+monday;
  const data = await jsonpFetch(url);
  if(!data.ok) throw new Error(data.msg||"Cloud load failed");
  return data;
}

// ── Merge cloud data into localStorage ──────────────────────────────────
function mergeCloudData(cloudData, coord) {
  const {activities, dayMeta} = cloudData;
  // Group activities by date
  const byDate={};
  (activities||[]).forEach(a=>{
    if(!byDate[a.date]) byDate[a.date]=[];
    byDate[a.date].push(a);
  });
  // Update each day's localStorage
  Object.keys(byDate).forEach(d=>{
    const day=loadDay(coord,d);
    // Always preserve local activities not known to cloud
    // Cloud may be stale if we pushed recently
    const cloudIds=new Set(byDate[d].map(a=>a.id));
    const localOnly=(day.activities||[]).filter(a=>!cloudIds.has(a.id));
    if(S.unsyncedChanges && localOnly.length>0){
      // We have local-only activities — keep them, update cloud ones
      const cloudById={};
      byDate[d].forEach(a=>{cloudById[a.id]=a;});
      day.activities=(day.activities||[]).map(a=>cloudById[a.id]||a);
      // Add any cloud activities we don't have locally
      byDate[d].forEach(a=>{
        if(!(day.activities||[]).find(x=>x.id===a.id)) day.activities.push(a);
      });
    } else {
      // No unsynced local changes — cloud is authoritative
      day.activities=[...byDate[d], ...localOnly];
    }
    // Merge day meta if available
    if(dayMeta&&dayMeta[d]){
      const dm=dayMeta[d];
      day.focus=dm.focus||day.focus;
      day.focusOther=dm.focusOther||day.focusOther;
      day.eodStatus=dm.eodStatus||day.eodStatus;
      day.eodResult=dm.eodResult||day.eodResult;
      day.eodTomorrow=dm.eodTomorrow||day.eodTomorrow;
      day.eodAllEntered=dm.eodAllEntered||day.eodAllEntered;
      day.nwins=dm.nwins||day.nwins;
      day.nblockers=dm.nblockers||day.nblockers;
      day.npipeline=dm.npipeline||day.npipeline;
      day.ncampaign=dm.ncampaign||day.ncampaign;
    }
    saveDay(day);
  });
}

// ── Auto-load from cloud on open/date change ─────────────────────────────
async function loadFromCloud() {
  if(!S.user||!WEBAPP_URL) return;
  // If we pushed recently, cloud may not have rebuilt yet — skip week pull
  // to avoid overwriting locally-saved activities with stale cloud data
  if(recentlyPushed()) {
    // Still refresh followups/employers in background (they update immediately)
    const coord=S.user.coord, state=STATES[coord];
    pullFollowups(coord, state);
    return;
  }
  S.loading=true; render();
  try {
    const coord=S.user.coord;
    const state=STATES[coord];

    // Pull current week data
    const data=await pullWeek(coord, S.date);
    mergeCloudData(data, coord);

    // Pull all open follow-ups (across all weeks) in background
    pullFollowups(coord, state);
    // Pull employer and ACAP databases in background
    pullEmployers(coord);
    pullAcaps(coord);

    S.status={ok:true,msg:"✓ Loaded from cloud — "+new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"})};
  } catch(e){
    const isLocal = location.protocol === "content:" || location.protocol === "file:";
    S.status={ok:false, msg: isLocal ? "⚠ Open via SharePoint/OneDrive link for live sync — local file mode detected." : "Cloud load failed — showing local data. "+e.message};
  }
  S.loading=false; render();
}

async function pullFollowups(coord, state) {
  try {
    const url=WEBAPP_URL+"?action=get_followups&coord="+encodeURIComponent(coord)+"&state="+state;
    const data=await jsonpFetch(url);
    if(!data.ok) return;
    // Merge follow-up activities into their respective days in localStorage
    // Always update existing entries so phone/name changes come through
    (data.followups||[]).forEach(a=>{
      if(!a.date) return;
      const day=loadDay(coord, a.date);
      if(!day.activities) day.activities=[];
      const idx=day.activities.findIndex(x=>x.id===a.id);
      if(idx>=0) day.activities[idx]=a; // update existing
      else day.activities.push(a);      // add new
      saveDay(day);
    });
    // Cache the full followups list for due-today and overdue checks
    try{localStorage.setItem(PFX+"followups:"+coord,JSON.stringify(data.followups||[]));}catch(e_){}
    render();
  } catch(e){
    // silent
  }
}

// ── Manager: load all coordinators for dashboard ─────────────────────────
async function pullEmployers(coord) {
  try {
    const url = WEBAPP_URL+"?action=get_employers&coord="+encodeURIComponent(coord);
    const data = await jsonpFetch(url);
    if (!data.ok) return;
    setEmployerCache(coord, data.employers||[]);
    render();
  } catch(e) {}
}

// ── ACAP cache ────────────────────────────────────────────────────────────
function acapCacheKey(coord){ return PFX+"acaps:"+coord; }

function getAcapCache(coord){
  try{ const c=localStorage.getItem(acapCacheKey(coord)); return c?JSON.parse(c):[]; }
  catch(e){ return []; }
}

function setAcapCache(coord, acaps){
  try{ localStorage.setItem(acapCacheKey(coord), JSON.stringify(acaps)); }
  catch(e){}
}

function findAcap(coord, orgName) {
  if (!orgName) return null;
  const org = orgName.trim().toLowerCase();
  return getAcapCache(coord).find(function(a) {
    const n = (a.org||"").trim().toLowerCase();
    return n===org || n.indexOf(org)!==-1 || org.indexOf(n)!==-1;
  })||null;
}

async function pullAcaps(coord) {
  try {
    const url = WEBAPP_URL+"?action=get_acaps&coord="+encodeURIComponent(coord);
    const data = await jsonpFetch(url);
    if (!data.ok) return;
    setAcapCache(coord, data.acaps||[]);
    render();
  } catch(e) {}
}

async function loadAllForDashboard() {
  if(!S.user?.isManager||!WEBAPP_URL) return;
  S.loading=true; render();
  try {
    const url=WEBAPP_URL+"?action=get_all_current";
    const data=await jsonpFetch(url);
    if(data.ok) {
      Object.keys(data.data).forEach(coord=>{
        const d=data.data[coord];
        if(d.ok) mergeCloudData(d, coord);
      });
      S.status={ok:true,msg:"✓ Dashboard loaded from cloud"};
    }
  } catch(e){
    S.status={ok:false,msg:"Dashboard load failed: "+e.message};
  }
  S.loading=false; render();
}

render();

// Auto-push every 5 minutes if there are unsynced changes
// Auto-push every 5 minutes as fallback
setInterval(function(){
  if(S.unsyncedChanges && !S.syncing && S.user) pushData();
}, 5*60*1000);

// Realtime push — debounced 3 seconds after activity save
let _pushDebounceTimer = null;
let _lastPushTime = 0;
function schedulePush() {
  if(_pushDebounceTimer) clearTimeout(_pushDebounceTimer);
  _lastPushTime = Date.now(); // Mark push pending immediately — guard cloud pulls
  _pushDebounceTimer = setTimeout(function(){
    if(S.unsyncedChanges && !S.syncing && S.user) {
      pushData();
    }
  }, 3000);
}

function recentlyPushed() {
  // Returns true if a push happened in the last 90 seconds (cloud may be stale)
  return (Date.now() - _lastPushTime) < 90000;
}

// Warn before closing if unsynced
window.addEventListener("beforeunload", function(e){
  if(S.unsyncedChanges){
    e.preventDefault();
    e.returnValue="You have unsynced changes. Push to Sheets before closing?";
  }
});
