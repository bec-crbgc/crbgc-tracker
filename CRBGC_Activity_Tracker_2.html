// THIS WEEK TAB
// ═══════════════════════════════════════════════════════════
function renderThisWeek(coord,state){
  const T=weeklyTotals(coord,S.date);
  const days=weekDaysMF(S.date);

  let h=`<div class="card">
    <div class="card-title"><i class="ti ti-calendar-week"></i> Week summary — ${fmtWkRange(S.date)}</div>
    <div class="field-row" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:12px;text-align:center;">
      <div><div style="font-size:18px;font-weight:700;color:var(--greent)">${T.days_productive}</div><div class="small muted">Productive</div></div>
      <div><div style="font-size:18px;font-weight:700;color:var(--ambert)">${T.days_partial}</div><div class="small muted">Partial</div></div>
      <div><div style="font-size:18px;font-weight:700;color:var(--redt)">${T.days_none}</div><div class="small muted">No activity</div></div>
      <div><div style="font-size:18px;font-weight:700;color:var(--hdr)">${T.days_complete}</div><div class="small muted">Days complete</div></div>
    </div>
    <!-- Weekly (in-week) lead funnel — 2026-08-03, replaces the all-leads-ever
         funnel here; that one now lives on the History tab instead. -->
    <div style="font-size:11px;font-weight:600;color:var(--tm);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Lead conversion funnel — new leads this week</div>
    ${renderWeeklyLeadFunnel(coord, S.date)}
  </div>`;

  // Day-by-day breakdown
  h+=`<div class="sect-hdr">Day by day</div>`;
  days.forEach(d=>{
    const day=loadDay(coord,d);
    const status=dayStatus(day);
    const acts=day.activities||[];
    const isToday=d===TODAY;
    const expanded=S.wkExpanded[d];
    const overdueCnt=acts.filter(a=>a.followUpDate&&isOverdue(a.followUpDate)).length;

    h+=`<div class="wk-day" style="${isToday?"border-color:var(--hdr)":""}">
      <div class="wk-day-hdr" onclick="S.wkExpanded['${d}']=!S.wkExpanded['${d}'];render()">
        <div>
          <span class="bold">${dayOfWeek(d)} ${fmtDateShort(d)}</span>
          ${isToday?'<span class="tag" style="background:var(--hdr);color:#fff;font-size:10px;margin-left:6px">Today</span>':""}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${getDayStatusLabel(status)}
          ${overdueCnt>0?`<span class="overdue-badge">⚠ ${overdueCnt} overdue</span>`:""}
          ${(()=>{const due=(day.activities||[]).filter(a=>a.followUpDate===d&&a.status!=="Completed"&&a.status!=="Closed").length;return due>0?`<span style="background:#E8F0FE;color:#1a73e8;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600">📋 ${due} due</span>`:""})()}
          <i class="ti ${expanded?"ti-chevron-up":"ti-chevron-down"}" style="font-size:12px;color:var(--tm)"></i>
        </div>
      </div>
      ${expanded?`<div class="wk-day-body">
        ${day.focus?`<div style="margin-bottom:8px"><span class="focus-badge"><i class="ti ti-target"></i> ${day.focus}</span></div>`:""}
        ${acts.length===0?`<div class="small muted">No activities logged</div>`:""}
        ${acts.filter(a=>!(a.id&&(a.id.startsWith("auto_fu_")||a.id.startsWith("auto_acap_")||a.id.startsWith("sl_")))).map(a=>renderActItem(a)).join("")}
        ${day.eodResult?`<div style="margin-top:8px;padding:8px 10px;background:var(--s1);border-radius:var(--r);border-left:3px solid var(--hdr)">
          <div class="small bold">EOD result</div>
          <div class="small muted mt8">${day.eodResult}</div>
        </div>`:""}
      </div>`:""}
    </div>`;
  });

  // Full weekly KR table
  const tgt=WEEKLY_TARGETS, s=state;
  const krRows=[
    {label:"Commencements",val:T.commencement,tgt:tgt.commencement[s]},
    {label:"Registrations",val:T.registration,tgt:tgt.registration[s]},
    {label:"Enrolments",val:T.enrolment,tgt:tgt.enrolment[s]},
    {label:"Intro calls completed",val:T.intro_call_done,tgt:tgt.intro_call[s]},
    {label:"ACAP contacts",val:T.acap_contact_attempted,tgt:tgt.acap_contact[s]},
    {label:"ACAP F2F visits",val:T.acap_f2f,tgt:tgt.acap_f2f[s]},
    {label:"Events",val:T.event,tgt:tgt.event[s]},
    {label:"Employer calls attempted",val:T.call_attempted,tgt:tgt.employer_call[s]},
    {label:"Calls connected",val:T.call_connected,tgt:0},
    {label:"Meaningful conversations",val:T.call_meaningful,tgt:0},
    {label:"Site visits (employers)",val:T.site_employers,tgt:tgt.site_visit[s]},
    {label:"Site locations",val:T.site_locations,tgt:0},
    {label:"New employers met",val:T.new_employer_met,tgt:tgt.new_employer_met[s]},
    {label:"New employers to DB",val:T.new_employer_db,tgt:tgt.new_employer_db[s]},
    {label:"Student leads",val:T.lead,tgt:tgt.lead_generated[s]},
    {label:"Opportunities generated",val:T.opp_generated,tgt:0},
    {label:"Pipeline progressed",val:T.pipeline_progressed,tgt:0},
    {label:"Sign-ups booked",val:T.signup_booked,tgt:0},
    {label:"Follow-ups open",val:T.followup_open,tgt:0},
    {label:"Follow-ups overdue",val:T.followup_overdue,tgt:0,red:true},
  ];

  h+=`<div class="card"><div class="card-title"><i class="ti ti-table"></i> Weekly KR detail</div>
    ${krRows.map(k=>{
      const pct=k.tgt>0?Math.min(100,Math.round(k.val/k.tgt*100)):0;
      const col=k.red?"var(--redt)":k.tgt===0?"var(--tp)":pct>=100?"var(--greent)":pct>=70?"var(--ambert)":"var(--redt)";
      return `<div class="kr-row">
        <span class="kr-label">${k.label}</span>
        <span class="kr-val" style="color:${k.val>0&&k.red?"var(--redt)":"var(--tp)"}">${k.val}</span>
        ${k.tgt>0?`<span class="kr-tgt muted">/ ${k.tgt}</span>`:`<span class="kr-tgt"></span>`}
      </div>`;
    }).join("")}
  </div>`;

  return h;
}

// ═══════════════════════════════════════════════════════════
// WEEKLY NOTES TAB
// ═══════════════════════════════════════════════════════════
function renderWkNotes(coord,state){
  const wkMon=mondayOf(S.date);
  const allWks=getAllWeeks(coord);
  let ref={wr1:"",wr2:"",wr3:""};
  try{const r=localStorage.getItem(PFX+"wkref:"+coord+":"+wkMon);if(r)ref=JSON.parse(r);}catch(e){}

  const days=weekDaysMF(S.date);
  // Aggregate daily notes for the week
  const cats={wins:[],blockers:[],pipeline:[],campaign:[]};
  // 2026-08-06: risk entries roll up here too — every risk logged on any
  // day this week, tagged with which day it came from.
  const weekRisks=[];
  // 2026-08-06: off-pace explanations roll up here too — every day this
  // week that was behind on a daily KR target and had an explanation
  // recorded at EOD (see computeDailyPaceDetails/saveEOD).
  const weekOffPaceNotes=[];
  days.forEach(d=>{
    const dy=loadDay(coord,d);
    if(dy.nwins&&dy.nwins.trim()) cats.wins.push({d,text:dy.nwins.trim()});
    if(dy.nblockers&&dy.nblockers.trim()) cats.blockers.push({d,text:dy.nblockers.trim()});
    if(dy.npipeline&&dy.npipeline.trim()) cats.pipeline.push({d,text:dy.npipeline.trim()});
    if(dy.ncampaign&&dy.ncampaign.trim()) cats.campaign.push({d,text:dy.ncampaign.trim()});
    (dy.risks||[]).forEach(r=>{ if(r.issue&&r.issue.trim()) weekRisks.push({d,...r}); });
    // NOTE: deliberately doesn't re-derive "which metrics were behind" via
    // computeDailyPaceDetails() here — that would recompute against
    // whatever the week's cumulative totals are RIGHT NOW (which keeps
    // moving as later days in the week get logged), not what was actually
    // true at the moment this day was closed off. The note text itself is
    // the record of what the coordinator explained at the time.
    if(dy.eodOffPaceNote&&dy.eodOffPaceNote.trim()) weekOffPaceNotes.push({d, note:dy.eodOffPaceNote.trim()});
  });

  let h=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0;">
    <div>
      <div style="font-size:14px;font-weight:600">Weekly Notes</div>
      <div class="small muted">${fmtWkRange(S.date)} · ${coord}</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select onchange="S.date=this.value;render()" style="font-size:12px;padding:5px 8px;width:auto">
        ${allWks.map(wk=>`<option value="${weekDaysMF(wk)[0]}"${mondayOf(S.date)===wk?" selected":""}>${fmtWkRange(wk)}</option>`).join("")}
      </select>
      <button onclick="downloadWeeklyNotes()" style="font-size:12px;padding:5px 10px;background:#085041;color:#fff;border:none;border-radius:var(--r);cursor:pointer;white-space:nowrap"><i class="ti ti-download"></i> PDF</button>
    </div>
  </div>`;

  // Daily notes summary
  const noteCategories=[
    {key:"wins",label:"Wins & Key Outcomes",icon:"ti-star",border:"#1baf7a",bg:"#e1f5ee",col:"#085041"},
    {key:"blockers",label:"Blockers & Follow-ups",icon:"ti-alert-triangle",border:"#e24b4a",bg:"#fcebeb",col:"#9c0006"},
    {key:"pipeline",label:"Pipeline Notes",icon:"ti-git-branch",border:"#eda100",bg:"#faeeda",col:"#633806"},
    {key:"campaign",label:"Campaign Progress",icon:"ti-speakerphone",border:"#2a78d6",bg:"#e6f1fb",col:"#0C447C"},
  ];

  noteCategories.forEach(cat=>{
    if(cats[cat.key].length===0) return;
    h+=`<div class="card" style="border-left:3px solid ${cat.border};">
      <div class="card-title" style="color:${cat.col}"><i class="ti ${cat.icon}"></i> ${cat.label}</div>
      ${cats[cat.key].map(e=>`<div style="margin-bottom:8px;padding:8px 10px;background:${cat.bg};border-radius:var(--r);font-size:12px;">
        <div style="font-size:11px;font-weight:600;color:${cat.col};margin-bottom:3px">${fmtDate(e.d)}</div>
        <div style="color:var(--tp);line-height:1.6">${e.text}</div>
      </div>`).join("")}
    </div>`;
  });

  // 2026-08-06: Risk section — every structured risk entry logged this
  // week, most recent first, tagged with which day it was raised on.
  if(weekRisks.length){
    h+=`<div class="card" style="border-left:3px solid #9c0006;">
      <div class="card-title" style="color:#9c0006"><i class="ti ti-alert-octagon"></i> Risk</div>
      ${weekRisks.map(r=>`<div style="margin-bottom:10px;padding:10px;background:#fcebeb;border-radius:var(--r);font-size:12px;">
        <div style="font-size:11px;font-weight:600;color:#9c0006;margin-bottom:4px">${fmtDate(r.d)}${r.department?" · "+r.department:""}</div>
        <div style="margin-bottom:4px"><b>Issue (root cause):</b> ${r.issue||""}</div>
        ${r.action?`<div style="margin-bottom:4px"><b>Action taken:</b> ${r.action}</div>`:""}
        ${r.outcome?`<div><b>Outcome / follow-up:</b> ${r.outcome}</div>`:""}
      </div>`).join("")}
    </div>`;
  }

  // 2026-08-06: Off-pace explanations — every day this week the
  // coordinator was behind a daily KR target and explained why at EOD.
  if(weekOffPaceNotes.length){
    h+=`<div class="card" style="border-left:3px solid #eda100;">
      <div class="card-title" style="color:#633806"><i class="ti ti-gauge"></i> Off-pace explanations</div>
      ${weekOffPaceNotes.map(n=>`<div style="margin-bottom:10px;padding:10px;background:#faeeda;border-radius:var(--r);font-size:12px;">
        <div style="font-size:11px;font-weight:600;color:#633806;margin-bottom:4px">${fmtDate(n.d)}</div>
        <div style="color:var(--tp);line-height:1.6">${n.note}</div>
      </div>`).join("")}
    </div>`;
  }

  // Weekly reflection
  h+=`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="card-title" style="margin:0"><i class="ti ti-bulb"></i> Weekly Reflection</div>
      <button onclick="saveWeeklyReflection()" class="btn-primary btn-sm">Save</button>
    </div>
    <div class="field">
      <label>1. What moved registrations forward this week?</label>
      <div class="hint" style="margin-bottom:6px">Which decisions, conversations, or actions genuinely advanced BAA and CWBTS?</div>
      <textarea id="wr1" style="min-height:90px">${ref.wr1||""}</textarea>
    </div>
    <div class="field">
      <label>2. What created friction?</label>
      <div class="hint" style="margin-bottom:6px">Not to assign blame, but to remove obstacles.</div>
      <textarea id="wr2" style="min-height:90px">${ref.wr2||""}</textarea>
    </div>
    <div class="field">
      <label>3. What must I improve next week?</label>
      <div class="hint" style="margin-bottom:6px">Standards rise when we notice the small things.</div>
      <textarea id="wr3" style="min-height:90px">${ref.wr3||""}</textarea>
    </div>
  </div>`;

  return h;
}

function renderHistory(coord,state){
  const allDates=allDays(coord).reverse().slice(0,60);
  if(allDates.length===0) return `<div class="card"><div class="muted small">No history recorded yet.</div></div>`;

  let h="";

  // All-time lead conversion funnel — 2026-08-03: moved here from the
  // weekly-summary views (This Week tab / Manager Dashboard), which now
  // show a week-scoped version instead (computeWeeklyLeadFunnel). This is
  // the original all-leads-ever funnel (computeStrictLeadFunnel),
  // unchanged, kept as the single place to see cumulative funnel health.
  h+=`<div class="card">
    <div class="card-title"><i class="ti ti-filter"></i> Lead conversion funnel — all-time</div>
    ${renderStrictLeadFunnel(coord)}
  </div>`;

  // Overdue followups first
  const overdue=getAllOverdueFollowups(coord);
  if(overdue.length>0){
    h+=`<div class="card" style="border-color:var(--redt)">
      <div class="card-title" style="color:var(--redt)"><i class="ti ti-alert-triangle"></i> Overdue follow-ups (${overdue.length})</div>
      ${overdue.map(a=>`<div class="act-item" style="border-left:3px solid var(--redt)">
        <div class="act-item-hdr">
          <span class="tag" style="background:var(--red);color:var(--redt)">${activityLabel(a.type)}</span>
          <span class="bold small">${a.bizName||a.acapOrg||a.leadName||a.studentName||""}</span>
          <span class="overdue-badge">Due ${fmtDateShort(a.followUpDate)}</span>
        </div>
        <div class="small muted">${a.nextAction||""}</div>
      </div>`).join("")}
    </div>`;
  }

  h+=`<div class="sect-hdr">Recent days</div>`;
  allDates.forEach(d=>{
    const day=loadDay(coord,d);
    // Filter out auto follow-up rows and badly-mapped rows (bizName = state)
    const STATE_NAMES = ["VIC","NSW","QLD","ACT","SA","WA","TAS","NT"];
    const acts=(day.activities||[]).filter(a=>
      !(a.id&&(a.id.startsWith("auto_fu_")||a.id.startsWith("auto_acap_")||a.id.startsWith("sl_"))) &&
      !STATE_NAMES.includes(a.bizName)
    );
    // Only show dates from tracker start date onwards
    if(d < TRACKER_START) return;
    if(acts.length===0&&!day.focus) return;
    const status=dayStatus(day);
    h+=`<div class="wk-day">
      <div class="wk-day-hdr" onclick="S.wkExpanded['h${d}']=!S.wkExpanded['h${d}'];render()">
        <div>
          <span class="bold small">${fmtDate(d)}</span>
          ${day.focus?`<div class="small muted mt8">${day.focus}</div>`:""}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${getDayStatusLabel(status)}
          <span class="small muted">${acts.length} act${acts.length!==1?"s":""}</span>
          <i class="ti ${S.wkExpanded["h"+d]?"ti-chevron-up":"ti-chevron-down"}" style="font-size:12px;color:var(--tm)"></i>
        </div>
      </div>
      ${S.wkExpanded["h"+d]?`<div class="wk-day-body">${acts.map(a=>renderActItem(a)).join("")}
      ${day.eodResult?`<div style="padding:8px 10px;background:var(--s1);border-radius:var(--r);border-left:3px solid var(--hdr);margin-top:8px">
        <div class="small bold">EOD result</div><div class="small muted mt8">${day.eodResult}</div>
      </div>`:""}
      </div>`:""}
    </div>`;
  });
  return h;
}

// MANAGER DASHBOARD
// ═══════════════════════════════════════════════════════════
// ── Weekly Dashboard tile metrics — 2026-08-06 ─────────────────────────────
// Bec: "update the weekly dashboard to match the updates we did with the
// daily dashboard (keeping targets visible) this should still be an accrual
// of all daily activity." Replicates the EXACT SAME 14-tile computation
// logic used by renderDailyDashboard() above (including the
// effContactType/effRelType closed-follow-up resolution) but summed across
// every Mon-Fri day of the selected week instead of a single day, so a
// closed follow-up logged on Tuesday still credits the correct tile in the
// weekly card exactly as it would in that day's own Daily Dashboard card.
function weeklyTileMetrics(coord, targetDate){
  const days = weekDaysMF(targetDate);
  const acts = days.reduce((all,d)=>all.concat(realDayActivities(loadDay(coord,d))), []);

  // Same origType/_closedFromId resolution as renderDailyDashboard() — see
  // that function's comment block for the full history/rationale.
  const origActLookup = {};
  allDays(coord).forEach(function(d){
    const dd = loadDay(coord, d);
    (dd.activities||[]).forEach(function(a){ if(a.id) origActLookup[a.id]=a; });
  });
  const resolveOrigAct = a => a._closedFromId ? origActLookup[a._closedFromId] : null;
  const effContactType = a => {
    if(a.type!=="follow_up_closed") return a.type;
    if(a.origType) return a.origType;
    const orig = resolveOrigAct(a);
    return orig ? orig.type : "";
  };
  const effRelType = a => {
    if(a.type!=="follow_up_closed") return a.relType;
    if(a.relType) return a.relType;
    const orig = resolveOrigAct(a);
    return orig ? (orig.relType||"") : "";
  };

  return {
    commencements:       acts.filter(a=>a.type==="commencement").length,
    // FIXED 2026-08-06 per Bec: only a brand-new person (Registration
    // form's "+ new student" capture used, i.e. act.newContactDetails set)
    // counts as a new registration — see weeklyTotals()'s matching fix for
    // the full rationale. An existing lead being progressed through the
    // pipeline no longer inflates this tile.
    registrations:       acts.filter(a=>a.type==="registration"&&a.newContactDetails).length,
    enrolments:          acts.filter(a=>a.type==="enrolment"||(a.type==="enrolment_pipeline"&&a.newStage==="Enrolled")).length,
    // FIXED 2026-08-06 per Bec: "Pipeline progression attempts should show
    // any pipeline (enrolment/registrations) that have been logged in the
    // individuals pipeline tab regardless of whether they are marked as
    // progressed as well as any follow-ups closed that relate to the
    // enrolment/registrations pipeline types." Was pipeline+enrolment_
    // pipeline only — silently excluding "registration" (Registration
    // Pipeline), even though the Pipeline tab itself (renderPipeline's
    // `pipes`) has always treated all three as the same underlying
    // pipeline log. Now matches that tab's type set exactly, and (via
    // effContactType, unchanged) still credits a closed follow-up back to
    // whichever of the three types its original activity was.
    pipelineContacted:   acts.filter(a=>["pipeline","registration","enrolment_pipeline"].includes(effContactType(a))).length,
    acapContacts:        acts.filter(a=>effContactType(a)==="acap_contact"||effContactType(a)==="acap_f2f").length,
    siteVisits:          acts.filter(a=>effContactType(a)==="site_visit"||effContactType(a)==="new_employer_met").length,
    existingEmployerCalls: acts.filter(a=>effContactType(a)==="employer_call"&&(!a.id||!a.id.startsWith("auto_fu_"))&&!NEW_EMPLOYER_STAGE_RELS.includes((effRelType(a)||"").trim())).length,
    newEmployerCalls:      acts.filter(a=>effContactType(a)==="employer_call"&&(!a.id||!a.id.startsWith("auto_fu_"))&&NEW_EMPLOYER_STAGE_RELS.includes((effRelType(a)||"").trim())).length,
    newEmployersAdded:   acts.filter(a=>effContactType(a)==="new_employer_db"||effContactType(a)==="add_employer").length,
    totalContactsAttempted: acts.filter(a=>
      a.type==="follow_up_closed"
      || !["site_visit","new_employer_met","event"].includes(a.type)
    ).length,
    callsMeaningful:     acts.filter(isMeaningfulCall).length,
    leads:               acts.filter(a=>a.type==="lead").length,
    events:              acts.filter(a=>effContactType(a)==="event").length,
    newOpportunity: acts.filter(a=>
      OPPORTUNITY_OUTCOMES.includes(a.activityOutcome)
      || (["acap_contact","acap_f2f"].includes(a.type) && ACAP_OPPORTUNITY_OUTCOMES.includes(a.activityOutcome))
      || (a.type==="employer_call" && a.callOutcome==="Future opportunity")
    ).length,
  };
}

function renderDailyDashboard(){
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];
  const date = S.date;
  let h = "";

  coordsToShow.forEach(function(coord) {
    const state = STATES[coord];
    const day = loadDay(coord, date);
    const acts = realDayActivities(day); // FIXED 2026-08-03 — was raw day.activities, inflating this Daily-view card's counts and activity log with auto-generated placeholder rows
    const status = dayStatus(day);

    // UPDATED 2026-08-03 — redefined per Bec's tile-by-tile spec (see
    // isMeaningfulCall() for the shared "Meaningful Contacts" definition,
    // now used consistently everywhere that label appears, not just here).
    //
    // effContactType(a): a closed follow-up (type "follow_up_closed") now
    // carries the ORIGINAL activity's type (origType) and, for employer
    // calls, its relType — captured in confirmCloseFollowup() — so a
    // closure counts toward whichever tile its original type belongs to,
    // "as per the type" per Bec's request, instead of only ever showing
    // up in the separate "follow-ups closed" badge below. Registrations/
    // Enrolments stay outcome-gated (needing contactOutcome==="Registered"
    // / newStage==="Enrolled") — those fields are deliberately NOT copied
    // onto a follow_up_closed record (a closure doesn't itself represent
    // a fresh Registered/Enrolled event), so closures correctly don't
    // inflate those two tiles.
    // UPDATED 2026-08-04: Bec reported Pipeline/ACAP/Existing Employer
    // Calls tiles showing far fewer than the Activity Log's actual
    // breakdown (e.g. Pipeline 0 vs 3, ACAP 2 vs 4, Existing Employer
    // Calls 0 vs 3), while Total Contacts Attempted (11) was already
    // correct. Root cause: those closures were made using whatever build
    // was live in production at the time — if that predates this file's
    // 2026-08-03 fix (which first started stamping origType/relType onto
    // a follow_up_closed record), the closure record has no origType at
    // all, so effContactType() fell through to "" and the closure didn't
    // credit any type-specific tile (though it still counted toward Total
    // Contacts Attempted, which doesn't care about type). Rather than
    // depending on every device/coordinator already running the latest
    // deployed build, fall back to resolving the original activity via
    // _closedFromId (present on every follow_up_closed record regardless
    // of build) — scanning this coordinator's locally-cached days once —
    // so both old and new closure records resolve to the correct type.
    const origActLookup = {};
    allDays(coord).forEach(function(d){
      const dd = loadDay(coord, d);
      (dd.activities||[]).forEach(function(a){ if(a.id) origActLookup[a.id]=a; });
    });
    const resolveOrigAct = a => a._closedFromId ? origActLookup[a._closedFromId] : null;
    const effContactType = a => {
      if(a.type!=="follow_up_closed") return a.type;
      if(a.origType) return a.origType;
      const orig = resolveOrigAct(a);
      return orig ? orig.type : "";
    };
    const effRelType = a => {
      if(a.type!=="follow_up_closed") return a.relType;
      if(a.relType) return a.relType;
      const orig = resolveOrigAct(a);
      return orig ? (orig.relType||"") : "";
    };

    const commencements       = acts.filter(a=>a.type==="commencement").length; // logged as commenced (commencements can never have a follow-up, so no closure ever attributes here)
    // FIXED 2026-08-06 per Bec: "registrations should only pull new
    // registrations logged for the day, not existing registration
    // activities" — only a brand-new person (Registration form's "+ new
    // student" capture used, act.newContactDetails set) counts; an
    // existing lead being progressed through the pipeline no longer
    // inflates this tile (see weeklyTotals()'s matching fix for the full
    // rationale, including why contactOutcome==="Registered" was the
    // wrong signal — that's the outcome of TODAY's contact, not whether
    // this was a brand-new person).
    const registrations       = acts.filter(a=>a.type==="registration"&&a.newContactDetails).length;
    const enrolments          = acts.filter(a=>a.type==="enrolment"||(a.type==="enrolment_pipeline"&&a.newStage==="Enrolled")).length; // marked as enrolled, or a standalone Enrolment record added
    // FIXED 2026-08-05 per Bec: "Pipeline Progression Attempts" only ever
    // counted the "pipeline" activity type (Registration Pipeline, i.e.
    // pre-registration lead progression) — it silently excluded
    // "enrolment_pipeline" (Enrolment Pipeline, post-registration
    // progression) entirely, even though both are the same underlying
    // concept for this tile's purpose ("a pipeline record got touched,
    // regardless of stage") and every other combined tile here (ACAP
    // Contacts = acap_contact+acap_f2f, Site Visits = site_visit+
    // new_employer_met, right above) already merges its sibling subtypes
    // the same way. A day with 2 Enrolment Pipeline touches and 0
    // Registration Pipeline touches was showing 0 here instead of 2.
    // FIXED 2026-08-06 per Bec: widened to include "registration" (matches
    // the Pipeline tab's own `pipes` type set exactly) — see
    // weeklyTileMetrics()'s matching fix for the full rationale.
    const pipelineContacted   = acts.filter(a=>["pipeline","registration","enrolment_pipeline"].includes(effContactType(a))).length; // records touched, regardless of whether the stage changed — now including closed Pipeline/Registration/Enrolment Pipeline follow-ups
    const acapContacts        = acts.filter(a=>effContactType(a)==="acap_contact"||effContactType(a)==="acap_f2f").length; // calls + F2F visits combined — now including closed ACAP follow-ups
    const siteVisits          = acts.filter(a=>effContactType(a)==="site_visit"||effContactType(a)==="new_employer_met").length; // Existing + New Employer site visits combined — now including closed site-visit follow-ups
    // Existing vs New Employer Calls — split by the "Employer relationship"
    // field on the single Employer Call form, using the same New-prospect/
    // New-employer-acquired grouping already used elsewhere in the app
    // (e.g. the Site Visit — New Employer tile's business auto-detect).
    // Now also includes closed Employer Call follow-ups, split the same way.
    const existingEmployerCalls = acts.filter(a=>effContactType(a)==="employer_call"&&(!a.id||!a.id.startsWith("auto_fu_"))&&!NEW_EMPLOYER_STAGE_RELS.includes((effRelType(a)||"").trim())).length;
    const newEmployerCalls      = acts.filter(a=>effContactType(a)==="employer_call"&&(!a.id||!a.id.startsWith("auto_fu_"))&&NEW_EMPLOYER_STAGE_RELS.includes((effRelType(a)||"").trim())).length;
    const newEmployersAdded   = acts.filter(a=>effContactType(a)==="new_employer_db"||effContactType(a)==="add_employer").length; // added to the database — distinct from site-visiting a new employer, now folded into Site Visits above; now including closed Add Employer follow-ups
    // Total Contacts Attempted — UPDATED 2026-08-04 per Bec, after she
    // spotted Total Contacts Attempted (13) not matching the Activity Log
    // count (14) for a day with 0 Events and no fresh Site Visits logged.
    // Her rule: "total contacts attempted and activity log should = the
    // same (unless there are site visits or events in the activity log)
    // ... in this instance they are all contact attempts." So this tile
    // now equals the FULL Activity Log count minus only fresh (non-closed)
    // Site Visits (site_visit/new_employer_met) and fresh Events — every
    // other fresh activity (Employer Calls, ACAP, Pipeline, Registrations,
    // Enrolments, Commencements, New Employers Added, Student Leads) now
    // counts as a contact attempt. A CLOSED follow-up always counts
    // regardless of its original type (incl. a closed Site Visit/Event
    // follow-up) — per the 2026-08-03 widening — since closing one off is
    // itself an attempted touchpoint, and this is deliberately NOT gated
    // on isMeaningfulCall()/activityOutcome.
    const totalContactsAttempted = acts.filter(a=>
      a.type==="follow_up_closed"
      || !["site_visit","new_employer_met","event"].includes(a.type)
    ).length;
    const callsMeaningful     = acts.filter(isMeaningfulCall).length;
    // CHANGED 2026-08-05 per Bec: "student leads should only count new
    // leads added to database on that day" — reverted from effContactType
    // back to a plain, fresh-only a.type==="lead" check. This tile is
    // deliberately DIFFERENT from ACAP Contacts/Site Visits/Employer
    // Calls/Events, which DO credit closed follow-ups (per Bec's earlier
    // "contacts attempted should also include followups" instruction) —
    // a closed follow-up is a RE-contact with an already-existing lead,
    // not a brand-new lead being added to the database, so it should never
    // count here regardless of what its origType resolves to.
    const leads                = acts.filter(a=>a.type==="lead").length; // ONLY genuinely new leads added to the database today — closed follow-ups never count here, even if their original activity was a "lead"
    const events                = acts.filter(a=>effContactType(a)==="event").length; // now including closed Event follow-ups
    // 2026-08-05 per Bec: "New Opportunity" tile — any opportunity logged
    // against ANY contact type (employer calls, site visits, events, new
    // employers, ACAP). OPPORTUNITY_OUTCOMES matches on activityOutcome
    // with no type-gating, same as the existing "Opportunities generated"
    // badge (oppsGenerated below) always has; ACAP_OPPORTUNITY_OUTCOMES is
    // gated to acap_contact/acap_f2f specifically to avoid colliding with
    // the close-followup modal's own unrelated "Meeting booked" outcome
    // option; and Employer Call's primary Outcome dropdown (callOutcome)
    // is checked separately since "Future opportunity" lives there, not in
    // activityOutcome, for that one type.
    const newOpportunity = acts.filter(a=>
      OPPORTUNITY_OUTCOMES.includes(a.activityOutcome)
      || (["acap_contact","acap_f2f"].includes(a.type) && ACAP_OPPORTUNITY_OUTCOMES.includes(a.activityOutcome))
      || (a.type==="employer_call" && a.callOutcome==="Future opportunity")
    ).length;
    // FIXED 2026-08-06 per Bec: "Pipeline progressed should show any
    // pipeline (enrolment/registrations) that have had movement and are
    // marked as progressed as per the pipeline tab" — widened from
    // pipeline-only to match renderPipeline()'s own `pipes`/`progressed`
    // definition exactly (pipeline + registration + enrolment_pipeline).
    const pipelineProgressed = acts.filter(a=>["pipeline","registration","enrolment_pipeline"].includes(a.type)&&a.newStage&&a.prevStage&&a.newStage!==a.prevStage).length;
    const followupsClosed = acts.filter(a=>a.type==="follow_up_closed").length;
    const oppsGenerated   = acts.filter(a=>["Apprentice vacancy identified","Student lead identified","Employer meeting booked","Sign-up booked"].includes(a.activityOutcome)).length;

    // Daily pace targets
    const tgt = WEEKLY_TARGETS;
    const s = state;

    h += `<div class="card">
      <div class="card-title">
        <i class="ti ti-user-circle"></i> ${coord} — ${state}
        <span style="margin-left:8px">${getDayStatusLabel(status)}</span>
        <button onclick="switchToCoord('${coord}')" style="margin-left:auto;font-size:11px;padding:3px 10px;background:var(--hdr);color:#fff;border:none;border-radius:var(--r);cursor:pointer">View & Edit →</button>
      </div>

      <!-- Focus -->
      ${day.focus?`<div style="margin-bottom:10px"><span class="focus-badge"><i class="ti ti-target"></i> ${day.focus}${day.focusOther?" — "+day.focusOther:""}</span></div>`:`<div style="color:var(--tm);font-size:12px;margin-bottom:10px"><i class="ti ti-alert-circle"></i> No primary focus set</div>`}

      <!-- Daily activity grid — reordered/redefined 2026-08-03 per Bec's spec -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">
        ${[
          {lbl:"Registrations",              val:registrations,          tgt:Math.round(paceTarget(tgt.registration[s]))},
          {lbl:"Enrolments",                 val:enrolments,             tgt:Math.round(paceTarget(tgt.enrolment[s]))},
          {lbl:"Commencements",              val:commencements,          tgt:Math.round(paceTarget(tgt.commencement[s]))},
          {lbl:"Pipeline Progression Attempts",val:pipelineContacted,    tgt:0},
          {lbl:"ACAP Contacts",              val:acapContacts,           tgt:Math.round(paceTarget(tgt.acap_contact[s]))},
          {lbl:"Site Visits",                val:siteVisits,             tgt:Math.round(paceTarget(tgt.site_visit[s]))},
          {lbl:"Existing Employer Calls",    val:existingEmployerCalls,  tgt:Math.round(paceTarget(tgt.employer_call[s]))},
          {lbl:"New Employer Calls",         val:newEmployerCalls,       tgt:0},
          {lbl:"New Employers Added",        val:newEmployersAdded,      tgt:Math.round(paceTarget(tgt.new_employer_db[s]))},
          {lbl:"Total Contacts Attempted",   val:totalContactsAttempted, tgt:0},
          {lbl:"Meaningful Contacts",        val:callsMeaningful,        tgt:0},
          {lbl:"New Student Leads",          val:leads,                  tgt:Math.round(paceTarget(tgt.lead_generated[s]))},
          {lbl:"Events",                     val:events,                 tgt:Math.round(paceTarget(tgt.event[s]))},
          {lbl:"New Opportunity",            val:newOpportunity,         tgt:0},
        ].map(k=>{
          const onPace = k.tgt===0 || k.val>=k.tgt;
          const col = k.val===0?"var(--tm)":onPace?"var(--greent)":"var(--redt)";
          return `<div style="background:var(--s1);border-radius:var(--r);padding:8px;text-align:center;border:.5px solid var(--bd)">
            <div style="font-size:20px;font-weight:700;color:${col}">${k.val}</div>
            <div style="font-size:10px;color:var(--tm)">${k.lbl}</div>
            ${k.tgt>0?`<div style="font-size:10px;color:${onPace?"var(--greent)":"var(--redt)"}">pace: ${k.tgt}</div>`:""}
          </div>`;
        }).join("")}
      </div>

      <!-- Opportunities & pipeline -->
      ${oppsGenerated>0||pipelineProgressed>0||followupsClosed>0?`
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        ${oppsGenerated>0?`<span style="background:var(--green);color:var(--greent);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">⭐ ${oppsGenerated} opp${oppsGenerated>1?"s":""}</span>`:""}
        ${pipelineProgressed>0?`<span style="background:var(--o2);color:var(--o2t);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">↑ ${pipelineProgressed} pipeline moved</span>`:""}
        ${followupsClosed>0?`<span style="background:var(--o1);color:var(--o1t);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">✓ ${followupsClosed} follow-up${followupsClosed>1?"s":""} closed</span>`:""}
      </div>`:""}

      <!-- EOD summary -->
      ${day.eodResult?`<div style="background:var(--s1);border-radius:var(--r);padding:10px 12px;border-left:3px solid var(--hdr);font-size:12px">
        <div style="font-weight:600;color:var(--hdr);margin-bottom:4px"><i class="ti ti-checklist"></i> EOD Result</div>
        <div style="color:var(--ts)">${day.eodResult}</div>
        ${day.eodTomorrow?`<div style="margin-top:6px;color:var(--tm)"><i class="ti ti-arrow-right"></i> Tomorrow: ${day.eodTomorrow}</div>`:""}
      </div>`:`<div style="color:var(--tm);font-size:12px;padding:8px 0"><i class="ti ti-clock"></i> EOD review not yet completed</div>`}

      <!-- 2026-08-06: off-pace explanation — only present when this day
           was behind a daily KR target and the coordinator explained why
           at EOD (see computeDailyPaceDetails/saveEOD). -->
      ${day.eodOffPaceNote?`<div style="background:#faeeda;border-radius:var(--r);padding:10px 12px;border-left:3px solid #eda100;font-size:12px;margin-top:8px">
        <div style="font-weight:600;color:#633806;margin-bottom:4px"><i class="ti ti-gauge"></i> Off-pace explanation</div>
        <div style="color:var(--ts)">${day.eodOffPaceNote}</div>
      </div>`:""}

      <!-- Activities log (expandable) -->
      ${(()=>{
        // 2026-08-06: "+N more — tap to view all" used to call
        // switchToCoord() + jump to the Today tab — that took the manager
        // OFF the Manager Dashboard entirely, into that coordinator's own
        // tracker view. Now expands the SAME card in place instead, via a
        // per-coordinator toggle (same S.<x>Expanded pattern as the Due
        // Today card), so the manager stays on the dashboard.
        S.dashActsExpanded = S.dashActsExpanded || {};
        const expanded = !!S.dashActsExpanded[coord];
        const shown = expanded ? acts : acts.slice(0,3);
        return acts.length>0 ? `
      <div style="margin-top:10px">
        <div style="font-size:11px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Activity log (${acts.length})</div>
        ${shown.map(a=>renderActItem(a,coord)).join("")}
        ${acts.length>3?`<div style="font-size:12px;color:var(--tm);text-align:center;padding:4px;cursor:pointer" onclick="S.dashActsExpanded['${coord}']=!S.dashActsExpanded['${coord}'];render()">${expanded?"Show less":`+${acts.length-3} more — tap to view all`}</div>`:""}
      </div>` : `<div style="color:var(--tm);font-size:12px;padding:8px 0"><i class="ti ti-circle-dashed"></i> No activities logged today</div>`;
      })()}
    </div>`;
  });

  return h||`<div class="card"><div class="muted small">No data for this date.</div></div>`;
}

// ── Rolling week-on-week trend dashboard ──────────────────────────────────
function renderTrendDashboard() {
  const coordsToShow = S.dashFilter.coord==="all" ? COORDS : [S.dashFilter.coord];

  // Build weeks from trendFrom to trendTo — latest first
  const trendFrom = mondayOf(S.trendFrom || addWeeks(S.date,-7));
  const trendTo   = mondayOf(S.trendTo   || S.date);
  const weeks = [];
  let cur = new Date(trendTo+"T12:00:00");
  const fromDate = new Date(trendFrom+"T12:00:00");
  while (cur >= fromDate && weeks.length < 52) {
    weeks.push(cur.toISOString().substring(0,10));
    cur.setDate(cur.getDate()-7);
  }

  // Key metrics to trend
  const TREND_METRICS = [
    {key:"commencement",    label:"Commencements",         fn:function(T){return T.commencement;}},
    {key:"registration",    label:"Registrations",         fn:function(T){return T.registration;}},
    {key:"call_attempted",  label:"Calls attempted",       fn:function(T){return T.call_attempted;}},
    {key:"call_meaningful", label:"Meaningful convs",      fn:function(T){return T.call_meaningful;}},
    {key:"site_employers",  label:"Site visits",           fn:function(T){return T.site_employers;}},
    {key:"acap_contact",    label:"ACAP contacts",         fn:function(T){return T.acap_contact_attempted;}},
    {key:"opp_generated",   label:"Opportunities",         fn:function(T){return T.opp_generated;}},
    {key:"pipeline_prog",   label:"Pipeline progressed",   fn:function(T){return T.pipeline_progressed;}},
    {key:"new_employer_met",label:"New employers met",     fn:function(T){return T.new_employer_met;}},
    {key:"lead",            label:"Student leads",         fn:function(T){return T.lead;}},
    {key:"followup_overdue",label:"Overdue follow-ups",    fn:function(T){return T.followup_overdue;}, warn:true},
    {key:"days_productive", label:"Productive days",       fn:function(T){return T.days_productive;}},
  ];

  // Pre-calculate totals for each coord and week
  const data = {};
  coordsToShow.forEach(function(coord) {
    data[coord] = {};
    weeks.forEach(function(mon) {
      data[coord][mon] = weeklyTotals(coord, mon);
    });
  });

  let h = "";

  // If all coords shown — render combined team trend table
  if (S.dashFilter.coord === "all") {
    h += `<div class="card">
      <div class="card-title"><i class="ti ti-trending-up"></i> Team — Week on Week Trend</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <th style="text-align:left;padding:6px 8px;background:var(--hdr);color:#fff;min-width:130px">Metric</th>
          <th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff">Trend</th>
          ${weeks.map(function(mon){
            return `<th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff;white-space:nowrap">${fmtDateShort(mon)}</th>`;
          }).join("")}
        </tr>
        ${TREND_METRICS.map(function(metric, mi) {
          const rowBg = mi%2===0?"var(--s1)":"#fff";
          const vals = weeks.map(function(mon) {
            return coordsToShow.reduce(function(sum,coord){ return sum + metric.fn(data[coord][mon]); }, 0);
          });
          const latest = vals[0];
          const prev   = vals[1]||0;
          const trend  = latest > prev ? "↑" : latest < prev ? "↓" : "→";
          const trendCol = metric.warn
            ? (latest>prev?"var(--redt)":latest<prev?"var(--greent)":"var(--tm)")
            : (latest>prev?"var(--greent)":latest<prev?"var(--redt)":"var(--tm)");
          const max = Math.max(...vals, 1);

          return `<tr>
            <td style="padding:6px 8px;font-weight:600;background:${rowBg};color:${metric.warn?"var(--redt)":"var(--tp)"}">${metric.label}</td>
            <td style="text-align:center;padding:6px 4px;background:${rowBg};font-size:16px;font-weight:700;color:${trendCol}">${trend}</td>
            ${vals.map(function(v, vi) {
              const isLatest = vi === 0;
              const barH = Math.round((v/max)*24);
              // Team table - RAG vs combined target across all shown coords
              const combinedTgt = coordsToShow.reduce(function(sum,coord){
                const s=STATES[coord], t=WEEKLY_TARGETS;
                const tk = metric.warn?0:
                  metric.label==="Commencements"?t.commencement[s]:
                  metric.label==="Registrations"?t.registration[s]:
                  metric.label==="Calls attempted"?t.employer_call[s]:
                  metric.label==="Site visits"?t.site_visit[s]:
                  metric.label==="ACAP contacts"?t.acap_contact[s]:
                  metric.label==="New employers met"?t.new_employer_met[s]:
                  metric.label==="Student leads"?t.lead_generated[s]:0;
                return sum+tk;
              },0);
              let tCellBg, tCellTxt, tBarCol;
              if (metric.warn) {
                tCellBg = v===0?"var(--green)":v<=3?"var(--amber)":"var(--red)";
                tCellTxt = v===0?"var(--greent)":v<=3?"var(--ambert)":"var(--redt)";
                tBarCol = tCellTxt;
              } else if (combinedTgt>0) {
                const pct=v/combinedTgt;
                if(pct>=1)     {tCellBg="var(--green)";tCellTxt="var(--greent)";tBarCol="var(--greent)";}
                else if(pct>=0.7){tCellBg="var(--amber)";tCellTxt="var(--ambert)";tBarCol="var(--ambert)";}
                else if(v>0)   {tCellBg="var(--red)";  tCellTxt="var(--redt)";  tBarCol="var(--redt)";  }
                else           {tCellBg=rowBg;          tCellTxt="var(--tm)";    tBarCol="var(--bd)";    }
              } else {
                tCellBg=rowBg; tCellTxt=v===0?"var(--tm)":"var(--tp)"; tBarCol=v===0?"var(--bd)":"var(--hdr2)";
              }
              return `<td style="text-align:center;padding:3px;background:${isLatest?tCellBg:rowBg};vertical-align:bottom;border-radius:${isLatest?4:0}px">
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
                  <div style="font-size:11px;font-weight:${isLatest?700:400};color:${isLatest?tCellTxt:v===0?"var(--tm)":"var(--tp)"}">${v}</div>
                  <div style="width:20px;height:${Math.max(barH,2)}px;background:${isLatest?tBarCol:v===0?"var(--bd)":"#ccc"};border-radius:2px"></div>
                </div>
              </td>`;
            }).join("")}
          </tr>`;
        }).join("")}
      </table>
      </div>
    </div>`;
  }

  // Per-coordinator trend cards
  coordsToShow.forEach(function(coord) {
    const state = STATES[coord];
    h += `<div class="card">
      <div class="card-title"><i class="ti ti-user-circle"></i> ${coord} — ${state} · Week on Week</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <th style="text-align:left;padding:6px 8px;background:var(--hdr);color:#fff;min-width:130px">Metric</th>
          <th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff">Trend</th>
          ${weeks.map(function(mon){
            return `<th style="text-align:center;padding:6px 4px;background:var(--hdr);color:#fff;white-space:nowrap">${fmtDateShort(mon)}</th>`;
          }).join("")}
        </tr>
        ${TREND_METRICS.map(function(metric, mi) {
          const rowBg = mi%2===0?"var(--s1)":"#fff";
          const vals = weeks.map(function(mon){ return metric.fn(data[coord][mon]); });
          const latest = vals[0];
          const prev   = vals[1]||0;
          const trend  = latest > prev ? "↑" : latest < prev ? "↓" : "→";
          const trendCol = metric.warn
            ? (latest>prev?"var(--redt)":latest<prev?"var(--greent)":"var(--tm)")
            : (latest>prev?"var(--greent)":latest<prev?"var(--redt)":"var(--tm)");
          const max = Math.max(...vals, 1);
          const tgt = WEEKLY_TARGETS;
          const weeklyTgt = metric.key==="commencement"?tgt.commencement[state]:
                            metric.key==="registration"?tgt.registration[state]:
                            metric.key==="call_attempted"?tgt.employer_call[state]:
                            metric.key==="site_employers"?tgt.site_visit[state]:
                            metric.key==="acap_contact"?tgt.acap_contact[state]:
                            metric.key==="new_employer_met"?tgt.new_employer_met[state]:
                            metric.key==="lead"?tgt.lead_generated[state]:0;

          return `<tr>
            <td style="padding:6px 8px;font-weight:600;background:${rowBg};color:${metric.warn?"var(--redt)":"var(--tp)"}">${metric.label}${weeklyTgt?`<div style="font-size:10px;color:var(--tm);font-weight:400">target: ${weeklyTgt}</div>`:""}
            </td>
            <td style="text-align:center;padding:6px 4px;background:${rowBg};font-size:16px;font-weight:700;color:${trendCol}">${trend}</td>
            ${vals.map(function(v, vi) {
              const isLatest = vi === 0;
              const barH = Math.round((v/max)*28);
              // RAG colouring vs weekly target
              let cellBg, cellTxt, barCol;
              if (metric.warn) {
                // Overdue follow-ups — inverse RAG (more = worse)
                cellBg = v===0?"var(--green)":v<=2?"var(--amber)":"var(--red)";
                cellTxt = v===0?"var(--greent)":v<=2?"var(--ambert)":"var(--redt)";
                barCol = v===0?"var(--greent)":v<=2?"var(--ambert)":"var(--redt)";
              } else if (weeklyTgt>0) {
                const pct = v/weeklyTgt;
                if (pct>=1)    { cellBg="var(--green)"; cellTxt="var(--greent)"; barCol="var(--greent)"; }
                else if(pct>=0.7){ cellBg="var(--amber)"; cellTxt="var(--ambert)"; barCol="var(--ambert)"; }
                else if(v>0)   { cellBg="var(--red)";   cellTxt="var(--redt)";   barCol="var(--redt)";   }
                else           { cellBg=rowBg;           cellTxt="var(--tm)";     barCol="var(--bd)";     }
              } else {
                // No target — neutral colouring, darker if higher
                cellBg = rowBg; cellTxt = v===0?"var(--tm)":"var(--tp)"; barCol = v===0?"var(--bd)":"var(--hdr2)";
              }
              return `<td style="text-align:center;padding:3px;background:${isLatest?cellBg:rowBg};vertical-align:bottom;border-radius:${isLatest?4:0}px">
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
                  <div style="font-size:11px;font-weight:${isLatest?700:400};color:${isLatest?cellTxt:v===0?"var(--tm)":"var(--tp)"}">${v}</div>
                  <div style="width:20px;height:${Math.max(barH,2)}px;background:${isLatest?barCol:v===0?"var(--bd)":"#ccc"};border-radius:2px"></div>
                </div>
              </td>`;
            }).join("")}
          </tr>`;
        }).join("")}
      </table>
      </div>
    </div>`;
  });

  return h;
}

// Gathers activities for the given coordinators/dates and applies the
// active dashboard filters. Excludes the same auto-generated rows the
// rest of the app already excludes from counts/logs (auto_fu_, auto_acap_,
// sl_ prefixes).
function getFilteredDashboardActivities(coordsToShow, dates){
  const ds = S.dashFilter;
  const out = [];
  coordsToShow.forEach(function(coord){
    dates.forEach(function(d){
      const day = loadDay(coord, d);
      realDayActivities(day).forEach(function(a){
        if (ds.activityType && a.type!==ds.activityType) return;
        if (ds.outcome && a.activityOutcome!==ds.outcome) return;
        if (ds.relType && a.relType!==ds.relType) return;
        if (ds.pipelineStage && a.newStage!==ds.pipelineStage && a.prevStage!==ds.pipelineStage) return;
        if (ds.overdueOnly && !(a.followUpDate && isOverdue(a.followUpDate) && a.status!=="Completed" && a.status!=="Closed")) return;
        out.push({coord:coord, act:a});
      });
    });
  });
  return out;
}

// Only renders (and only costs anything) when at least one filter beyond
// coordinator/date is active — keeps the dashboard's default view exactly
// as it was before this was added.
function renderFilteredActivityLog(coordsToShow, dates){
  const ds = S.dashFilter;
  if (!(ds.activityType||ds.outcome||ds.relType||ds.pipelineStage||ds.overdueOnly)) return "";
  const results = getFilteredDashboardActivities(coordsToShow, dates);
  return `<div class="card">
    <div class="card-title"><i class="ti ti-filter"></i> Filtered activity log (${results.length})</div>
    ${results.length===0 ? `<div class="muted small">No activities match the current filters for this period.</div>` :
      results.map(function(r){
        return `<div style="font-size:11px;color:var(--tm);font-weight:600;margin:8px 0 2px">${r.coord}</div>` + renderActItem(r.act, r.coord);
      }).join("")}
  </div>`;
}

async function debugMergeFollowups(){
  const coord=S.user.coord, state=STATES[coord];
  const url=WEBAPP_URL+"?action=get_followups&coord="+encodeURIComponent(coord)+"&state="+state;
  let data;
  try{
    data=await jsonpFetch(url);
  }catch(e){ alert("Fetch failed: "+e.message); return; }
  if(!data.ok){ alert("Server error: "+(data.msg||"unknown")); return; }

  const list=data.followups||[];
  let ok=0, failed=[], skippedNoDate=0;
  list.forEach(a=>{
    try{
      if(!a.date){ skippedNoDate++; return; }
      const day=loadDay(coord, a.date);
      if(!day.activities) day.activities=[];
      const idx=day.activities.findIndex(x=>x.id===a.id);
      if(idx>=0) day.activities[idx]=a; else day.activities.push(a);
      saveDay(day);
      ok++;
    }catch(e){
      failed.push(a.type+" | "+a.id+" | ERROR: "+e.message);
    }
  });

  let cacheError = "";
  try{
    localStorage.setItem(PFX+"followups:"+coord,JSON.stringify(list));
  }catch(e){
    cacheError = e.message;
  }

  const byType={};
  list.forEach(a=>{ byType[a.type]=(byType[a.type]||0)+1; });

  alert(
    "Total fetched: "+list.length+" ("+Object.keys(byType).map(t=>t+":"+byType[t]).join(", ")+")\n"+
    "Successfully merged: "+ok+"\n"+
    "Skipped (no date field): "+skippedNoDate+"\n"+
    "Failed with error: "+failed.length+"\n"+
    (failed.length ? "\n"+failed.slice(0,10).join("\n")+"\n" : "")+
    "\nFinal cache write: "+(cacheError ? "FAILED — "+cacheError : "OK")
  );
  render();
}

function debugDueToday(){
  const coord=S.user.coord;
  const _cd = S.date||TODAY;
  const days = allDays(coord);

  const fromDays=[];
  days.forEach(d=>{
    const day=loadDay(coord,d);
    (day.activities||[]).forEach(a=>{
      if(a.followUpDate===_cd) fromDays.push(a.type+" | "+a.id+" | status="+a.status+" | bucket="+d);
    });
  });

  const fromCache=[];
  try{
    const cf=localStorage.getItem(PFX+"followups:"+coord);
    if(cf) JSON.parse(cf).forEach(a=>{
      if(a.followUpDate===_cd) fromCache.push(a.type+" | "+a.id+" | status="+a.status);
    });
  }catch(e){}

  const finalResult = getAllDueToday(coord);
  const byType={};
  finalResult.forEach(f=>{ byType[f.type]=(byType[f.type]||0)+1; });

  alert(
    "Selected date (S.date||TODAY): "+_cd+"\n"+
    "System TODAY constant: "+TODAY+"\n"+
    "Known local day-keys: "+days.length+"\n\n"+
    "From day.activities, matching date ("+fromDays.length+"):\n"+fromDays.join("\n")+"\n\n"+
    "From followups cache, matching date ("+fromCache.length+"):\n"+fromCache.join("\n")+"\n\n"+
    "FINAL getAllDueToday() result: "+finalResult.length+"\n"+
    Object.keys(byType).map(t=>t+": "+byType[t]).join("\n")
  );
}

// ── Debug: fetch raw follow-ups via the app's own code path ─────────────
// Uses jsonpFetch (same function pullFollowups uses) so results are directly
// comparable across devices — no browser-tab auth/caching confounds like
// navigating to the raw exec URL directly can introduce.
async function debugFollowups(){
  const coord=S.user.coord, state=STATES[coord];
  const url=WEBAPP_URL+"?action=get_followups&coord="+encodeURIComponent(coord)+"&state="+state;
  try{
    const data=await jsonpFetch(url);
    if(!data.ok){ alert("Server error: "+(data.msg||"unknown")); return; }
    const list=data.followups||[];
    const byType={};
    list.forEach(f=>{ byType[f.type]=(byType[f.type]||0)+1; });
    const typeLines=Object.keys(byType).map(t=>t+": "+byType[t]).join("\n");
    const idLines=list.map(f=>f.type+" | "+f.id+" | due "+f.followUpDate).join("\n");
    alert(
      "Coord: "+coord+"\n"+
      "Total: "+data.count+"\n\n"+
      "By type:\n"+typeLines+"\n\n"+
      "All entries:\n"+idLines
    );
  }catch(e){
    alert("Fetch failed: "+e.message);
  }
}

      const neCache=getEmployerCache(S.user.coord).filter(function(e){
        return NEW_EMPLOYER_STAGE_RELS.includes((e.empRelationship||"").trim());
      });
      const neGroups=groupByOrg(neCache,"bizName");
      const neInitialGroup=neGroups.find(function(g){return g.name.trim().toLowerCase()===(data.bizName||"").trim().toLowerCase();});
      fields+='<div class="field"><label>Business name<span class="req">*</span></label>'+
        '<input id="ne_biz" list="ne_biz_list" value="'+(data.bizName||"").replace(/"/g,"&quot;")+'"'+
        ' oninput="onNeBizInput(this.value)" placeholder="Type or select a new-prospect employer..." required>'+
        '<datalist id="ne_biz_list">'+
        neGroups.map(orgDatalistOptionHtml).join("")+
        '</datalist>'+
        '<div id="ne_emp_hint" style="font-size:11px;color:var(--o2t);margin-top:4px">'+orgHintLinesHtml(neInitialGroup)+'</div></div>';
      fields+='<div id="ne_contact_container">'+neContactFieldHtml(neInitialGroup,data.contactName||"")+'</div>';
      fields+='<input type="hidden" id="ne_contact" value="'+(data.contactName||"").replace(/"/g,"&quot;")+'">';
    } else {
      fields+=fld("Business name","ne_biz","text",data.bizName||"",null,"true");
      fields+=fld("Contact person","ne_contact","text",data.contactName||"",null,"true");
    }
    fields+=fld("Position","ne_position","text",data.position||"");
    fields+=fld("Employer relationship","ne_rel","select",data.relType||"",[""].concat(REL_TYPES),"true");
    fields+=fldRow([
      fld("Email","ne_email","email",data.email||""),
      fld("Phone","ne_phone","tel",data.phone||""),
    ]);
    fields+=fldRow([
      fld("Region","ne_region","text",data.suburb||""),
      fld("Postcode","ne_postcode","text",data.postcode||""),
    ]);
    fields+=fld("State","ne_state","select",data.studentState||"",[""].concat(Object.values(STATES).filter((v,i,a)=>a.indexOf(v)===i)));
    // New-list item 4: this tile creates the brand-new employer WIP row
    // directly (see updateEmployerDatabase's new-org/new-contact branches),
    // so Website/Facebook/Instagram/Address are genuinely required to
    // complete the record per the WIP — previously only collected via the
    // Employer Call/Site Visit "+new contact" section, never here.
    fields+=fld("Address","ne_address","text",data.address||"");
    fields+=fldRow([
      fld("Website","ne_website","text",data.website||""),
      fld("Facebook","ne_facebook","text",data.facebook||""),
    ]);
    fields+=fld("Instagram","ne_instagram","text",data.instagram||"");
    // Follow-up: "Site Visit - New Employer" (new_employer_met) previously had
    // no Activity Outcome field at all — added using the same pruned
    // SITE_VISIT_OUTCOMES list as the Existing Employer site visit tile
    // (Sign-up/Registration outcomes are tracked via the Pipeline tiles, not
    // a site visit log). "Add Employer" (new_employer_db/add_employer) keeps
    // the full ACTIVITY_OUTCOMES list — it's a DB-entry tile, not a visit log.
    fields+=fld("Activity outcome","ne_outcome","select",data.activityOutcome||"",
      [""].concat(type==="new_employer_met"?SITE_VISIT_OUTCOMES:ACTIVITY_OUTCOMES),"true");
    fields+=fld("Profile Builder","ne_profile","textarea",data.profileNotes||"");
  }

  // ── PIPELINE ───────────────────────────────────────────────────────────
  if(type==="enrolment_pipeline"){
    fields+='<div class="field" style="position:relative">'+
      '<label>Student name<span class="req">*</span></label>'+
      '<input id="ep_name" value="'+(data.studentName||"").replace(/"/g,"&quot;")+'" '+
      'oninput="onEpNameInput(this.value)" onfocus="onEpNameFocus()" onblur="hideEpDropdownDelayed()" '+
      'placeholder="Tap to select or type student name..." autocomplete="off" required>'+
      '<div id="ep_name_dropdown" class="ep-dropdown hidden"></div>'+
      '<div id="ep_name_hint" style="font-size:11px;color:var(--o2t);margin-top:4px"></div></div>';
    // Batch 8 item 7 — same pattern as Registration Pipeline above.
    fields+='<input type="hidden" id="ep_contact_id" value="">';
    fields+='<div id="ep_newfields" style="display:none;border:1px dashed var(--bd, #ccc);border-radius:var(--r);padding:8px;margin-bottom:8px;background:var(--bg2, #f7f7f7)">'+
      '<div class="small muted" style="margin-bottom:4px">New student — complete for a full record:</div>'+
      newContactFieldsHtml("ep_newfields","student")+'</div>';
    // 2026-07-30 bugfix: the submit builder already read "ep_state" (see
    // act.studentState=g("ep_state") below), but no field with that id was
    // ever built — the read always silently returned "". Added here to
    // match the sibling "pipeline" tile's own State field.
    fields+=fldRow([
      fld("State","ep_state","select",data.studentState||"",["",...Object.values(STATES).filter((v,i,a)=>a.indexOf(v)===i)]),
      fld("Trade / qualification","ep_trade","select",data.trade||"",["",...TRADE_OPTIONS]),
    ]);
    fields+=fldRow([
      fld("Previous stage","ep_prev","select",data.prevStage||"",["",...PIPELINE_STAGES]),
      fld("New stage","ep_new","select",data.newStage||"",["",...PIPELINE_STAGES],"true"),
    ]);
    fields+=fld("Outcome","ep_contact","select",data.contactOutcome||"",["",...ENROLMENT_CONTACT_OUTCOMES],"true");
    fields+=fld("Barrier to enrolment","ep_barrier","text",data.barrier||"");
    fields+=fld("Action completed today","ep_action","textarea",data.actionToday||"",null,"true");
  }

  if(type==="pipeline"){
    fields+=fld("Lead / student name","pl_name","text",data.leadName||"",null,"true");
    fields+=fldRow([
      fld("State","pl_state","select",data.state||"",["",...Object.values(STATES).filter((v,i,a)=>a.indexOf(v)===i)]),
      fld("Trade / qualification","pl_trade","select",data.trade||"",["",...TRADE_OPTIONS]),
    ]);
    fields+=fldRow([
      fld("Previous stage","pl_prev","select",data.prevStage||"",[""].concat(PIPELINE_STAGES)),
      fld("New stage","pl_new","select",data.newStage||"",[""].concat(PIPELINE_STAGES),"true"),
    ]);
    fields+=fld("Outcome","pl_contact","select",data.contactOutcome||"",[""].concat(CALL_OUTCOMES));
    fields+=fld("Pipeline type","pl_pipeline_type","select",data.pipelineType||"",["","Student Lead","Enrolment Pipeline"],"true");
    fields+=fld("Barrier to registration","pl_barrier","text",data.barrier||"");
    fields+=fld("Action completed today","pl_action","textarea",data.actionToday||"",null,"true");
    fields+=fld("Expected registration date","pl_expreg","date",data.expectedReg||"");
  }

  // ── COMMON FIELDS ──────────────────────────────────────────────────────
  // Next action & follow-up (for most types)
  if(needsFollowup){
    fields+=`<hr class="divider">`;
    fields+=fld("Next action","cm_next","text",data.nextAction||"",null,"true");
    fields+=fldRow([
      fld("Follow-up date","cm_fudate","date",data.followUpDate||""),
      fld("Responsible","cm_resp","select",data.responsible||S.user.coord,COORDS),
    ]);
    fields+=fld("Status","cm_status","select",data.status||"Open",["Open","Completed","On hold","Closed"]);
  }
  fields+=fld("Notes","cm_notes","textarea",data.notes||"");

  return `<div class="modal-bg">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-plus"></i> ${titles[type]||type}</div>
    <div id="modal_errors"></div>
    ${fields}
    <div style="display:flex;gap:8px;margin-top:16px">
      <button onclick="saveActivityFromModal('${type}')" class="btn-primary" style="flex:1" ${S.savingActivity?"disabled":""}>${S.savingActivity?"Saving…":"Save"}</button>
      <button onclick="closeModal()" class="btn-ghost">Cancel</button>
    </div>
  </div></div>`;
}

// Inline validation errors — 2026-07-28: previously a blocking alert()
// popup. Injects into the already-open modal DOM in place (no re-render),
// so the user's already-typed field values are never lost.
function showModalErrors(errors){
  const el = document.getElementById("modal_errors");
  if(!el){ alert(errors.join("\n")); return; } // fallback if modal structure ever changes
  el.innerHTML = errors.length ? (
    '<div style="background:var(--red);color:var(--redt);padding:10px 12px;border-radius:var(--r);font-size:12px;font-weight:600;margin-bottom:12px">'+
    '⚠ Please fix the following before saving:<ul style="margin:6px 0 0 18px;padding:0;font-weight:400">'+
    errors.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>'
  ) : '';
  if(errors.length) el.scrollIntoView({behavior:"smooth",block:"start"});
}
// Basic format checks — 2026-07-28: previously no email/phone format
// validation existed anywhere in the form.
function isValidEmail_(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function isValidPhone_(v){ return !v || /^[0-9+()\s-]{6,20}$/.test(v); }

// Field builder helpers
function fld(label,id,type,val,options,required){
  // options = array of option values (for select), or null/undefined for other types
  // required = "true" string or truthy value
  const req=required?`<span class="req">*</span>`:"";
  let input;
  if(type==="select"){
    const optArr=Array.isArray(options)?options:[];
    const opts=optArr.map(o=>`<option value="${o}"${val===o?" selected":""}>${o||"— Select —"}</option>`).join("");
    input=`<select id="${id}" ${required?"required":""}>${opts}</select>`;
  } else if(type==="textarea"){
    input=`<textarea id="${id}" placeholder="${label}..." ${required?"required":""}>${val||""}</textarea>`;
  } else {
    input=`<input id="${id}" type="${type}" value="${val||""}" placeholder="${label}..." ${required?"required":""}>`;
  }
  return `<div class="field"><label>${label}${req}</label>${input}</div>`;
}
function fldRow(fields){
  return `<div class="field-row">${fields.join("")}</div>`;
}

function saveFocus(){
  const v=document.getElementById("focus_sel")?.value;
  const day=getDay(); day.focus=v; saveDay(day);
  // FIXED 2026-08-06: previously local-only, the same silent sync gap
  // already found and fixed for saveNote()/saveEOD() — now that Primary
  // focus lives in Daily Notes and gates "Mark day complete" via
  // focusOutline/focusShortfallReason, it needs to reach the cloud
  // reliably like everything else in that flow.
  S.unsyncedChanges=true; schedulePush();
  render();
}
function saveFocusOther(){
  const v=document.getElementById("focus_other")?.value||"";
  const day=getDay(); day.focusOther=v; saveDay(day);
  S.unsyncedChanges=true; schedulePush(); // FIXED 2026-08-06 — see saveFocus()
}
// 2026-08-06: saves the Daily Notes primary-focus follow-up — whichever of
// the two fields is currently applicable (outline when today's activity
// met the focus's minimum, shortfall reason when it didn't; see
// computeFocusThresholdMet/renderDailyNotes).
function saveFocusFollowup(field,val){
  const day=getDay();
  if(field==="outline") day.focusOutline=val;
  else if(field==="shortfall") day.focusShortfallReason=val;
  saveDay(day);
  S.unsyncedChanges=true; schedulePush();
}
function saveNote(field,val){
  // 2026-08-06: previously saved local-only — this never set
  // S.unsyncedChanges, so schedulePush()'s 3s debounce and the 5-minute
  // fallback timer (both gated on that flag) would never fire for a
  // Wins/Blockers/Pipeline/Campaign note on its own. It only ever reached
  // the cloud if some UNRELATED action in the same session happened to
  // trigger a sync afterwards — a coordinator who only touched Daily
  // Notes all day could go the whole day without these ever syncing.
  // Fixed to match the same reliable-sync pattern used everywhere else
  // (e.g. addRisk/updateRisk/deleteRisk).
  const day=getDay(); day[field]=val; saveDay(day);
  S.unsyncedChanges=true; schedulePush();
}

// 2026-08-06: Risk section (Daily Summary → rolls up into the Weekly
// Summary's Risk section). Unlike saveNote above, these deliberately set
// S.unsyncedChanges and call schedulePush() — a risk entry is exactly the
// kind of record that needs to reach the cloud (and be visible to a
// manager) reliably, not sit local-only until some unrelated action
// happens to trigger a sync.
function addRisk(){
  const day=getDay();
  day.risks=day.risks||[];
  day.risks.push({issue:"",department:"",action:"",outcome:""});
  saveDay(day);
  S.unsyncedChanges=true; schedulePush();
  render();
}
function updateRisk(idx,field,val){
  const day=getDay();
  day.risks=day.risks||[];
  if(!day.risks[idx]) return;
  day.risks[idx][field]=val;
  saveDay(day);
  S.unsyncedChanges=true; schedulePush();
}
function deleteRisk(idx){
  const day=getDay();
  day.risks=day.risks||[];
  day.risks.splice(idx,1);
  saveDay(day);
  S.unsyncedChanges=true; schedulePush();
  render();
}
function saveEOD(field,val){
  const day=getDay();
  if(field==="result") day.eodResult=val;
  else if(field==="tomorrow") day.eodTomorrow=val;
  else if(field==="entered") day.eodAllEntered=val;
  else if(field==="offPaceNote") day.eodOffPaceNote=val; // 2026-08-06 — see the "Needs attention" gate below
  else if(field==="status"){
    // 2026-07-28: "Day complete" previously could be set with the
    // "all entered?" declaration left unanswered and no result recorded —
    // the spec asked for this as a genuine required Y/N declaration, not
    // just a stored-but-unenforced field.
    if(val==="complete"){
      const eodErrs=[];
      if(!day.eodResult||!day.eodResult.trim()) eodErrs.push("Please record what result today's activity created before marking the day complete.");
      if(!day.eodAllEntered) eodErrs.push('Please answer "All activities and follow-ups entered and current?" before marking the day complete.');
      // 2026-08-06 — Bec: "move the Primary focus function from the today
      // tab to the daily notes section and update to: what was your
      // primary focus today? apply the same logic on how many should be
      // met to accept it as a primary focus, if not, highlight and ask
      // for a reason as to why ... if it does - ask for a brief outline
      // of that primary focus."
      // UPDATED 2026-08 per Bec: "set the condition for it only to appear
      // when daily pace is not met" — the whole focus section (including
      // this gate) is now skipped entirely on an on-pace day, matching
      // dailyPaceBehindCount(day)===0 not rendering focusSectionHtml at
      // all in renderDailyNotes. Re-read the live form values first (same
      // reasoning as elsewhere in this gate — the coordinator may have
      // just typed/selected without triggering onchange yet).
      if(dailyPaceBehindCount(day)>0){
        const liveFocus = document.getElementById("focus_sel")?.value;
        if(liveFocus!==undefined) day.focus = liveFocus;
        const liveFocusOther = document.getElementById("focus_other")?.value;
        if(liveFocusOther!==undefined) day.focusOther = liveFocusOther;
        if(!day.focus||!day.focus.trim()){
          eodErrs.push("Please select today's primary focus before marking the day complete.");
        } else {
          if(day.focus==="Other" && (!day.focusOther||!day.focusOther.trim())){
            eodErrs.push("Please describe your primary focus before marking the day complete.");
          }
          const focusThreshold = computeFocusThresholdMet(day);
          if(focusThreshold.met){
            const liveOutline = document.getElementById("focus_outline")?.value;
            if(liveOutline!==undefined) day.focusOutline = liveOutline;
            if(!day.focusOutline||!day.focusOutline.trim()){
              eodErrs.push("Please give a brief outline of today's primary focus before marking the day complete.");
            }
          } else {
            const liveShortfall = document.getElementById("focus_shortfall")?.value;
            if(liveShortfall!==undefined) day.focusShortfallReason = liveShortfall;
            if(!day.focusShortfallReason||!day.focusShortfallReason.trim()){
              eodErrs.push(focusThresholdShortfallPrompt(day, focusThreshold));
            }
          }
        }
      }
      // 2026-08-06 — this standalone off-pace explanation gate (added per
      // Bec: "ask as a prompt before closing out the daily summary to give
      // an explanation as to why some areas weren't met") was REMOVED
      // 2026-08 per Bec: "remove - this is redundant now the primary focus
      // is in the same tab" — the Primary Focus shortfall gate above
      // (focusThresholdShortfallPrompt) already asks essentially the same
      // question whenever the coordinator's selected focus is behind, so
      // requiring a second near-identical explanation here was redundant.
      // day.eodOffPaceNote is left in the data model (unused going
      // forward) so already-recorded historical notes keep displaying on
      // the Weekly Summary/Manager Dashboard "Needs attention" rollups.
      if(eodErrs.length){
        const el=document.getElementById("eod_errors");
        if(el) el.innerHTML='<div style="background:var(--red);color:var(--redt);padding:10px 12px;border-radius:var(--r);font-size:12px;font-weight:600;margin-bottom:12px">⚠ '+eodErrs.join('<br>⚠ ')+'</div>';
        else alert(eodErrs.join("\n"));
        return;
      }
    }
    day.eodStatus=val;
  }
  saveDay(day);
  // FIXED 2026-08-06: saveEOD previously never set S.unsyncedChanges, the
  // same silent local-only-save gap already found and fixed once for
  // saveNote() (Daily Notes) — neither the 3s debounced push nor the
  // 5-minute fallback timer (both gated on that flag) would fire for an
  // EOD-only save on its own. That's now specifically a problem for the
  // off-pace explanation above: Bec asked for it to reach the Manager
  // Dashboard, which only ever sees what's actually been pushed to the
  // Sheet — so "Mark day complete" (and every other EOD field) now syncs
  // reliably, matching the same pattern used everywhere else this gap was
  // found and closed.
  S.unsyncedChanges=true; schedulePush();
  render();
}
function saveWeeklyReflection(){
  const wkMon=mondayOf(S.date);

    wr1:document.getElementById("wr1")?.value||"",

  };

  // saved with nothing else logged that session was invisible to BOTH the

  // fires when S.unsyncedChanges is true) — it would sit local-only until
