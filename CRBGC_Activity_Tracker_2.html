function saveActivityFromModal(type){
  // 2026-08-06 (backlog item 2 — "Duplicate Contact Creation"): the Save
  // button had no double-click/double-submit guard anywhere in the
  // tracker. A fast double-click (or a slow network making a user think
  // the first click didn't register) called this function twice, each
  // time generating a fresh uuid() and creating a separate activity —
  // which, for a "+ new contact" employer/ACAP link, meant a separate new
  // contact row on push. This is almost certainly what produced the
  // reported "Carol created eight duplicate records." The lock is reset
  // in a finally so every early-return path (validation errors, backward
  // stage-change not confirmed) still releases it.
  if (S.savingActivity) return;
  S.savingActivity = true;
  try {
    saveActivityFromModal_(type);
  } finally {
    S.savingActivity = false;
  }
}
function saveActivityFromModal_(type){
  const editId = S.modal?.editId || null;
  const editCoord = S.modal?.editCoord || null;
  const editDate = S.modal?.editDate || null;
  const isEdit = !!editId;
  const day = isEdit ? loadDay(editCoord||S.user.coord, editDate||S.date) : getDay();
  const existingAct = isEdit ? (day.activities||[]).find(a=>a.id===editId) : null;
  const act = isEdit && existingAct
    ? {...existingAct}  // copy existing, preserve id and timestamp
    : {id:uuid(), type, timestamp:new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"})};
  const g=(id)=>document.getElementById(id)?.value||"";

  // Collect fields by type
  if(type==="commencement"){
    act.studentName=g("comm_name"); act.studentState=g("sstate"); act.trade=g("strade");
  }
  if(["enrolment","lead"].includes(type)){
    act.studentName=g("sname"); act.studentState=g("sstate"); act.trade=g("strade");
    if(type==="lead"){
      act.mobile=g("slead_mobile"); act.email=g("slead_email");
      act.prevStage=g("slead_prev"); act.newStage=g("slead_new");
      act.contactOutcome=g("slead_outcome");
      // New-list item 5: null when the field's empty (no link intended).
      const sleadLink=readEmployerLink("slead");
      if(sleadLink){ act.employerLink=sleadLink; act.linkedEmployer=sleadLink.name; act.linkedEmployerContact=sleadLink.contactName||""; }
    }
  }
  if(type==="registration"){
    act.studentName=g("reg_name"); act.trade=g("reg_trade"); act.prevStage=g("reg_prev"); act.newStage=g("reg_new");
    act.contactOutcome=g("reg_contact"); act.barrier=g("reg_barrier"); act.actionToday=g("reg_action");
    // Batch 8 item 7: ID-based matching when an existing student was
    // picked; new-contact capture when the typed name matched nobody.
    act.leadContactId=g("reg_contact_id");
    const regNewFields=document.getElementById("reg_newfields");
    if(regNewFields && regNewFields.style.display!=="none"){
      act.newContactDetails=readNewContactFields("reg_newfields");
    }
    // New-list item 5: optional employer link.
    const regLink=readEmployerLink("reg");
    if(regLink){ act.employerLink=regLink; act.linkedEmployer=regLink.name; act.linkedEmployerContact=regLink.contactName||""; }
  }
  if(type==="intro_call"){
    syncIcContact();
    act.bizName=g("ic_biz"); act.contactName=g("ic_contact");
    act.mobile=g("ic_mobile"); act.email=g("ic_email");
    act.regDate=g("sreg"); act.callDate=g("scalldate");
    act.within24h=g("swithin24"); act.callOutcome=g("scallout");
    act.studentName=g("ic_student"); act.trade=g("strade"); act.followUp=g("sfollowup");
    act.profileNotes=g("ic_profile");
    // 2026-07-30 bugfix: Intro Call now reaches the Employer Database (see
    // updateEmployerDatabase), which requires Employer Relationship the
    // same way Employer Call/Site Visit do — same auto-pull/deliberate-
    // edit-only pattern (ic_rel).
    act.relType=g("ic_rel");
    // New-list item 4: same "+new contact" required-fields capture as
    // Employer Call/Site Visit — only present when the picker is showing
    // its new-contact block (i.e. "+ Add new contact" was chosen).
    if(document.getElementById("ic_contact_picker_newfields")&&document.getElementById("ic_contact_picker_newfields").style.display!=="none"){
      act.newContactDetails=readNewContactFields("ic_contact_picker");
    }
    const icEdit=readContactEdit("ic_contact_picker","ic_rel");
    if(Object.keys(icEdit).length) act.contactEdit=icEdit;
  }
  if(type==="add_acap"){ act.acapOrg=g("add_acap_org");act.contactName=g("add_acap_contact");act.position=g("add_acap_position");act.studentState=g("add_acap_state");act.suburb=g("add_acap_region");act.email=g("add_acap_email");act.mobile=g("add_acap_mobile");act.address=g("add_acap_address");act.profileNotes=g("add_acap_profile");
    // New-list item 4: Position/Region/Email/Mobile/Office address were
    // being collected here but never actually reached the WIP — routed
    // through the same newContactDetailsByRowId map addNewAcapContacts now reads.
    act.newContactDetails={position:act.position,region:act.suburb,email:act.email,mobile:act.mobile,address:act.address};
  }
  if(["acap_contact","acap_f2f"].includes(type)){ syncAcapContact(); act.acapOrg=g("acap_org");act.contactName=g("acap_contact");act.activityOutcome=g("acap_outcome");act.profileNotes=g("acap_profile");
    if(document.getElementById("acap_contact_picker_newfields")&&document.getElementById("acap_contact_picker_newfields").style.display!=="none"){
      act.newContactDetails=readNewContactFields("acap_contact_picker");
    }
    // Batch 8 item 11: only present if the coordinator actually edited the
    // pre-filled Email/Mobile for the selected existing contact.
    const acapEdit=readContactEdit("acap_contact_picker");
    if(Object.keys(acapEdit).length) act.contactEdit=acapEdit;
  }
  if(type==="event"){ act.eventName=g("ev_name");act.location=g("ev_loc");act.attendees=g("ev_att");act.activityOutcome=g("ev_outcome"); }
  if(type==="employer_call"){ syncEcContact(); act.bizName=g("ec_biz");act.contactName=g("ec_contact");act.relType=g("ec_rel");act.callOutcome=g("ec_outcome");act.meaningfulDiscussion=g("ec_disc");act.activityOutcome=g("ec_actout");act.profileNotes=g("ec_profile");
    if(document.getElementById("ec_contact_picker_newfields")&&document.getElementById("ec_contact_picker_newfields").style.display!=="none"){
      act.newContactDetails=readNewContactFields("ec_contact_picker");
    }
    // Batch 8 item 11 / new-list item 2: only present if the coordinator
    // actually edited the Email/Phone, or changed the Employer Relationship
    // away from its auto-pulled value, for the selected existing contact.
    const ecEdit=readContactEdit("ec_contact_picker","ec_rel");
    if(Object.keys(ecEdit).length) act.contactEdit=ecEdit;
    // If "Do not contact" — mark employer inactive in WIP immediately
    if(act.callOutcome==="Do not contact — removed from list" && act.bizName){
      postBestEffort({type:"update_employer_followup",coord:S.user.coord,
        bizName:act.bizName,action:"do_not_contact",lastContactDate:S.date||TODAY});
    }
  }
  if(type==="site_visit"){ syncSvContact(); act.bizName=g("sv_biz");act.suburb=g("sv_suburb");act.contactName=g("sv_contact");act.mobile=g("sv_mobile");act.email=g("sv_email");act.trade=g("sv_trade");act.relType=g("sv_rel");act.activityOutcome=g("sv_outcome");act.profileNotes=g("sv_profile");
    if(document.getElementById("sv_contact_picker_newfields")&&document.getElementById("sv_contact_picker_newfields").style.display!=="none"){
      act.newContactDetails=Object.assign({email:act.email,phone:act.mobile},readNewContactFields("sv_contact_picker"));
    }
    // New-list item 2: Employer Relationship is auto-pulled for the selected
    // existing contact (see contactPickerHtml/onContactPickerChange) — only
    // report it as a deliberate edit if the coordinator changed it away from
    // that pulled value. (Site Visit has no email/phone edit block — those
    // fields are always-visible above and only matter for new-contact rows.)
    const svEdit=readContactEdit("sv_contact_picker","sv_rel");
    if(Object.keys(svEdit).length) act.contactEdit=svEdit;
  }
  if(["new_employer_met","new_employer_db","add_employer"].includes(type)){
    if(type==="new_employer_met") syncNeContact();
    act.bizName=g("ne_biz");act.contactName=g("ne_contact");act.position=g("ne_position");
    act.relType=g("ne_rel");act.email=g("ne_email");act.phone=g("ne_phone");
    act.suburb=g("ne_region");act.postcode=g("ne_postcode");act.studentState=g("ne_state");
    act.activityOutcome=g("ne_outcome");act.profileNotes=g("ne_profile");
    act.address=g("ne_address");act.website=g("ne_website");act.facebook=g("ne_facebook");act.instagram=g("ne_instagram");
    // New-list item 4: this tile always creates a brand-new employer row
    // (see updateEmployerDatabase's new-org/new-contact branches, which read
    // newContactDetailsByRowId for these exact keys) — routed the same way
    // as the Employer Call/Site Visit "+new contact" section, just without
    // a picker in front of it since every submission here IS a new record.
    act.newContactDetails={position:act.position,email:act.email,phone:act.phone,
      website:act.website,facebook:act.facebook,instagram:act.instagram,
      region:act.suburb,address:act.address,postcode:act.postcode};
  }
  if(type==="enrolment_pipeline"){ act.studentName=g("ep_name");act.studentState=g("ep_state");act.trade=g("ep_trade");act.prevStage=g("ep_prev");act.newStage=g("ep_new");act.contactOutcome=g("ep_contact");act.barrier=g("ep_barrier");act.actionToday=g("ep_action");act.expectedReg=g("ep_expreg");
    // Batch 8 item 7 — same pattern as Registration Pipeline above.
    act.leadContactId=g("ep_contact_id");
    const epNewFields=document.getElementById("ep_newfields");
    if(epNewFields && epNewFields.style.display!=="none"){
      act.newContactDetails=readNewContactFields("ep_newfields");
    }
  }
  if(type==="pipeline"){ act.leadName=g("pl_name");act.state=g("pl_state");act.trade=g("pl_trade");act.prevStage=g("pl_prev");act.newStage=g("pl_new");act.contactOutcome=g("pl_contact");act.pipelineType=g("pl_pipeline_type");act.barrier=g("pl_barrier");act.actionToday=g("pl_action");act.expectedReg=g("pl_expreg"); }

  // Common
  act.nextAction=g("cm_next"); act.followUpDate=g("cm_fudate");
  act.responsible=g("cm_resp")||S.user.coord; act.status=g("cm_status")||"Open";
  act.notes=g("cm_notes");

  // Validation
  const errors=[];
  // 2026-07-30: full-script audit found several fields marked required on
  // their form (visible "*" / the fld() required flag) with NO matching
  // check here — the "required" attribute is purely cosmetic since this app
  // has no <form>/checkValidity() anywhere, so these were silently
  // submittable blank. Added checks below to match what's actually marked
  // required on each type's form; every addition mirrors the existing
  // pattern for that same field elsewhere in the app.
  if(["commencement","registration","enrolment","lead","enrolment_pipeline"].includes(type) && !act.studentName) errors.push("Student name is required");
  if(type==="lead" && !act.mobile) errors.push("Phone is required");
  if(type==="lead" && !act.email) errors.push("Email is required");
  if(type==="lead" && !act.newStage) errors.push("New stage is required");
  if(type==="registration" && !act.newStage) errors.push("New stage is required");
  if(type==="registration" && !act.contactOutcome) errors.push("Outcome is required");
  if(type==="intro_call" && !act.bizName) errors.push("Employer / business name is required");
  if(type==="intro_call" && !act.contactName) errors.push("Contact person is required");
  if(type==="intro_call" && !act.regDate) errors.push("Registration / assignment date is required");
  if(type==="intro_call" && !act.callDate) errors.push("Intro call date is required");
  if(["acap_contact","acap_f2f","add_acap"].includes(type) && !act.acapOrg) errors.push("ACAP organisation is required");
  if(type==="add_acap" && !act.contactName) errors.push("Contact name is required");
  if(["acap_contact","acap_f2f"].includes(type) && !act.activityOutcome) errors.push("Contact outcome is required for ACAP activities");
  if(["employer_call"].includes(type) && !act.bizName) errors.push("Business name is required");
  if(["employer_call"].includes(type) && !act.callOutcome) errors.push("Call outcome is required");
  if(["employer_call"].includes(type) && !act.relType) errors.push("Employer relationship is required");
  if(["site_visit"].includes(type) && (!act.bizName||!act.suburb||!act.contactName)) errors.push("Business name, suburb and contact name are required");
  if(type==="site_visit" && !act.activityOutcome) errors.push("Activity outcome is required");
  if(["site_visit","new_employer_met","new_employer_db"].includes(type) && !act.relType) errors.push("Employer relationship is required");
  if(["new_employer_met","new_employer_db"].includes(type) && !act.bizName) errors.push("Business name is required");
  if(["new_employer_met","new_employer_db"].includes(type) && !act.contactName) errors.push("Contact person is required");
  if(["new_employer_met","new_employer_db"].includes(type) && !act.activityOutcome) errors.push("Activity outcome is required");
  if(type==="event" && !act.eventName) errors.push("Event name is required");
  if(["intro_call"].includes(type) && !act.relType) errors.push("Employer relationship is required");
  if(["pipeline"].includes(type) && (!act.leadName||!act.newStage)) errors.push("Lead name and new pipeline stage are required");
  if(type==="pipeline" && !act.pipelineType) errors.push("Pipeline type is required");
  if(type==="enrolment_pipeline" && !act.newStage) errors.push("New stage is required");
  if(type==="enrolment_pipeline" && !act.contactOutcome) errors.push("Outcome is required");
  // 2026-08-03: Next Action is now mandatory across every activity type
  // with a follow-up section (everything except Commencement, Enrolment,
  // and Intro Call — those have no next-action concept) — previously only
  // required when the chosen outcome happened to be in
  // ACT_OUTCOME_NEEDS_FOLLOWUP, which left it optional for most entries.
  if(!["commencement","enrolment","intro_call"].includes(type) && !act.nextAction) errors.push("Next action is required");
  // Action Completed Today — mandatory on the 3 forms that already have
  // this field (Registration, Pipeline, Enrolment Pipeline). Not added to
  // other types, which don't have this field on their form at all.
  if(["registration","pipeline","enrolment_pipeline"].includes(type) && !act.actionToday) errors.push("Action completed today is required");
  if(ACT_OUTCOME_NEEDS_FOLLOWUP.includes(act.activityOutcome) && !act.followUpDate) errors.push("Follow-up date is required for this outcome");
  // 2026-07-28: basic format checks — none of these existed before.
  if(!isValidEmail_(act.email)) errors.push("Email address doesn't look valid");
  if(!isValidPhone_(act.mobile)) errors.push("Mobile number doesn't look valid");
  if(!isValidPhone_(act.phone)) errors.push("Phone number doesn't look valid");

  if(errors.length>0){ showModalErrors(errors); return; }
  showModalErrors([]); // clear any previous error banner on a successful pass

  // 2026-07-28: confirm before letting a pipeline-style stage move
  // backward — previously any stage could be silently overwritten either
  // way with no distinction from normal forward progress.
  const STAGE_TYPES = ["registration","lead","enrolment_pipeline","pipeline"];
  if(STAGE_TYPES.includes(type) && act.prevStage && act.newStage && act.prevStage!==act.newStage){
    const EXIT_STAGES = ["On hold","Closed/lost"];
    if(!EXIT_STAGES.includes(act.prevStage) && !EXIT_STAGES.includes(act.newStage)){
      const pIdx = PIPELINE_STAGES.indexOf(act.prevStage), nIdx = PIPELINE_STAGES.indexOf(act.newStage);
      if(pIdx>-1 && nIdx>-1 && nIdx<pIdx){
        const reason = prompt('This moves the stage BACKWARD, from "'+act.prevStage+'" to "'+act.newStage+'". If that\'s intentional, briefly say why (this is added to Notes) — Cancel to go back and re-check the stage:');
        if(reason===null || !reason.trim()){ showModalErrors(["Backward stage change wasn't confirmed — add a reason to proceed, or re-check the selected stage."]); return; }
        act.notes = (act.notes?act.notes+" | ":"")+"Stage reverted "+act.prevStage+" → "+act.newStage+": "+reason.trim();
      }
    }
  }

  if(!day.activities) day.activities=[];
  if(isEdit && editId){
    const idx=day.activities.findIndex(a=>a.id===editId);
    if(idx>=0) day.activities[idx]=act;
    else day.activities.push(act);
  } else {
    day.activities.push(act);
  }
  saveDay(day);

  // If this enrolment pipeline update closes the student out (Enrolled,
  // Registered, etc.), remove any cached follow-up for them immediately —
  // the server-side follow-up date gets cleared too, but without this the
  // stale entry would keep showing in Due Today on this device until the
  // next full cloud refresh happens to run.
  if ((type==="enrolment_pipeline"||type==="registration") && act.newStage && !isStudentLeadOpen(act.newStage) && act.studentName) {
    const closedCoord = editCoord||S.user.coord;
    const closedName = act.studentName.trim().toLowerCase();
    try {
      allDays(closedCoord).forEach(function(d){
        const dd = loadDay(closedCoord, d);
        const before = (dd.activities||[]).length;
        dd.activities = (dd.activities||[]).filter(function(a){
          return !(a.id && a.id.indexOf("sl_")===0 && (a.studentName||a.leadName||"").trim().toLowerCase()===closedName);
        });
        if (dd.activities.length !== before) saveDay(dd);
      });
      const cacheKey = PFX+"followups:"+closedCoord;
      const cf = localStorage.getItem(cacheKey);
      if (cf) {
        const followups = JSON.parse(cf).filter(function(a){
          return !(a.id && a.id.indexOf("sl_")===0 && (a.studentName||a.leadName||"").trim().toLowerCase()===closedName);
        });
        localStorage.setItem(cacheKey, JSON.stringify(followups));
      }
    } catch(e_){}
  }

  S.modal=null;
  S.unsyncedChanges=true;
  S.status={ok:true,msg:`${activityLabel(type)} ${isEdit?"updated":"logged"} — syncing…`};
  schedulePush();
  render();
}

function findActivityAnyDay(coord, id) {
  // Activities rendered in This Week / History may belong to a day other
  // than whatever is currently selected as S.date — search every known
  // day bucket for this coordinator rather than assuming S.date, which
  // previously caused "Activity not found" (edit) or silent no-op (delete)
  // whenever the item being acted on wasn't from the currently-selected day.
  const days = allDays(coord);
  for (const d of days) {
    const day = loadDay(coord, d);
    const act = (day.activities||[]).find(a=>a.id===id);
    if (act) return {day, act, date:d};
  }
  return null;
}

function editActivity(id, coord) {
  const targetCoord = coord || S.user.coord;
  const found = findActivityAnyDay(targetCoord, id);
  if (!found) { alert("Activity not found"); return; }
  // Use same modal type as new activity, pass existing data so fields pre-fill
  S.modal = {type:"activity", actType:found.act.type, data:found.act, editId:found.act.id, editCoord:targetCoord, editDate:found.date};
  render();
}

function deleteActivity(id, coord){
  if(!confirm("Delete this activity?")) return;
  // Manager can delete from any coordinator's records
  const targetCoord = coord || S.user.coord;
  const found = findActivityAnyDay(targetCoord, id);
  if (!found) { alert("Activity not found"); return; }
  found.day.activities=(found.day.activities||[]).filter(a=>a.id!==id);
  saveDay(found.day);
  addPendingDelete(targetCoord, id);
  S.unsyncedChanges=true;
  S.status={ok:true,msg:"Activity deleted — syncing…"};
  schedulePush();
  render();
}

function openCloseFollowupModal(id, date, coord, name) {
  S.modal = {type:"close_followup", id:id, date:date, coord:coord, name:name};
  render();
}

function closeFollowup(id, date, coord) {
  // Update local day record
  const day = loadDay(coord, date);
  const act = (day.activities||[]).find(a=>a.id===id);
  if (act) {
    act.status = "Completed";
    saveDay(day);
  }
  // Always update cache so it disappears from all views immediately
  try {
    const cacheKey = PFX+"followups:"+coord;
    const cf = localStorage.getItem(cacheKey);
    if (cf) {
      const followups = JSON.parse(cf).filter(a=>a.id!==id);
      localStorage.setItem(cacheKey, JSON.stringify(followups));
    }
  } catch(e) {}
  S.unsyncedChanges = true;
  // FIXED 2026-08-03: this used to only set the unsynced flag and rely on
  // the 5-minute fallback timer or a manual push — every other data-saving
  // action (logging/editing/deleting an activity) schedules an immediate
  // 3-second debounced push, but closing a follow-up didn't, so a closed
  // follow-up could sit local-only for up to 5 minutes (or longer on
  // mobile, where backgrounded tabs can suspend that timer entirely).
  schedulePush();
  S.status = {ok:true, msg:"Follow-up marked complete — syncing…"};
  render();
}

function snoozeFollowup(id, date, coord) {
  // Hard cap — refuse to proceed regardless of how this was triggered
  // (the disabled button is the normal path, but this guards against a
  // stale render or any other bypass).
  try {
    const dayGuard = loadDay(coord, date);
    const actGuard = (dayGuard.activities||[]).find(a=>a.id===id);
    let currentCount = actGuard ? (actGuard.snoozeCount||0) : 0;
    if (!actGuard) {
      const cfGuard = localStorage.getItem(PFX+"followups:"+coord);
      if (cfGuard) {
        const fGuard = JSON.parse(cfGuard).find(a=>a.id===id);
        if (fGuard) currentCount = fGuard.snoozeCount||0;
      }
    }
    if (currentCount >= 3) {
      alert("Snooze limit reached (3x) — take real action on this now and mark it Done with the genuine outcome, rather than deferring again.");
      return;
    }
  } catch(e_) {}

  // Capture bizName FIRST before any mutations
  let bizName = "";
  try {
    const dayCheck = loadDay(coord, date);
    const actCheck = (dayCheck.activities||[]).find(a=>a.id===id);
    if (actCheck) {
      bizName = actCheck.bizName||"";
    }
    if (!bizName) {
      const cf = localStorage.getItem(PFX+"followups:"+coord);
      if (cf) {
        const fuCheck = JSON.parse(cf).find(a=>a.id===id);
        if (fuCheck) bizName = fuCheck.bizName||"";
      }
    }
  } catch(e_) {}

  // Move follow-up to next working day relative to S.date
  const base = new Date((S.date||TODAY)+"T12:00:00");
  base.setDate(base.getDate()+1);
  // Skip weekends
  while (base.getDay()===0 || base.getDay()===6) base.setDate(base.getDate()+1);
  const tomorrowStr = base.toISOString().substring(0,10);

  // Update in local day record
  const day = loadDay(coord, date);
  const act = (day.activities||[]).find(a=>a.id===id);
  let newSnoozeCount = 0;
  if (act) {
    act.followUpDate = tomorrowStr;
    act.snoozeCount = (act.snoozeCount||0) + 1;
    act.lastSnoozed = S.date||TODAY;
    newSnoozeCount = act.snoozeCount;
    saveDay(day);
  }

  // Update cloud cache
  try {
    const cacheKey = PFX+"followups:"+coord;
    let followups = [];
    const cf = localStorage.getItem(cacheKey);
    if (cf) followups = JSON.parse(cf);
    const f = followups.find(a=>a.id===id);
    if (f) {
      f.followUpDate = tomorrowStr;
      f.snoozeCount = (f.snoozeCount||0) + 1;
      f.lastSnoozed = S.date||TODAY;
      if (!bizName) bizName = f.bizName||"";
      if (!act) newSnoozeCount = f.snoozeCount;
    } else if (act) {
      followups.push({...act, followUpDate:tomorrowStr, snoozeCount:newSnoozeCount, lastSnoozed:S.date||TODAY});
      if (!bizName) bizName = act.bizName||"";
    }
    localStorage.setItem(cacheKey, JSON.stringify(followups));
  } catch(e) {}

  // Fire WIP update — detect if ACAP or employer activity
  const snoozeActType = (function(){
    try {
      const dc=loadDay(coord,date);
      const ac=(dc.activities||[]).find(function(a){return a.id===id;});
      if(ac) return ac.type||"";
      const cf=localStorage.getItem(PFX+"followups:"+coord);
      if(cf){const fc=JSON.parse(cf).find(function(a){return a.id===id;});if(fc) return fc.type||"";}
    } catch(e){}
    return "";
  })();
  const isAcapSnooze = snoozeActType==="acap_contact"||snoozeActType==="acap_f2f";
  const isStudentSnooze = snoozeActType==="lead"||snoozeActType==="enrolment_pipeline";
  // Get org name for ACAP
  let acapOrg_ = "";
  if (isAcapSnooze) {
    try {
      const dc=loadDay(coord,date);
      const ac=(dc.activities||[]).find(function(a){return a.id===id;});
      acapOrg_ = ac ? (ac.acapOrg||ac.bizName||"") : "";
      if(!acapOrg_){const cf=localStorage.getItem(PFX+"followups:"+coord);if(cf){const fc=JSON.parse(cf).find(function(a){return a.id===id;});if(fc)acapOrg_=fc.acapOrg||fc.bizName||"";}}
    } catch(e){}
  }
  // Get student/lead name for Student Lead / Enrolment Pipeline
  let studentName_ = "";
  if (isStudentSnooze) {
    try {
      const dc=loadDay(coord,date);
      const ac=(dc.activities||[]).find(function(a){return a.id===id;});
      studentName_ = ac ? (ac.studentName||ac.leadName||"") : "";
      if(!studentName_){const cf=localStorage.getItem(PFX+"followups:"+coord);if(cf){const fc=JSON.parse(cf).find(function(a){return a.id===id;});if(fc)studentName_=fc.studentName||fc.leadName||"";}}
    } catch(e){}
  }
  if (isAcapSnooze && acapOrg_) {
    postBestEffort({type:"update_acap_followup",coord,org:acapOrg_,id,
      nextContactDate:tomorrowStr,lastContactDate:S.date||TODAY,action:"snooze",snoozeCount:newSnoozeCount});
  } else if (isStudentSnooze && studentName_) {
    // 2026-08-07 FIX: this object literal had TWO "type" keys — the
    // dispatch-routing value ("update_student_followup") and the
    // lead-vs-pipeline discriminator (snoozeActType) — and in JS, the
    // LATER key silently wins. So every student/pipeline snooze was
    // actually sent with type:"lead" or type:"enrolment_pipeline", which
    // doPost's dispatcher (appscript.js) doesn't recognise as any known
    // push type — it was rejected with "Unknown push type" on EVERY call,
    // 100% of the time, completely invisibly (postBestEffort only checks
    // the HTTP status, not this app-level ok:false). Renamed the
    // discriminator to leadType so both keys survive; handleUpdateStudentFollowup
    // now reads payload.leadType instead of payload.type for this reason.
    postBestEffort({type:"update_student_followup",coord,name:studentName_,leadType:snoozeActType,
      nextContactDate:tomorrowStr,lastContactDate:S.date||TODAY,action:"snooze"});
  } else if (!isAcapSnooze && !isStudentSnooze && bizName) {
    postBestEffort({
      type:"update_employer_followup",
      coord, bizName, id,
      nextContactDate:tomorrowStr,
      lastContactDate:S.date||TODAY,
      action:"snooze",
      snoozeCount:newSnoozeCount
    });
  }

  S.unsyncedChanges = true;
  // FIXED 2026-08-03: see matching note in closeFollowup() — snoozing
  // previously never scheduled the 3-second debounced push either.
  schedulePush();
  S.status = {ok:true, msg:"Snoozed to "+tomorrowStr+(bizName?" — "+bizName:"")+" — syncing…"};
  render();
}

function getAllDueToday(coord){
  // 2026-07-30 bugfix: this used to compare against S.date||TODAY — S.date
  // is the currently-VIEWED day (changed by the date picker in the header,
  // reachable from any tab), not the real calendar date. Navigating to a
  // past day made every follow-up due that day show up here AND in
  // getAllOverdueFollowups (which correctly always uses real TODAY via
  // isOverdue()) — duplicated on screen, and mislabeled "due today" when it
  // wasn't. Navigating to a future day mislabeled not-yet-due follow-ups as
  // "due today" too. "Due Today" should always mean the real today,
  // regardless of which day's log the coordinator happens to be viewing.
  const result=[];
  allDays(coord).forEach(d=>{
    const day=loadDay(coord,d);
    (day.activities||[]).forEach(a=>{
      if(a.followUpDate===TODAY && a.status!=="Completed" && a.status!=="Closed"){
        result.push({...a,_date:d});
      }
    });
  });
  try{
    const _cf=localStorage.getItem(PFX+"followups:"+coord);
    if(_cf) JSON.parse(_cf).forEach(function(a){
      if(a.followUpDate===TODAY && a.status!=="Completed" && a.status!=="Closed"){
        if(!result.find(function(r){return r.id===a.id;})) result.push(a);
      }
    });
  }catch(e_){}
  return result.sort((a,b)=>a.type>b.type?1:-1);
}

function getAllOverdueFollowups(coord){
  const result=[];
  allDays(coord).forEach(d=>{
    const day=loadDay(coord,d);
    (day.activities||[]).forEach(a=>{
      if(a.followUpDate && isOverdue(a.followUpDate) && a.status!=="Completed" && a.status!=="Closed") result.push({...a,_date:d});
    });
  });
  return result.sort((a,b)=>a.followUpDate>b.followUpDate?1:-1);
}

function getAllWeeks(coord){
  const dates=allDays(coord);
  if(dates.length===0) return [mondayOf(TODAY)];
  const weeks=new Set();
  dates.forEach(d=>weeks.add(mondayOf(d)));
  weeks.add(mondayOf(TODAY));
  return Array.from(weeks).sort().reverse();
}

function confirmCloseFollowup(id, date, coord) {
  const outcome       = document.getElementById("fu_outcome")?.value||"";
  const notes         = document.getElementById("fu_notes")?.value?.trim()||"";
  const justification = document.getElementById("fu_justification")?.value?.trim()||"";
  const newFu         = document.getElementById("fu_new_followup")?.value||"no";
  const newDate       = document.getElementById("fu_new_date")?.value||"";
  const newAction     = document.getElementById("fu_new_action")?.value?.trim()||"";

  // Validation — 2026-07-28: inline instead of blocking alert() popups.
  const closeErrors = [];
  if (!outcome) closeErrors.push("Please select an outcome");
  if (!notes)   closeErrors.push("Please describe what happened");
  const isMeaningful = MEANINGFUL_OUTCOMES.indexOf(outcome) !== -1;
  if (!isMeaningful && outcome && !justification) {
    closeErrors.push("Please provide justification for closing without meaningful contact");
  }
  if (closeErrors.length) { showModalErrors(closeErrors); return; }
  showModalErrors([]);

  const closeDate = S.date||TODAY;

  // Update original activity record
  const day = loadDay(coord, date);
  const act = (day.activities||[]).find(a=>a.id===id);
  if (act) {
    act.status        = "Completed";
    act.closeOutcome  = outcome;
    act.closeNotes    = notes;
    act.justification = justification||"";
    act.closedDate    = closeDate;
    act.meaningful    = isMeaningful;
    saveDay(day);
  }

  // Remove from followup cache
  try {
    const cacheKey = PFX+"followups:"+coord;
    const cf = localStorage.getItem(cacheKey);
    if (cf) localStorage.setItem(cacheKey, JSON.stringify(JSON.parse(cf).filter(a=>a.id!==id)));
  } catch(e) {}

  // If meaningful — log as a new activity on TODAY (counts toward day's log)
  if (isMeaningful) {
    const todayRec = loadDay(coord, closeDate);
    if (!todayRec.activities) todayRec.activities=[];
    todayRec.activities.push({
      id: uuid(),
      type: "follow_up_closed",
      timestamp: new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}),
      date: closeDate,
      bizName: act?.bizName||act?.acapOrg||act?.leadName||act?.studentName||"",
      contactName: act?.contactName||"",
      activityOutcome: outcome,
      notes: notes,
      status: "Completed",
      closeOutcome: outcome,
      _closedFromId: id,
      // ADDED 2026-08-03: preserve the ORIGINAL activity's type (and, for
      // employer calls, its Existing/New relType) so the Manager
      // Dashboard's contact-count tiles can credit this closure back to
      // the right tile "as per the type" — per Bec's explicit request —
      // instead of only ever showing up in the separate "follow-ups
      // closed" badge, disconnected from the type-specific tiles. See
      // effContactType() in renderDailyDashboard() and isMeaningfulCall().
      // Deliberately NOT carrying forward the original contactOutcome/
      // newStage/prevStage — those reflect whatever was true when the
      // follow-up was first logged, not anything this closure itself
      // achieved, so outcome-gated tiles (Registrations needing
      // "Registered", Enrolments needing "Enrolled") correctly do not
      // get credit from a closure alone.
      origType: act?.type||"",
      relType: act?.relType||"",
    });
    saveDay(todayRec);
  }

  // If new follow-up needed
  if (newFu==="yes" && newDate) {
    const origDay = loadDay(coord, date);
    const origAct = (origDay.activities||[]).find(a=>a.id===id);
    if (origAct) {
      origAct.followUpDate = newDate;
      origAct.nextAction   = newAction||origAct.nextAction;
      origAct.status       = "Open";
      origAct.snoozeCount  = 0;
      saveDay(origDay);
      try {
        const cacheKey = PFX+"followups:"+coord;
        const cf = localStorage.getItem(cacheKey);
        const fus = cf ? JSON.parse(cf) : [];
        fus.push({...origAct});
        localStorage.setItem(cacheKey, JSON.stringify(fus));
      } catch(e) {}
    }
  }

  S.modal = null;
  S.unsyncedChanges = true;
  // FIXED 2026-08-03: see matching note in closeFollowup() — confirming a
  // follow-up closure (with outcome/notes, the most detailed close path)
  // previously never scheduled the 3-second debounced push either, despite
  // being the action most likely to contain the "what happened" text Bec
  // asked to have surfaced in the weekly reports.
  schedulePush();

  // Update WIP database (Employer/ACAP next contact date, or Student
  // Lead/Enrolment Pipeline follow-up date) so this closure actually
  // persists server-side, not just in this device's local cache.
  try {
    // Try local day record first, then cloud cache
    const origDay2 = loadDay(coord, date);
    let origAct2 = (origDay2.activities||[]).find(a=>a.id===id);
    if (!origAct2) {
      const cf2 = localStorage.getItem(PFX+"followups:"+coord);
      if (cf2) origAct2 = JSON.parse(cf2).find(a=>a.id===id);
    }
    // Also check the act variable already retrieved above
    if (!origAct2 && act) origAct2 = act;

    const today_ = S.date||TODAY;
    let nextDate = "";
    if (!isMeaningful) {
      const n = new Date(today_+"T12:00:00"); n.setDate(n.getDate()+42);
      nextDate = n.toISOString().substring(0,10);
    }
    const fuAction = outcome==="Do not contact — removed from list"
      ? "do_not_contact"
      : isMeaningful ? "closed_meaningful" : "closed_no_contact";

    const isAcapClose = origAct2 && (origAct2.type==="acap_contact"||origAct2.type==="acap_f2f");
    const isStudentClose = origAct2 && (origAct2.type==="lead"||origAct2.type==="enrolment_pipeline");
    const acapOrgClose = isAcapClose ? (origAct2.acapOrg||origAct2.bizName||"") : "";
    const bizName2 = (!isAcapClose && !isStudentClose && origAct2) ? (origAct2.bizName||"") : "";
    const studentName2 = isStudentClose ? (origAct2.studentName||origAct2.leadName||"") : "";

    // FIXED 2026-07-31: these payloads previously never included the
    // coordinator's "What specifically happened?" / justification text —
    // it was required and captured client-side, then silently dropped, so
    // closed follow-ups (especially non-meaningful ones, which never get a
    // separate today-activity row either) left no trace of what actually
    // happened anywhere in the WIP sheet. Now included so the backend can
    // write the real details instead of a generic placeholder.
    if (isAcapClose && acapOrgClose) {
      postBestEffort({type:"update_acap_followup",coord,org:acapOrgClose,id,
        nextContactDate:nextDate,lastContactDate:today_,action:fuAction,
        notes:notes,justification:justification||""});
    } else if (isStudentClose && studentName2) {
      // 2026-08-07 FIX — same duplicate-"type"-key bug as the snooze
      // function above: renamed the lead-vs-pipeline discriminator to
      // leadType so it can't clobber the dispatch-routing "type" value.
      // This is very likely THE root cause of "closed follow-ups still
      // showing as overdue" for Student Leads/Enrolment Pipeline — every
      // close via this path was silently rejected by doPost's dispatcher
      // ("Unknown push type: lead"/"...enrolment_pipeline"), invisibly,
      // every single time, so the WIP sheet's Follow-Up Date was NEVER
      // actually cleared no matter how many times a coordinator closed it.
      postBestEffort({type:"update_student_followup",coord,name:studentName2,leadType:origAct2.type,
        nextContactDate:nextDate,lastContactDate:today_,action:fuAction,
        notes:notes,justification:justification||""});
    } else if (bizName2) {
      postBestEffort({
        type:"update_employer_followup",
        coord, bizName:bizName2, id,
        nextContactDate:nextDate,
        lastContactDate:today_,
        action: fuAction,
        notes: notes,
        justification: justification||""
      });
    }
  } catch(e_){}

  const msg = isMeaningful
    ? "✅ Follow-up closed — counted as today's activity. Syncing…"
    : "Follow-up closed (no meaningful contact recorded). Syncing…";
  S.status = {ok:true, msg};
  render();
}

function getAllOpenFollowupsForDash(coord) {
  // For manager dashboard — reads from local cache for this coord
  const result = [];
  const seen = new Set();
  // Check cloud cache
  try {
    const cf = localStorage.getItem(PFX+"followups:"+coord);
    if (cf) JSON.parse(cf).forEach(function(a) {
      if (a.status!=="Completed" && a.status!=="Closed" && !seen.has(a.id)) {
        seen.add(a.id); result.push(a);
      }
    });
  } catch(e) {}
  // Also check all local days
  allDays(coord).forEach(function(d) {
    const day = loadDay(coord, d);
    (day.activities||[]).forEach(function(a) {
      if (a.followUpDate && a.status!=="Completed" && a.status!=="Closed" && !seen.has(a.id)) {
        seen.add(a.id); result.push(a);
      }
    });
  });
  return result;
}

// FIXED 2026-07-28: "n/a" was wrongly included here. In the source data,
// "N/A" on a Student Lead means "no stage recorded yet" — the lead is
// still open, just unclassified — NOT "closed". With "n/a" in this list,
// the Registration Pipeline autocomplete (renderRegDropdown below)
// filtered out almost every lead, since most rows come through with a
// literal "N/A" stage. Confirmed live via Settings → "Debug student
// leads cache": 173 of 174 synced students showing "No open students
// found" despite a healthy, near-real-time sync — Murat Abdula, Luke
// Newman, and Natalie Humphreys-Grey (all "N/A") were being wrongly
// excluded alongside genuinely closed leads like "Cancelled" and
// "completed".
// 2026-07-28: exact rule confirmed with Bec — a lead counts as OPEN for the
// Registration Pipeline dropdown unless its Student Leads DB column I
// status is one of these four (case-insensitive). A genuinely blank status
// still counts as open. Stage text sometimes carries invisible characters
// (zero-width space/joiner, BOM, NBSP) that survive .trim() but look like
// plain text on screen, so normalizeStageText_ strips those before

  return CLOSED_STUDENT_LEAD_STATUSES.includes(normalizeStageText_(status));

function neContactFieldHtml(group, currentContactName){
  if(!group || !group.contacts.length){
    return fld("Contact person","ne_contact_newname","text",currentContactName||"",null,"true");
  }
  const isNew = currentContactName && !group.contacts.some(c=>c.contactName===currentContactName);
  const opts=group.contacts.map(function(c){
    const label=(c.contactName||"(no name on file)")+(c.position?" ("+c.position+")":"");
    const selected=currentContactName && c.contactName===currentContactName ? " selected" : "";
    return '<option value="'+(c.contactName||"").replace(/"/g,"&quot;")+'"'+selected+'>'+label+'</option>';
  }).join("");
  return '<div class="field"><label>Contact person<span class="req">*</span></label>'+
    '<select id="ne_contact_select" onchange="onNeContactSelect()">'+
    opts+
    '<option value="__new__"'+(isNew?" selected":"")+'>+ Add new contact</option>'+
    '</select>'+
    '<input id="ne_contact_newname" oninput="syncNeContact()" style="margin-top:6px;'+(isNew?"":"display:none")+'" placeholder="New contact\'s name..." value="'+(isNew?(currentContactName||"").replace(/"/g,"&quot;"):"")+'"></div>';
}

// New-list item 5 follow-up: "auto detect" for Site Visit - New Employer —
// same idiom as onSvBizInput/onIcBizInput, filtered to New
// prospect/New employer acquired employers only (NEW_EMPLOYER_STAGE_RELS).
function onNeBizInput(val){
  const neCache=getEmployerCache(S.user.coord).filter(function(e){
    return NEW_EMPLOYER_STAGE_RELS.includes((e.empRelationship||"").trim());
  });
  const neGroups=groupByOrg(neCache,"bizName");
  const group=neGroups.find(function(g){return g.name.trim().toLowerCase()===(val||"").trim().toLowerCase();});
  const hint=document.getElementById("ne_emp_hint");
  if(hint) hint.innerHTML = group ? '<div><i class="ti ti-circle-check"></i> Matched existing employer</div>'+orgHintLinesHtml(group) : "";
  const container=document.getElementById("ne_contact_container");
  if(container){
    container.innerHTML = neContactFieldHtml(group,"");
    syncNeContact();
  }
}

function onNeContactSelect(){
  const sel=document.getElementById("ne_contact_select");
  const newField=document.getElementById("ne_contact_newname");
  if(!sel||!newField) return;
  const isNew = sel.value==="__new__";
  newField.style.display = isNew ? "block" : "none";
  if(isNew){ newField.value=""; newField.focus(); }
  else {
    // Convenience only — never a silent overwrite. Email/Phone stay as
    // placeholders (same "no auto-fill of contact-sensitive fields" rule as
    // onSvBizInput/onIcBizInput); Employer relationship is safe to set
    // directly since it's constrained to the same two stages this dropdown
    // was already filtered to.
    const neGroups=groupByOrg(getEmployerCache(S.user.coord).filter(function(e){
      return NEW_EMPLOYER_STAGE_RELS.includes((e.empRelationship||"").trim());
    }),"bizName");
    const bizVal=(document.getElementById("ne_biz")||{}).value||"";
    const group=neGroups.find(function(g){return g.name.trim().toLowerCase()===bizVal.trim().toLowerCase();});
    const contact=group ? group.contacts.find(function(c){return c.contactName===sel.value;}) : null;
    if(contact){
      const posEl=document.getElementById("ne_position"); if(posEl) posEl.placeholder=contact.position||"";
      const emailEl=document.getElementById("ne_email"); if(emailEl) emailEl.placeholder=contact.email||"";
      const phoneEl=document.getElementById("ne_phone"); if(phoneEl) phoneEl.placeholder=contact.phone||"";
      const regionEl=document.getElementById("ne_region"); if(regionEl) regionEl.placeholder=contact.region||"";
      const postcodeEl=document.getElementById("ne_postcode"); if(postcodeEl) postcodeEl.placeholder=contact.postcode||"";
      const addressEl=document.getElementById("ne_address"); if(addressEl) addressEl.placeholder=contact.address||"";
      const websiteEl=document.getElementById("ne_website"); if(websiteEl) websiteEl.placeholder=contact.website||"";
      const relEl=document.getElementById("ne_rel"); if(relEl && contact.empRelationship) relEl.value=contact.empRelationship;
    }
  }
  syncNeContact();
}

function syncNeContact(){
  const hidden=document.getElementById("ne_contact");
  if(!hidden) return;
  const sel=document.getElementById("ne_contact_select");
  hidden.value = sel
    ? (sel.value==="__new__" ? (document.getElementById("ne_contact_newname")?.value.trim()||"") : sel.value)
    : (document.getElementById("ne_contact_newname")?.value.trim() || "");
}

// 2026-07-28: previously a single generic confirm() regardless of sync
// state. Now warns specifically and more strongly when there is unsynced
// data, since clearing then would genuinely lose today's/this week's
// un-pushed activity — not just re-confirm an already-safe action.
function confirmClearLocalData(){
  // 2026-08-06 (backlog item 7 — "Hard Reset / Local Data Sync"): the
  // warning below is based on the S.unsyncedChanges snapshot only, which
  // is reliable once a push has settled but says nothing about a push
  // that is ACTIVELY in flight right now. Without this check, clicking
  // Clear Local Data mid-sync could wipe local data out from under a
  // pushData() call that hasn't finished writing yet. Block outright
  // rather than just warn — there's no "sure, clear anyway" that's safe
  // here, the sync needs to finish (or fail) first.
  if (S.syncing) {
    alert("A sync to Google Sheets is currently in progress.\n\nPlease wait for it to finish (you'll see the Push button return to normal) before clearing local data.");
    return;
  }
  if (S.unsyncedChanges) {
    if (!confirm("⚠ You have UNSYNCED changes that have not been pushed to Google Sheets yet.\n\nClearing local data now will PERMANENTLY LOSE that unsynced activity — it cannot be recovered.\n\nPush to sync first unless you're sure. Clear anyway?")) return;
  } else {
    if (!confirm("Clear ALL local data? This cannot be undone.\n\n(No unsynced changes were detected — everything appears to already be pushed to Google Sheets.)")) return;
  }
  clearAllData();
}
function clearAllData(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i); if(k&&k.startsWith(PFX)) keys.push(k);
  }
  keys.forEach(k=>localStorage.removeItem(k));
  S.user=null; S.modal=null; render();
}

// ═══════════════════════════════════════════════════════════
// PUSH TO SHEETS
// ═══════════════════════════════════════════════════════════
// ── Convert activity object to sheet row (42 columns) ────────────────────
// UPDATED 2026-08-04: added col 42 (index 41) for origType — see the
// matching ACT_COLS/rowToActivity() comment in appscript.js. Before this
// column existed, a closed follow-up's origType only ever lived in this
// browser's in-memory/localStorage copy of the activity: actToRow() had
// nowhere to put it when pushing, so it was silently dropped on every
// sync, and the very next cloud pull (mergeCloudData(), which now runs
// automatically on login/coordinator-switch/every 5 min) overwrote the
// local copy with the column-less version from the sheet — wiping
// origType back out. That's why Pipeline Progression Attempts/ACAP
// Contacts/Existing Employer Calls kept resetting to their undercounted
// values no matter how many times a follow-up was closed with the
// "credit the original type" fix in place. This column makes origType
// actually persist through the round trip.
function actToRow(a, day, coord, state) {
  const d = a._date || day.date || S.date;
  return [
    a.id, coord, state, d,
    day.focus||"", day.focusOther||"",
    a.type, a.timestamp||"",
    a.bizName||"", a.contactName||"", a.relType||"",
    a.callOutcome||"", (["add_acap","site_visit","new_employer_met","new_employer_db","add_employer","intro_call","acap_contact","acap_f2f"].includes(a.type)?(a.profileNotes||""):(a.meaningfulDiscussion||"")),
    a.suburb||"", a.mobile||"", a.email||"",
    a.studentName||"", a.studentState||"", a.trade||"",
    a.prevStage||"", a.newStage||"", a.contactOutcome||"",
    (a.type==="employer_call"?(a.profileNotes||""):(a.barrier||"")), a.actionToday||"", a.expectedReg||"",
    a.activityOutcome||"", a.nextAction||"", a.followUpDate||"",
    a.responsible||coord, a.status||"Open", a.notes||"",
    a.within24h||"", day.eodStatus||"", day.eodResult||"",
    day.eodTomorrow||"", day.eodAllEntered||"",
    a.acapOrg||"", a.eventName||"", a.attendees||"",
    a.postcode||"", a.leadName||"",
    a.origType||"",
  ];
}

// Best-effort background sync for side-effect WIP updates (follow-up snooze,
// close, "do not contact" marking) that fire immediately from the UI but are
// NOT the source of truth for sync completion — the authoritative sync still
// happens through the normal pushData()/post() flow (S.unsyncedChanges stays
// true until that runs). 2026-07-28: previously these fired a raw no-cors
// fetch with .catch(()=>{}), which can never detect a genuine failure —
// mirrors the same "try a real response first" pattern as post() below, and
// logs a failure to the existing error log instead of swallowing it silently.
function postBestEffort(payload) {
  const body = JSON.stringify(payload);
  fetch(WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body})
    .then(function(res){
      if(!res || !res.ok){
        window._errorLog.push(new Date().toLocaleTimeString()+" | background sync failed (status "+(res?res.status:"?")+"): "+payload.type);
        try{ lsSet("errorLog", window._errorLog); }catch(e){}
      }
    })
    .catch(function(){
      // Real fetch itself failed (e.g. CORS on a local/file:// context) —
      // fall back to no-cors so the write still has a chance to land, even
      // though we can't confirm it from here.
      fetch(WEBAPP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body}).catch(function(){
        window._errorLog.push(new Date().toLocaleTimeString()+" | background sync failed (network): "+payload.type);
        try{ lsSet("errorLog", window._errorLog); }catch(e){}
      });
    });
}

// 2026-08-06 (backlog item 18 — "Error Messages"): raw browser fetch
// errors (e.g. "Failed to fetch", "NetworkError when attempting to fetch
// resource", "Load failed") were being shown to coordinators verbatim,
// which reads as a cryptic technical failure rather than telling them
// what actually happened or what to do about it. This maps the common,
// recognisable failure shapes to the specific messages the docx asked
// for ("Unable to sync", "Internet connection lost") and otherwise falls
// back to a labelled generic message rather than a bare stack-trace-style
// string.
function friendlyError_(e){
  const raw = (e && e.message) ? e.message : String(e||"");
  const low = raw.toLowerCase();
  if (low.indexOf("failed to fetch")!==-1 || low.indexOf("networkerror")!==-1 ||
      low.indexOf("load failed")!==-1 || low.indexOf("network request failed")!==-1) {
    return "Internet connection lost — check your connection and try again.";
  }
  if (low.indexOf("timeout")!==-1 || low.indexOf("timed out")!==-1) {
    return "Sync timed out — the server took too long to respond. Try again in a moment.";
  }
  if (!raw) return "Unable to sync — an unknown error occurred.";
  return "Unable to sync: "+raw;
}
async function post(type, payload) {
  const body = JSON.stringify({...payload, type});
  try {
    // Try with CORS first (works when hosted on server)
    const res = await fetch(WEBAPP_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body
    });
    if(res.ok) return await res.json();
  } catch(e) {}
  // Fallback: no-cors for local file (can't read response but data gets written)
  await fetch(WEBAPP_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain"},
    body
  });
  return {ok:true, msg:"Pushed (no-cors mode)"};
}

async function pushData() {
  if(S.syncing) return;
  S.syncing=true; S.status={ok:true,msg:"Syncing…"}; if(!S.modal) render();

  const coord=S.user.coord, state=STATES[coord];
  const monday=mondayOf(S.date);
  const days=weekDaysMF(S.date);
  const errors=[];
  let pushed=0;

  // Build activity rows
  const actRows=[], leadRows=[], leadEmployerLinks=[], empRows=[], dayMetaArr=[];
  // Batch 8 tweak-list item 4: extra "complete the record" fields captured
  // when adding a brand-new contact (Position, Region, Website, etc.) don't
  // fit the fixed-width activity row format every other activity type
  // shares, so they travel as a separate id-keyed map alongside `rows`
  // rather than as new row columns — keeps the shared row schema untouched.
  const newContactDetailsByRowId={};
  // Batch 8 item 7: matched student's Contact ID, same id-keyed-map pattern
  // as above — lets the backend match by ID (unambiguous) instead of name
  // alone when logging Registration/Enrolment Pipeline activity.
  const leadContactIdByRowId={};
  // Batch 8 item 11: deliberate email/phone edits for an EXISTING contact —
  // same id-keyed-map pattern as above. Only ever present when the
  // coordinator actually changed a pre-filled value (see readContactEdit).
  const contactEditByRowId={};
  // New-list item 5: {name, isNew, state, relType} per activity row — same
  // id-keyed-map pattern, only present when the coordinator actually filled
  // in the "Linked employer" field on Registration Pipeline / Add Student Lead.
  const employerLinkByRowId={};
  days.forEach(d=>{
    const day=loadDay(coord,d);
    dayMetaArr.push({
      date:d, focus:day.focus||"", focusOther:day.focusOther||"",
      eodStatus:day.eodStatus||"", eodResult:day.eodResult||"",
      eodTomorrow:day.eodTomorrow||"", eodAllEntered:day.eodAllEntered||"",
      nwins:day.nwins||"", nblockers:day.nblockers||"",
      npipeline:day.npipeline||"", ncampaign:day.ncampaign||"",
      risks:day.risks||[],
      eodOffPaceNote:day.eodOffPaceNote||"", // 2026-08-06
    });
    const realActs=realDayActivities(day); // shared with dayStatus()/weeklyTotals() — see note above dayStatus()
    realActs.forEach(a=>{
      actRows.push(actToRow(a, day, coord, state));
      if(a.newContactDetails && a.id){
        newContactDetailsByRowId[a.id]=a.newContactDetails;
      }
      if(a.leadContactId && a.id){
        leadContactIdByRowId[a.id]=a.leadContactId;
      }
      if(a.contactEdit && a.id){
        contactEditByRowId[a.id]=a.contactEdit;
      }
      if(a.employerLink && a.id){
        employerLinkByRowId[a.id]=a.employerLink;
      }
      if(a.type==="lead"){
        const auDate=d.split("-").reverse().join("/");
        // 2026-07-30 bugfix: this array is positional against the Student
        // Leads header row (Date Added, Student Name, Phone, Email, Trade,
        // State, Location, Source, Status) — it was previously missing the
        // Location slot entirely, which silently shifted "Tracker" into
        // Location and "New lead" into Source, leaving Status (a WIP
        // dashboard-critical field) blank on every single new lead ever
        // added via this tile. Location isn't collected on this form, so it
        // stays blank; Source/Status now land in their correct columns.
        leadRows.push([auDate,a.studentName||"",a.mobile||"",a.email||"",a.trade||"",a.studentState||state,"","Tracker","New lead"]);
        // 2026-07-30 bugfix: push_leads (handlePushLeads) is what actually
        // creates this row — push_activities/employerLinkByRowId can't, since
        // it runs first and the row doesn't exist yet. Send the link
        // alongside leadRows too, index-aligned, so the row that creates it
        // can also write it.
        leadEmployerLinks.push(a.employerLink||null);
      }
      if(a.type==="new_employer_db"){
        const auDate=d.split("-").reverse().join("/");
        // Columns: A=DateAdded, B=Active, C=EmpRelationship, D=State, E=BizName,
        //          F=ContactName, G=Position, H=Email, I=Phone, J-L=Website/FB/IG,
        //          M=Region, N=Address, O=Postcode, P=ProfileBuilder,
        //          Q=LastContact, R=Notes, S=FURequired, T=NextContact, U=ActivityOutcome
        empRows.push([auDate,"Y",a.relType||"New Prospect",state,a.bizName||"",
          a.contactName||"","",a.email||"",a.phone||"","","","",
          "","",a.postcode||"","",
          auDate,"","","","",""]);
      }
    });
  });

  // Push activities
  const deletedIds = getPendingDeletes(coord);
  try {
    const r=await post("push_activities",{coord,state,mondayStr:monday,rows:actRows,deletedIds,newContactDetailsByRowId,leadContactIdByRowId,contactEditByRowId,employerLinkByRowId});
    if(r.ok) { pushed+=actRows.length; clearPendingDeletes(coord, deletedIds); }
    else errors.push("Activities: "+r.msg);
  } catch(e){ errors.push("Activities: "+friendlyError_(e)); }

  // Push day meta (focus, EOD, notes)
  try {
    const r=await post("push_day_meta",{coord,days:dayMetaArr});
    if(!r.ok) errors.push("Day meta: "+r.msg);
  } catch(e){ errors.push("Day meta: "+friendlyError_(e)); }

  // Push leads
  try {
    const r=await post("push_leads",{coord,state,mondayStr:monday,rows:leadRows,employerLinks:leadEmployerLinks});
    if(!r.ok) errors.push("Leads: "+r.msg);
  } catch(e){ errors.push("Leads: "+friendlyError_(e)); }

  // Push employers
  try {
    const r=await post("push_employers",{coord,state,mondayStr:monday,rows:empRows});
    if(!r.ok) errors.push("Employers: "+r.msg);
  } catch(e){ errors.push("Employers: "+friendlyError_(e)); }

  // Push weekly reflection
  try {
    const wkMon=mondayOf(S.date);
    let ref={wr1:"",wr2:"",wr3:""};
    try{const rv=localStorage.getItem(PFX+"wkref:"+coord+":"+wkMon);if(rv)ref=JSON.parse(rv);}catch(e){}
    if(ref.wr1||ref.wr2||ref.wr3){
      const r=await post("push_reflection",{coord,weekMonday:wkMon,...ref});
      if(!r.ok) errors.push("Reflection: "+r.msg);
    }
  } catch(e){ errors.push("Reflection: "+friendlyError_(e)); }

  if(errors.length>0){
    S.status={ok:false,msg:"Errors: "+errors.join(" | ")};
    S.unsyncedChanges=true;
  } else {
    S.status={ok:true,msg:"✓ Synced — "+actRows.length+" activities · "+leadRows.length+" leads · "+empRows.length+" employers"};
    S.unsyncedChanges=false;
    S.lastSynced=new Date().toISOString();
    lsSet("lastSynced:"+coord,S.lastSynced);
  }
  S.syncing=false; if(!S.modal) render();

  // FIXED 2026-08: root cause of "logging an activity creates a brand new
  // contact/duplicate instead of matching the existing one." The Employer/
  // ACAP/Student Lead org+contact pickers are built entirely from LOCAL
  // caches (getEmployerCache/getAcapCache/etc, set only by pullEmployers()/
  // pullAcaps()/pullStudentLeads()/pullEnrolmentPipeline()/
  // pullCommencements()) — never updated optimistically when an activity
  // adds a new contact. Those caches were previously only ever refreshed by
  // loadFromCloud(), which itself is only called at page load/login/manual
  // refresh, AND skips refreshing them entirely for 90s after any push (see
  // recentlyPushed() below — that guard exists to protect this WEEK's
  // unsynced activity data, not these reference lists, but it was blocking
  // both). Net effect: a coordinator who added a brand-new contact, then
  // logged ANY further activity for that same person without a full page
  // reload — an extremely common same-session flow, e.g. "add the contact,
  // then immediately log a call/visit with them" — would find them absent
  // from the picker every time, so the tracker fell back to "+ Add new
  // contact" and minted a fresh Contact ID on every single subsequent
  // activity. Refreshing these caches right after every successful push
  // (not gated by recentlyPushed(), and not dependent on the coordinator
  // ever reloading the page) closes that gap directly at the source —
  // nothing further for a coordinator to do differently.
  if(errors.length===0){
    pullEmployers(coord);
    pullAcaps(coord);
    pullStudentLeads(coord);
    pullEnrolmentPipeline(coord);
    pullCommencements(coord);
  }
}

// ── JSONP fetch — works from local file:// and SharePoint ────────────────
async function jsonpFetch(url, retries) {
  retries = retries || 0;
  // Try fetch() first — works on mobile and modern browsers
  // Append callback=none so Apps Script returns plain JSON
  const sep = url.includes("?") ? "&" : "?";
  const fetchUrl = url + sep + "_t=" + Date.now();
  try {
    const resp = await fetch(fetchUrl, {method:"GET", mode:"cors"});
    if (resp.ok) {
      const data = await resp.json();
      return data;
    }
  } catch(fetchErr) {
    // fetch failed (CORS not enabled on Apps Script) — fall through to JSONP
  }

  // JSONP fallback
  return new Promise(function(resolve, reject) {
    const cbName = "cb_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const fullUrl = url + sep + "callback=" + cbName + "&_t=" + Date.now();
    let done = false;
    window[cbName] = function(data) {
      done = true;
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      resolve(data);
    };
    const cleanup = function(err) {
      if (done) return;
      done = true;
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      if (retries < 2) {
        setTimeout(function() {
          jsonpFetch(url, retries+1).then(resolve).catch(reject);
        }, 2000*(retries+1));
      } else {
        reject(new Error(err));
      }
    };
    script.onerror = function() { cleanup("Script load failed"); };
    setTimeout(function() { cleanup("Timeout"); }, 15000);
    script.src = fullUrl;
    document.body.appendChild(script);
  });
}

// ── Merge cloud data into localStorage ──────────────────────────────────
function mergeCloudData(cloudData, coord) {
  const {activities, dayMeta} = cloudData;
  // Group activities by date
  const byDate={};
  (activities||[]).forEach(a=>{
    if(!byDate[a.date]) byDate[a.date]=[];
    byDate[a.date].push(a);
  });
  // Update each day's localStorage
  Object.keys(byDate).forEach(d=>{
    const day=loadDay(coord,d);
    // Always preserve local activities not known to cloud
    // Cloud may be stale if we pushed recently
    const cloudIds=new Set(byDate[d].map(a=>a.id));
    const localOnly=(day.activities||[]).filter(a=>!cloudIds.has(a.id));
    if(S.unsyncedChanges && localOnly.length>0){
      // We have local-only activities — keep them, update cloud ones
      const cloudById={};
      byDate[d].forEach(a=>{cloudById[a.id]=a;});
      day.activities=(day.activities||[]).map(a=>cloudById[a.id]||a);
      // Add any cloud activities we don't have locally
      byDate[d].forEach(a=>{
        if(!(day.activities||[]).find(x=>x.id===a.id)) day.activities.push(a);
      });
    } else {
      // No unsynced local changes — cloud is authoritative
      day.activities=[...byDate[d], ...localOnly];
    }
    // Merge day meta if available
    if(dayMeta&&dayMeta[d]){
      const dm=dayMeta[d];
      day.focus=dm.focus||day.focus;
      day.focusOther=dm.focusOther||day.focusOther;
      day.eodStatus=dm.eodStatus||day.eodStatus;
      day.eodResult=dm.eodResult||day.eodResult;
      day.eodTomorrow=dm.eodTomorrow||day.eodTomorrow;
      day.eodAllEntered=dm.eodAllEntered||day.eodAllEntered;
      day.nwins=dm.nwins||day.nwins;
      day.nblockers=dm.nblockers||day.nblockers;
      day.npipeline=dm.npipeline||day.npipeline;
      day.ncampaign=dm.ncampaign||day.ncampaign;
      day.eodOffPaceNote=dm.eodOffPaceNote||day.eodOffPaceNote; // 2026-08-06
      // 2026-08-06: risks — an array, not a string, so the "||" fallback
      // pattern above (falsy-string means untouched) doesn't apply; only
      // adopt the cloud's version when it actually has entries, so a
      // device that hasn't pushed its own local risk edits yet doesn't
      // get them clobbered by an empty cloud array.
      if(dm.risks&&dm.risks.length) day.risks=dm.risks;
    }
    saveDay(day);
  });
}

// ── Auto-load from cloud on open/date change ─────────────────────────────
async function loadFromCloud() {
  if(!S.user||!WEBAPP_URL) return;
  // If we pushed recently, cloud may not have rebuilt yet — skip week pull
  // to avoid overwriting locally-saved activities with stale cloud data.
  // FIXED 2026-08: this comment always said "still refresh followups/
  // employers in background" but the code only ever actually called
  // pullFollowups() — the Employer/ACAP/Student Lead/Enrolment
  // Pipeline/Commencements caches were silently skipped for the full 90s
  // guard window on every call made during that window (not just this one
  // — every loadFromCloud() call, e.g. from a manual refresh-icon tap or a
  // page reload shortly after any push, hit this same branch). Those
  // caches are independent read-only reference lists, not this week's
  // activity data — nothing about refreshing them risks the
  // overwrite-unsynced-activities problem this guard exists to prevent, so
  // there was never a reason to skip them. See pushData()'s matching note
  // for the main fix this closes the same gap for.
  if(recentlyPushed()) {
    const coord=S.user.coord, state=STATES[coord];
    pullFollowups(coord, state);
    pullEmployers(coord);
    pullAcaps(coord);
    pullStudentLeads(coord);
    pullEnrolmentPipeline(coord);
    pullCommencements(coord);
    return;
  }
  S.loading=true; if(!S.modal) render();
  try {
    const coord=S.user.coord;
    const state=STATES[coord];

    // Pull current week data
    const data=await pullWeek(coord, S.date);
    mergeCloudData(data, coord);

    // Pull all open follow-ups (across all weeks) in background
    pullFollowups(coord, state);
    // Pull employer and ACAP databases in background
    pullEmployers(coord);
    pullAcaps(coord);
    pullEnrolmentPipeline(coord);
    pullStudentLeads(coord);
    pullCommencements(coord);

    S.status={ok:true,msg:"✓ Loaded from cloud — "+new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"})};
  } catch(e){
    const isLocal = location.protocol === "content:" || location.protocol === "file:";
    S.status={ok:false, msg: isLocal ? "⚠ Open via SharePoint/OneDrive link for live sync — local file mode detected." : "Cloud load failed — showing local data. "+friendlyError_(e)};
  }
  S.loading=false; if(!S.modal) render();
}

// Re-fires the WIP write for a follow-up that's Completed locally but that
// the server still reports as open — i.e. confirmCloseFollowup's original
// postBestEffort call for it was lost. Rebuilds the same payload
// confirmCloseFollowup sends, from the fields it already stored on the
// closed activity record (closeOutcome/closeNotes/justification/
// closedDate/meaningful) — same branching (ACAP org / student name /
// employer bizName) as confirmCloseFollowup itself, just sourced from the
// saved record instead of the close modal's form fields. Best-effort, same
// as the original call: if this retry is also lost, the next pull tries
// again, and the local UI never regresses back to "open" in the meantime.
function retryFollowupClose_(coord, act) {
  if (!act || !act.id) return;
  const isAcapClose = act.type==="acap_contact"||act.type==="acap_f2f";
  const isStudentClose = act.type==="lead"||act.type==="enrolment_pipeline";
  const acapOrgClose = isAcapClose ? (act.acapOrg||act.bizName||"") : "";
  const studentName2 = isStudentClose ? (act.studentName||act.leadName||"") : "";
  const bizName2 = (!isAcapClose && !isStudentClose) ? (act.bizName||"") : "";
  const isMeaningful = !!act.meaningful;
  const today_ = act.closedDate || TODAY;
  let nextDate = "";
  if (!isMeaningful) {
    const n = new Date(today_+"T12:00:00"); n.setDate(n.getDate()+42);
    nextDate = n.toISOString().substring(0,10);
  }
  const fuAction = act.closeOutcome==="Do not contact — removed from list"
    ? "do_not_contact"
    : isMeaningful ? "closed_meaningful" : "closed_no_contact";

  if (isAcapClose && acapOrgClose) {
    postBestEffort({type:"update_acap_followup",coord,org:acapOrgClose,id:act.id,
      nextContactDate:nextDate,lastContactDate:today_,action:fuAction,
      notes:act.closeNotes||"",justification:act.justification||""});
  } else if (isStudentClose && studentName2) {
    postBestEffort({type:"update_student_followup",coord,name:studentName2,leadType:act.type,
      nextContactDate:nextDate,lastContactDate:today_,action:fuAction,
      notes:act.closeNotes||"",justification:act.justification||""});
  } else if (bizName2) {
    postBestEffort({type:"update_employer_followup",coord,bizName:bizName2,id:act.id,
      nextContactDate:nextDate,lastContactDate:today_,action:fuAction,
      notes:act.closeNotes||"",justification:act.justification||""});
  }
}

async function pullFollowups(coord, state) {
  try {
    const url=WEBAPP_URL+"?action=get_followups&coord="+encodeURIComponent(coord)+"&state="+state;
    const data=await jsonpFetch(url);
    if(!data.ok) return;
    // Merge follow-up activities into their respective days in localStorage
    // Always update existing entries so phone/name changes come through
    //
    // 2026-08-07 fix for Bec's report ("closed follow-ups still showing as
    // overdue the next day"): closing a follow-up (confirmCloseFollowup)
    // marks it Completed locally straight away, then fires the actual WIP
    // write via postBestEffort — a fire-and-forget background call with no
    // retry. If that single request is ever dropped (network blip, a cold
    // Apps Script start, anything), the WIP sheet's Follow-Up Date is never
    // actually cleared, even though the coordinator saw a success message.
    // get_followups only ever returns still-OPEN items (see appscript.js
    // getOpenFollowups) — so if THIS pull, at every next load, still
    // reports an id we've already marked Completed locally, that's exactly
    // this situation: the close never reached the backend. Blindly
    // overwriting the local record with the server's stale "still open"
    // version (the old behaviour) is what made a closed follow-up
    // reappear as overdue. Now: keep showing it as closed (never regress
    // the UI), and retry the close in the background so the WIP sheet
    // eventually catches up instead of staying silently out of sync.
    const locallyClosedIds = new Set();
    (data.followups||[]).forEach(a=>{
      if(!a.date) return;
      const day=loadDay(coord, a.date);
      if(!day.activities) day.activities=[];
      const idx=day.activities.findIndex(x=>x.id===a.id);
      if(idx>=0) {
        const existing=day.activities[idx];
        const locallyClosed = existing.status==="Completed"||existing.status==="Closed";
        if (locallyClosed) {
          locallyClosedIds.add(a.id);
          retryFollowupClose_(coord, existing);
          // don't overwrite — the local Completed record is the correct
          // one; the server just hasn't caught up yet.
        } else {
          day.activities[idx]=a; // update existing
        }
      } else {
        day.activities.push(a);      // add new
      }
      saveDay(day);
    });
    // Cache the full followups list for due-today and overdue checks —
    // excluding anything we just determined is actually already closed
    // locally (see above), so getAllDueToday's followups-cache fallback
    // can't resurrect it either.
    try{localStorage.setItem(PFX+"followups:"+coord,JSON.stringify((data.followups||[]).filter(a=>!locallyClosedIds.has(a.id))));}catch(e_){}
    if(!S.modal) render();
  } catch(e){
    // silent
  }
}

// GLOBAL ERROR CAPTURE — surfaces uncaught errors visibly and keeps a
// log, since silent JS errors on mobile are otherwise invisible to us.
// ═══════════════════════════════════════════════════════════
window._errorLog = [];
window.addEventListener("error", function(e){
  const msg = (e.error && e.error.stack) ? e.error.stack : e.message;
  window._errorLog.push(new Date().toLocaleTimeString()+" | "+msg);
  try{ lsSet("errorLog", window._errorLog); }catch(e_){}
  alert("⚠ App error caught:\n\n"+msg+"\n\nThe app state was NOT reset — check if your form data is still there. If not, use Settings → 'Show error log' and share it.");
});
window.addEventListener("unhandledrejection", function(e){
  const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  window._errorLog.push(new Date().toLocaleTimeString()+" | (promise) "+msg);
  try{ lsSet("errorLog", window._errorLog); }catch(e_){}
  alert("⚠ App error caught (async):\n\n"+msg);
});
function showErrorLog(){
  const log = lsGet("errorLog") || [];
  if(!log.length){ alert("No errors logged since last page load/clear."); return; }
  alert("Error log ("+log.length+"):\n\n"+log.slice(-15).join("\n\n"));
}
function clearErrorLog(){
  window._errorLog=[];
  try{ localStorage.removeItem(lsKey("errorLog")); }catch(e){}
  alert("Error log cleared.");
}

// Realtime push — debounced 3 seconds after activity save
let _pushDebounceTimer = null;
let _lastPushTime = 0;
function schedulePush() {
  if(_pushDebounceTimer) clearTimeout(_pushDebounceTimer);
  _lastPushTime = Date.now(); // Mark push pending immediately — guard cloud pulls
  _pushDebounceTimer = setTimeout(function(){
    if(S.unsyncedChanges && !S.syncing && S.user) {
      pushData();
    }
  }, 3000);
}

function recentlyPushed() {
  // Returns true if a push happened in the last 90 seconds (cloud may be stale)
  return (Date.now() - _lastPushTime) < 90000;
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
render();
// Load from cloud after initial render
if(S.user) loadFromCloud();

// Auto-push every 5 minutes if there are unsynced changes
// Auto-push every 5 minutes as fallback
setInterval(function(){
  if(S.unsyncedChanges && !S.syncing && S.user) pushData();
}, 5*60*1000);


// Warn before closing if unsynced
window.addEventListener("beforeunload", function(e){
  if(S.unsyncedChanges){
    e.preventDefault();
    e.returnValue="You have unsynced changes. Push to Sheets before closing?";
  }
});

// ADDED 2026-08-03: push immediately when the tab/app is backgrounded, not
// just when it's actually closed. Mobile browsers routinely suspend or
// heavily throttle JavaScript timers (including the 3-second debounce and
// the 5-minute fallback above) once a tab is backgrounded or the phone is
// locked — so on mobile specifically, a coordinator switching apps right
// after logging something could otherwise leave it stuck local-only well
// past 5 minutes, with no beforeunload warning either (that only fires on
// an actual close, which backgrounding is not). visibilitychange fires
// reliably in this situation across modern mobile and desktop browsers;
// pagehide is added as a second signal for browsers/cases where
// visibilitychange alone doesn't cover an actual navigation-away.
function pushOnBackground(){
  if(S.unsyncedChanges && !S.syncing && S.user) pushData();
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="hidden") pushOnBackground();
});
window.addEventListener("pagehide", pushOnBackground);
</script>
